<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>玄憶｜玄境 AI</title>
<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#05030b;
    color:#f4efff;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
    overflow-x:hidden;
}
/* =========================
   紫色星光核心背景
========================= */
body{
    position:relative;
    overflow-x:hidden;
}
#stars{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
}
.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#cda8ff;
    box-shadow:
        0 0 5px #a45cff,
        0 0 10px rgba(164,92,255,.45);
    opacity:.35;
    animation:twinkle var(--duration) ease-in-out infinite;
}
@keyframes twinkle{
    0%,100%{
        opacity:.18;
        transform:scale(.7);
    }
    50%{
        opacity:.9;
        transform:scale(1.35);
    }
}
.nebula{
    position:fixed;
    pointer-events:none;
    z-index:0;
    border-radius:50%;
    filter:blur(70px);
    opacity:.2;
}
.nebula.one{
    width:420px;
    height:420px;
    top:-150px;
    right:-120px;
    background:radial-gradient(
        circle,
        rgba(129,60,255,.65),
        rgba(74,25,150,.2),
        transparent 70%
    );
}
.nebula.two{
    width:500px;
    height:500px;
    bottom:-230px;
    left:-180px;
    background:radial-gradient(
        circle,
        rgba(107,46,200,.5),
        rgba(47,16,100,.18),
        transparent 70%
    );
}
.meteor{
    position:fixed;
    width:120px;
    height:1px;
    background:linear-gradient(
        90deg,
        rgba(203,153,255,0),
        rgba(203,153,255,.95),
        rgba(255,255,255,.9)
    );
    box-shadow:0 0 8px rgba(177,103,255,.9);
    transform:rotate(-28deg);
    pointer-events:none;
    z-index:1;
    opacity:0;
}
.meteor.show{
    animation:meteorMove 1.1s linear forwards;
}
@keyframes meteorMove{
    0%{
        opacity:0;
        transform:translate(0,0) rotate(-28deg);
    }
    10%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:translate(-260px,260px) rotate(-28deg);
    }
}
/* =========================
   主內容
========================= */
.page{
    position:relative;
    z-index:2;
    width:100%;
    min-height:100vh;
}
/* =========================
   頂部
========================= */
.topbar{
    position:sticky;
    top:0;
    z-index:20;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(5,3,11,.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(180,120,255,.12);
}
.brand{
    display:flex;
    align-items:center;
    gap:10px;
}
.brand-mark{
    width:30px;
    height:30px;
    border:1px solid rgba(195,148,255,.55);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
        0 0 12px rgba(145,74,255,.25),
        inset 0 0 10px rgba(145,74,255,.1);
}
.brand-mark svg{
    width:16px;
    height:16px;
    stroke:#d5b3ff;
    fill:none;
    stroke-width:1.4;
}
.brand-text{
    font-size:16px;
    letter-spacing:2px;
}
.home-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid rgba(196,151,255,.28);
    background:rgba(91,45,155,.12);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}
.home-btn svg{
    width:20px;
    height:20px;
    stroke:#d6b8ff;
    fill:none;
    stroke-width:1.5;
}
/* =========================
   標題
========================= */
.hero{
    padding:38px 20px 20px;
    text-align:center;
}
.hero-symbol{
    width:66px;
    height:66px;
    margin:0 auto 18px;
    border-radius:50%;
    border:1px solid rgba(190,139,255,.38);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
        0 0 25px rgba(131,62,221,.2),
        inset 0 0 25px rgba(131,62,221,.1);
}
.hero-symbol svg{
    width:32px;
    height:32px;
    stroke:#d4aaff;
    fill:none;
    stroke-width:1.2;
}
.hero h1{
    margin:0;
    font-size:30px;
    font-weight:500;
    letter-spacing:6px;
}
.hero p{
    margin:12px 0 0;
    color:#9f91b5;
    font-size:14px;
    line-height:1.8;
}
/* =========================
   內容區
========================= */
.container{
    width:min(760px,calc(100% - 32px));
    margin:0 auto;
    padding-bottom:60px;
}
.panel{
    margin-top:18px;
    padding:18px;
    border-radius:20px;
    border:1px solid rgba(184,130,255,.16);
    background:rgba(20,12,34,.62);
    box-shadow:
        0 12px 40px rgba(0,0,0,.25),
        inset 0 0 30px rgba(116,54,190,.035);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}
/* =========================
   搜尋
========================= */
.search-box{
    display:flex;
    align-items:center;
    gap:10px;
    height:48px;
    padding:0 14px;
    border-radius:14px;
    border:1px solid rgba(186,137,255,.16);
    background:rgba(7,4,15,.55);
}
.search-box svg{
    width:19px;
    height:19px;
    stroke:#aa8acb;
    fill:none;
    stroke-width:1.5;
    flex:none;
}
.search-box input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:#f5efff;
    font-size:15px;
}
.search-box input::placeholder{
    color:#766b86;
}
/* =========================
   篩選
========================= */
.filters{
    display:flex;
    gap:8px;
    margin-top:12px;
    overflow-x:auto;
    overflow-y:hidden;
    padding-bottom:2px;
    scrollbar-width:none;
}
.filters::-webkit-scrollbar{
    display:none;
}
.filter-btn{
    flex:none;
    height:34px;
    padding:0 13px;
    border-radius:18px;
    border:1px solid rgba(180,130,255,.16);
    background:rgba(76,39,124,.10);
    color:#9f91b5;
    font-size:13px;
    cursor:pointer;
}
.filter-btn.active{
    color:#eadcff;
    border-color:rgba(195,145,255,.42);
    background:rgba(126,69,205,.20);
    box-shadow:0 0 16px rgba(126,69,205,.12);
}
/* =========================
   記憶卡片
========================= */
.memory-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}
.memory-card{
    position:relative;
    padding:17px;
    border-radius:17px;
    border:1px solid rgba(180,130,255,.12);
    background:rgba(8,5,16,.48);
    transition:.25s ease;
}
.memory-card:hover{
    border-color:rgba(190,140,255,.25);
    box-shadow:0 0 24px rgba(123,62,205,.08);
}
.memory-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}
.memory-type{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:#cba9f2;
    font-size:12px;
}
.memory-type-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#b87aff;
    box-shadow:0 0 8px rgba(184,122,255,.7);
}
.memory-date{
    color:#665b73;
    font-size:11px;
}
.memory-content{
    margin-top:12px;
    color:#e8e0f1;
    font-size:14px;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word;
}
.memory-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
}
.memory-source{
    color:#71667d;
    font-size:11px;
}
.memory-actions{
    display:flex;
    gap:7px;
}
.icon-btn{
    width:34px;
    height:34px;
    border-radius:10px;
    border:1px solid rgba(183,135,255,.13);
    background:rgba(93,48,150,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}
.icon-btn svg{
    width:16px;
    height:16px;
    fill:none;
    stroke:#a996b9;
    stroke-width:1.4;
}
.icon-btn.delete:hover{
    border-color:rgba(255,100,160,.35);
}
.icon-btn.delete:hover svg{
    stroke:#e995bb;
}
/* =========================
   空狀態
========================= */
.empty{
    text-align:center;
    padding:50px 20px;
    color:#71667e;
}
.empty svg{
    width:42px;
    height:42px;
    stroke:#806695;
    fill:none;
    stroke-width:1.2;
    margin-bottom:14px;
}
.empty p{
    margin:0;
    font-size:14px;
}
/* =========================
   載入
========================= */
.loading{
    text-align:center;
    padding:35px;
    color:#897b98;
    font-size:13px;
}
/* =========================
   編輯視窗
========================= */
.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(8px);
}
.modal.show{
    display:flex;
}
.modal-box{
    width:min(760px,100%);
    max-height:88vh;
    overflow-y:auto;
    padding:22px;
    border-radius:24px 24px 0 0;
    background:#10091a;
    border:1px solid rgba(190,140,255,.18);
    box-shadow:0 -10px 50px rgba(0,0,0,.45);
}
.modal-title{
    font-size:18px;
    letter-spacing:2px;
    margin-bottom:18px;
}
.form-group{
    margin-bottom:14px;
}
.form-group label{
    display:block;
    margin-bottom:7px;
    color:#9585a6;
    font-size:12px;
}
.form-group input,
.form-group textarea{
    width:100%;
    border:1px solid rgba(180,130,255,.15);
    outline:0;
    border-radius:12px;
    background:rgba(5,3,10,.65);
    color:#f4edfc;
    padding:12px;
    font-size:14px;
}
.form-group textarea{
    min-height:130px;
    resize:vertical;
    line-height:1.7;
}
.modal-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
}
.modal-actions button{
    flex:1;
    height:44px;
    border-radius:12px;
    border:1px solid rgba(180,130,255,.18);
    background:rgba(83,43,137,.13);
    color:#cbb5df;
    cursor:pointer;
}
.modal-actions .save{
    background:rgba(126,69,205,.28);
    border-color:rgba(191,142,255,.35);
    color:#f0ddff;
}
/* =========================
   手機
========================= */
@media(max-width:600px){
    .topbar{
        height:62px;
        padding:0 14px;
    }
    .hero{
        padding-top:30px;
    }
    .hero h1{
        font-size:26px;
    }
    .container{
        width:calc(100% - 24px);
    }
    .panel{
        padding:14px;
        border-radius:18px;
    }
}
</style>
</head>
<body>
<!-- 紫色星光 -->
<div id="stars"></div>
<div class="nebula one"></div>
<div class="nebula two"></div>
<div id="meteor" class="meteor"></div>
<div class="page">
<!-- 頂部 -->
<div class="topbar">
    <div class="brand">
        <div class="brand-mark">
            <svg viewBox="0 0 24 24">
                <path d="M12 3
                         C8 6 6 9 6 13
                         C6 17 8.8 20 12 21
                         C15.2 20 18 17 18 13
                         C18 9 16 6 12 3Z"/>
                <path d="M9 14
                         C10 12 11 11 12 9
                         C13 11 14 12 15 14"/>
            </svg>
        </div>
        <div class="brand-text">玄憶</div>
    </div>
    <button class="home-btn" onclick="location.href='home.html'" aria-label="Home">
        <svg viewBox="0 0 24 24">
            <path d="M3 10.5L12 3l9 7.5"/>
            <path d="M5.5 9.5V21h13V9.5"/>
            <path d="M9.5 21v-6h5v6"/>
        </svg>
    </button>
</div>
<!-- 標題 -->
<section class="hero">
    <div class="hero-symbol">
        <svg viewBox="0 0 32 32">
            <path d="M16 4
                     C10 8 7 12 7 17
                     C7 23 11 27 16 28
                     C21 27 25 23 25 17
                     C25 12 22 8 16 4Z"/>
            <path d="M11 18
                     C12.5 15.5 14 14 16 11
                     C18 14 19.5 15.5 21 18"/>
        </svg>
    </div>
    <h1>玄憶</h1>
    <p>
        你選擇留下的事情，<br>
        都會安靜地存在這裡。
    </p>
</section>
<main class="container">
    <!-- 搜尋 -->
    <section class="panel">
        <div class="search-box">
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"/>
                <path d="M16.5 16.5L21 21"/>
            </svg>
            <input
                id="searchInput"
                type="text"
                placeholder="搜尋你的記憶……"
                autocomplete="off"
            >
        </div>
        <div class="filters">
            <button class="filter-btn active" data-type="all">
                全部
            </button>
            <button class="filter-btn" data-type="preference">
                偏好
            </button>
            <button class="filter-btn" data-type="life">
                生活
            </button>
            <button class="filter-btn" data-type="work">
                工作
            </button>
            <button class="filter-btn" data-type="important">
                重要
            </button>
        </div>
    </section>
    <!-- 記憶 -->
    <section class="panel">
        <div id="memoryList" class="memory-list">
            <div class="loading">
                正在讀取你的玄憶……
            </div>
        </div>
    </section>
</main>
</div>
<!-- 編輯視窗 -->
<div id="editModal" class="modal">
<div class="modal-box">
    <div class="modal-title">編輯玄憶</div>
    <div class="form-group">
        <label>記憶內容</label>
        <textarea id="editContent"></textarea>
    </div>
    <div class="form-group">
        <label>類型</label>
        <input id="editType" type="text">
    </div>
    <div class="modal-actions">
        <button onclick="closeEdit()">
            取消
        </button>
        <button class="save" onclick="saveEdit()">
            保存
        </button>
    </div>
</div>
</div>
<script src="config.js"></script>
<script>
/* =====================================================
   紫色星光
===================================================== */
const stars = document.getElementById("stars");
for(let i = 0; i < 150; i++){
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    const size = Math.random() < .82 ? 1 : 2;
    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.setProperty(
        "--duration",
        (2 + Math.random() * 5) + "s"
    );
    star.style.animationDelay =
        (-Math.random() * 5) + "s";
    stars.appendChild(star);
}
/* =====================================================
   偶爾流星
===================================================== */
const meteor = document.getElementById("meteor");
function createMeteor(){
    meteor.classList.remove("show");
    meteor.style.left =
        (20 + Math.random() * 90) + "%";
    meteor.style.top =
        (5 + Math.random() * 35) + "%";
    void meteor.offsetWidth;
    meteor.classList.add("show");
    const next =
        8000 + Math.random() * 12000;
    setTimeout(createMeteor, next);
}
setTimeout(createMeteor, 5000);
/* =====================================================
   Supabase
===================================================== */
const SUPABASE_URL =
    (typeof XUANJING_CONFIG !== "undefined" &&
     XUANJING_CONFIG.supabase)
        ? XUANJING_CONFIG.supabase.url
        : "https://zuypaeagxjezlqdppvnm.supabase.co";
const SUPABASE_ANON_KEY =
    (typeof XUANJING_CONFIG !== "undefined" &&
     XUANJING_CONFIG.supabase)
        ? XUANJING_CONFIG.supabase.anonKey
        : "";
/* =====================================================
   狀態
===================================================== */
let memories = [];
let currentFilter = "all";
let editingId = null;
/* =====================================================
   取得登入使用者 Token
===================================================== */
function getAuthToken(){
    const keys = Object.keys(localStorage);
    for(const key of keys){
        if(
            key.includes("auth-token") ||
            key.startsWith("sb-")
        ){
            try{
                const value =
                    JSON.parse(localStorage.getItem(key));
                if(value && value.access_token){
                    return value.access_token;
                }
            }catch(e){}
        }
    }
    return null;
}
/* =====================================================
   讀取 Memories
===================================================== */
async function loadMemories(){
    const list =
        document.getElementById("memoryList");
    list.innerHTML =
        '<div class="loading">正在讀取你的玄憶……</div>';
    try{
        const token = getAuthToken();
        if(!token){
            list.innerHTML = `
                <div class="empty">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 8v4"/>
                        <path d="M12 16h.01"/>
                    </svg>
                    <p>
                        尚未取得登入狀態。<br>
                        請先登入玄境。
                    </p>
                </div>
            `;
            return;
        }
        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/memories?select=*&order=created_at.desc",
            {
                headers:{
                    "apikey":SUPABASE_ANON_KEY,
                    "Authorization":"Bearer " + token,
                    "Content-Type":"application/json"
                }
            }
        );
        if(!response.ok){
            throw new Error(
                "讀取失敗：" + response.status
            );
        }
        memories = await response.json();
        renderMemories();
    }catch(error){
        console.error(error);
        list.innerHTML = `
            <div class="empty">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 8v4"/>
                    <path d="M12 16h.01"/>
                </svg>
                <p>
                    暫時無法讀取玄憶。<br>
                    請稍後再試。
                </p>
            </div>
        `;
    }
}
/* =====================================================
   顯示 Memories
===================================================== */
function renderMemories(){
    const list =
        document.getElementById("memoryList");
    const search =
        document.getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();
    let result = memories.filter(memory => {
        const type =
            (memory.memory_type || "").toLowerCase();
        const content =
            (memory.content || "").toLowerCase();
        const matchSearch =
            !search ||
            content.includes(search) ||
            type.includes(search);
        const matchType =
            currentFilter === "all" ||
            type === currentFilter;
        return matchSearch && matchType;
    });
    if(result.length === 0){
        list.innerHTML = `
            <div class="empty">
                <svg viewBox="0 0 24 24">
                    <path d="M4 6h16"/>
                    <path d="M6 6v14h12V6"/>
                    <path d="M9 6V4h6v2"/>
                    <path d="M9 10v6"/>
                    <path d="M12 10v6"/>
                    <path d="M15 10v6"/>
                </svg>
                <p>
                    這裡暫時沒有找到相關記憶。
                </p>
            </div>
        `;
        return;
    }
    list.innerHTML =
        result.map(memory => {
            const date =
                memory.created_at
                    ? new Date(memory.created_at)
                        .toLocaleString("zh-TW")
                    : "";
            return `
                <article class="memory-card">
                    <div class="memory-top">
                        <div class="memory-type">
                            <span class="memory-type-dot"></span>
                            ${escapeHtml(
                                memory.memory_type || "一般"
                            )}
                        </div>
                        <div class="memory-date">
                            ${escapeHtml(date)}
                        </div>
                    </div>
                    <div class="memory-content">
                        ${escapeHtml(memory.content || "")}
                    </div>
                    <div class="memory-bottom">
                        <div class="memory-source">
                            ${escapeHtml(
                                memory.source || "玄境"
                            )}
                        </div>
                        <div class="memory-actions">
                            <button
                                class="icon-btn"
                                onclick="openEdit('${memory.id}')"
                                aria-label="編輯"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path d="M4 20h4L19 9l-4-4L4 16v4Z"/>
                                    <path d="M13.5 6.5l4 4"/>
                                </svg>
                            </button>
                            <button
                                class="icon-btn delete"
                                onclick="deleteMemory('${memory.id}')"
                                aria-label="刪除"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path d="M4 7h16"/>
                                    <path d="M10 11v6"/>
                                    <path d="M14 11v6"/>
                                    <path d="M8 7l1-3h6l1 3"/>
                                    <path d="M6 7l1 14h10l1-14"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </article>
            `;
        }).join("");
}
/* =====================================================
   HTML 安全處理
===================================================== */
function escapeHtml(value){
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
/* =====================================================
   搜尋
===================================================== */
document
    .getElementById("searchInput")
    .addEventListener("input", renderMemories);

===================================================== */
document

/* =====================================================
   編輯
===================================================== */
function openEdit(id){
    const memory =
        memories.find(item => item.id === id);
    if(!memory) return;
    editingId = id;
    document
        .getElementById("editContent")
        .value = memory.content || "";
    document
        .getElementById("editType")
        .value = memory.memory_type || "";
    document
        .getElementById("editModal")
        .classList.add("show");
}
function closeEdit(){
    editingId = null;
    document
        .getElementById("editModal")
        .classList.remove("show");
}
async function saveEdit(){
    if(!editingId) return;
    const token = getAuthToken();
    if(!token){
        alert("尚未登入。");
        return;
    }
    const content =
        document
            .getElementById("editContent")
            .value
            .trim();
    const memoryType =
        document
            .getElementById("editType")
            .value
            .trim();
    if(!content){
        alert("記憶內容不能為空。");
        return;
    }
    try{
        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/memories?id=eq." +
            encodeURIComponent(editingId),
            {
                method:"PATCH",
                headers:{
                    "apikey":SUPABASE_ANON_KEY,
                    "Authorization":"Bearer " + token,
                    "Content-Type":"application/json",
                    "Prefer":"return=minimal"
                },
                body:JSON.stringify({
                    content:content,
                    memory_type:
                        memoryType || "一般",
                    updated_at:
                        new Date().toISOString()
                })
            }
        );
        if(!response.ok){
            throw new Error("保存失敗");
        }
        closeEdit();
        await loadMemories();
    }catch(error){
        console.error(error);
        alert("保存失敗，請稍後再試。");
    }
}
/* =====================================================
   刪除
===================================================== */
async function deleteMemory(id){
    const ok =
        confirm("確定要刪除這段玄憶嗎？");
    if(!ok) return;
    const token = getAuthToken();
    if(!token){
        alert("尚未登入。");
        return;
    }
    try{
        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/memories?id=eq." +
            encodeURIComponent(id),
            {
                method:"DELETE",
                headers:{
                    "apikey":SUPABASE_ANON_KEY,
                    "Authorization":"Bearer " + token
                }
            }
        );
        if(!response.ok){
            throw new Error("刪除失敗");
        }
        await loadMemories();
    }catch(error){
        console.error(error);
        alert("刪除失敗，請稍後再試。");
    }
}
/* =====================================================
   防止整頁左右滑動
   允許上下正常滾動
===================================================== */
let startX = 0;
let startY = 0;
document.addEventListener(
    "touchstart",
    event => {
        if(event.touches.length !== 1) return;
        startX =
            event.touches[0].clientX;
        startY =
            event.touches[0].clientY;
    },
    {passive:true}
);
document.addEventListener(
    "touchmove",
    event => {
        if(event.touches.length !== 1) return;
        const x =
            event.touches[0].clientX;
        const y =
            event.touches[0].clientY;
        const dx = x - startX;
        const dy = y - startY;
        /*
         * 只有當水平移動明顯大於垂直移動時，
         * 才阻止整頁水平移動。
         */
        if(Math.abs(dx) > Math.abs(dy) &&
           Math.abs(dx) > 8){
            event.preventDefault();
        }
    },
    {passive:false}
);
/* =====================================================
   啟動
===================================================== */
loadMemories();
