<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>玄境</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
      background: #02030a;
      color: white;
    }

    body {
      position: relative;
    }

    /* =========================
       星空背景
    ========================= */

    .space {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(
          circle at center,
          rgba(55, 45, 110, 0.25),
          rgba(2, 3, 10, 0.95) 65%
        ),
        #02030a;
    }

    /* 星星 */

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.8) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,0.45) 1px, transparent 1px),
        radial-gradient(circle, rgba(150,180,255,0.5) 1px, transparent 1px);

      background-size:
        90px 90px,
        140px 140px,
        210px 210px;

      background-position:
        10px 20px,
        50px 80px,
        100px 30px;

      animation: starMove 30s linear infinite;
      opacity: 0.7;
    }

    @keyframes starMove {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.08);
      }
    }

    /* =========================
       中央光晕
    ========================= */

    .glow {
      position: absolute;
      left: 50%;
      top: 50%;

      width: 600px;
      height: 600px;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(130, 110, 255, 0.18) 0%,
          rgba(80, 60, 180, 0.08) 35%,
          transparent 70%
        );

      filter: blur(20px);

      animation: glowPulse 5s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%,
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.7;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.15);
        opacity: 1;
      }
    }

    /* =========================
       入口内容
    ========================= */

    .entrance {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      z-index: 10;

      transition:
        opacity 0.8s ease,
        transform 0.8s ease;
    }

    /* =========================
       标题
    ========================= */

    .title {
      position: relative;

      margin-bottom: 15px;

      font-size: clamp(48px, 10vw, 90px);

      font-weight: 300;

      letter-spacing: 0.35em;

      padding-left: 0.35em;

      color: rgba(255,255,255,0.95);

      text-shadow:
        0 0 20px rgba(150,130,255,0.5),
        0 0 50px rgba(100,80,255,0.25);
    }

    .subtitle {
      font-size: 15px;

      letter-spacing: 0.25em;

      padding-left: 0.25em;

      color: rgba(255,255,255,0.55);

      margin-bottom: 65px;
    }

    /* =========================
       中央漩涡
    ========================= */

    .portal {
      position: relative;

      width: 230px;
      height: 230px;

      border-radius: 50%;

      cursor: pointer;

      transition:
        transform 0.5s ease,
        opacity 0.8s ease;

      animation: portalFloat 5s ease-in-out infinite;
    }

    @keyframes portalFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    /* 外圈 */

    .portal::before {
      content: "";

      position: absolute;

      inset: 0;

      border-radius: 50%;

      border:
        1px solid rgba(170,150,255,0.45);

      box-shadow:
        0 0 25px rgba(120,100,255,0.25),
        0 0 60px rgba(100,80,255,0.18),
        inset 0 0 30px rgba(120,100,255,0.15);

      animation: rotate 20s linear infinite;
    }

    /* 第二层 */

    .portal::after {
      content: "";

      position: absolute;

      inset: 20px;

      border-radius: 50%;

      border:
        1px solid rgba(210,200,255,0.35);

      box-shadow:
        inset 0 0 35px rgba(130,110,255,0.3);

      animation: rotateReverse 12s linear infinite;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateReverse {
      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }
    }

    /* 漩涡中心 */

    .portal-core {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 110px;
      height: 110px;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 40% 35%,
          rgba(255,255,255,0.25),
          rgba(100,80,220,0.18) 25%,
          rgba(15,10,45,0.95) 65%,
          #010208 100%
        );

      box-shadow:
        0 0 30px rgba(110,90,255,0.45),
        0 0 80px rgba(80,60,200,0.25);

      overflow: hidden;
    }

    /* 漩涡线条 */

    .portal-core::before {
      content: "";

      position: absolute;

      inset: -30px;

      border-radius: 50%;

      border:
        2px solid rgba(200,190,255,0.3);

      border-right-color: transparent;
      border-bottom-color: transparent;

      animation:
        vortex 4s linear infinite;
    }

    .portal-core::after {
      content: "";

      position: absolute;

      inset: 15px;

      border-radius: 50%;

      border:
        1px solid rgba(255,255,255,0.25);

      border-left-color: transparent;
      border-top-color: transparent;

      animation:
        vortexReverse 3s linear infinite;
    }

    @keyframes vortex {
      from {
        transform: rotate(0deg) scale(0.9);
      }

      to {
        transform: rotate(360deg) scale(1.1);
      }
    }

    @keyframes vortexReverse {
      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }
    }

    /* =========================
       进入文字
    ========================= */

    .enter {
      margin-top: 35px;

      font-size: 14px;

      letter-spacing: 0.2em;

      padding-left: 0.2em;

      color: rgba(255,255,255,0.6);

      transition:
        color 0.3s ease,
        transform 0.3s ease;
    }

    .portal:hover + .enter {
      color: rgba(255,255,255,0.95);

      transform: translateY(-3px);
    }

    .portal:hover {
      transform: scale(1.06);

      filter:
        drop-shadow(
          0 0 30px rgba(130,110,255,0.4)
        );
    }

    /* =========================
       底部文字
    ========================= */

    .bottom-text {
      position: absolute;

      bottom: 28px;

      left: 50%;

      transform: translateX(-50%);

      width: 100%;

      text-align: center;

      font-size: 12px;

      letter-spacing: 0.15em;

      color: rgba(255,255,255,0.25);
    }

    /* =========================
       手机适配
    ========================= */

    @media (max-width: 600px) {

      .title {
        font-size: 52px;
      }

      .subtitle {
        font-size: 13px;

        margin-bottom: 50px;
      }

      .portal {
        width: 190px;
        height: 190px;
      }

      .portal-core {
        width: 90px;
        height: 90px;
      }

      .bottom-text {
        bottom: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="space">

    <div class="stars"></div>

    <div class="glow"></div>

    <div class="entrance" id="entrance">

      <div class="title">
        玄境
      </div>

      <div class="subtitle">
        一个属于你的数字空间
      </div>

      <div
        class="portal"
        id="portal"
        aria-label="进入玄境"
        role="button"
        tabindex="0"
      >

        <div class="portal-core"></div>

      </div>

      <div class="enter">
        点击进入玄境
      </div>

    </div>

    <div class="bottom-text">
      AI · 空间 · 记忆 · 世界 · 现实
    </div>

  </div>


  <script>

    const portal = document.getElementById("portal");
    const entrance = document.getElementById("entrance");

    function enterXuJing() {

      /* 入口开始消失 */

      entrance.style.opacity = "0";

      entrance.style.transform = "scale(1.15)";

      /* 等待动画结束后进入 home.html */

      setTimeout(() => {

        window.location.href = "home.html";

      }, 800);

    }


    /* 鼠标点击 */

    portal.addEventListener("click", enterXuJing);


    /* 手机 / 键盘操作 */

    portal.addEventListener("keydown", function(event) {

      if (
        event.key === "Enter" ||
        event.key === " "
      ) {

        event.preventDefault();

        enterXuJing();

      }

    });

  </script>

</body>
</html>
