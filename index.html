<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玄境 AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
      background: #05030a;
      color: white;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .universe {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, #241638 0%, #0c0714 35%, #030208 75%);
    }

    /* 星空 */
    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
    }

    .stars {
      background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1px);
      background-size: 90px 90px;
      opacity: .35;
      animation: starsMove 18s linear infinite;
    }

    .stars::before {
      background-image:
        radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1px);
      background-size: 137px 137px;
      opacity: .35;
    }

    .stars::after {
      background-image:
        radial-gradient(circle, rgba(255,255,255,.6) 1px, transparent 1px);
      background-size: 211px 211px;
      opacity: .3;
    }

    @keyframes starsMove {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.15);
      }
    }

    /* 中央玄境入口 */
    .portal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(62vw, 430px);
      height: min(62vw, 430px);
      transform: translate(-50%, -50%);
      border-radius: 50%;

      background:
        radial-gradient(
          circle at center,
          #030207 0%,
          #10091b 25%,
          #211032 45%,
          #08040f 70%,
          transparent 72%
        );

      box-shadow:
        0 0 35px rgba(166, 101, 255, .25),
        0 0 100px rgba(101, 61, 190, .25),
        inset 0 0 50px rgba(255,255,255,.04);

      animation: breathe 4s ease-in-out infinite;
      cursor: pointer;
    }

    .portal::before,
    .portal::after {
      content: "";
      position: absolute;
      inset: 4%;
      border-radius: 50%;
      border: 1px solid rgba(205, 158, 255, .35);
    }

    .portal::before {
      animation: rotate 16s linear infinite;
      border-left-color: transparent;
      border-bottom-color: rgba(255,255,255,.55);
    }

    .portal::after {
      inset: 11%;
      animation: rotateReverse 11s linear infinite;
      border-right-color: transparent;
      border-top-color: rgba(170, 111, 255, .6);
    }

    @keyframes breathe {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        transform: translate(-50%, -50%) scale(1.035);
      }
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateReverse {
      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }
    }

    /* 中央文字 */
    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 80%;
      z-index: 2;
      pointer-events: none;
    }

    .title {
      font-size: clamp(42px, 9vw, 76px);
      font-weight: 300;
      letter-spacing: .22em;
      margin-left: .22em;

      background: linear-gradient(
        120deg,
        #ffffff,
        #d9baff,
        #ffffff
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow: 0 0 35px rgba(213, 174, 255, .35);
    }

    .subtitle {
      margin-top: 18px;
      font-size: 14px;
      letter-spacing: .35em;
      margin-left: .35em;
      color: rgba(255,255,255,.62);
    }

    .enter {
      margin-top: 42px;
      padding: 13px 30px;

      border: 1px solid rgba(255,255,255,.3);
      border-radius: 40px;

      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.9);

      font-size: 14px;
      letter-spacing: .18em;

      backdrop-filter: blur(10px);

      transition:
        transform .3s ease,
        background .3s ease,
        border-color .3s ease;
    }

    .portal:hover .enter {
      transform: scale(1.06);
      background: rgba(255,255,255,.09);
      border-color: rgba(220,190,255,.7);
    }

    /* 进入后的页面 */
    .home {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at 50% 45%, #29183a, #08050d 65%);

      opacity: 0;
      visibility: hidden;
      transform: scale(1.15);

      transition:
        opacity 1.2s ease,
        transform 1.2s ease,
        visibility 1.2s;
    }

    .home.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .home h1 {
      font-size: clamp(32px, 7vw, 64px);
      font-weight: 300;
      letter-spacing: .15em;
    }

    .home p {
      margin-top: 20px;
      color: rgba(255,255,255,.55);
      letter-spacing: .12em;
    }

    .back {
      position: absolute;
      bottom: 35px;

      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.7);

      padding: 10px 22px;
      border-radius: 30px;
      cursor: pointer;
    }

    /* 小小的我 */
    .little-me {
      margin-top: 45px;
      width: 90px;
      height: 90px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at 35% 30%, #ffffff, #c9a8ff 35%, #6941a5 70%);

      box-shadow:
        0 0 35px rgba(188, 140, 255, .45);

      font-size: 38px;

      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @media (max-width: 600px) {
      .portal {
        width: 78vw;
        height: 78vw;
      }

      .subtitle {
        font-size: 11px;
      }

      .enter {
        margin-top: 32px;
      }
    }
  </style>
</head>

<body>

  <main class="universe">

    <div class="stars"></div>

    <!-- 玄境入口 -->
    <section class="portal" id="portal">

      <div class="center">
        <div class="title">玄境</div>

        <div class="subtitle">
          一个属于你的数字空间
        </div>

        <div class="enter">
          进入玄境
        </div>
      </div>

    </section>

    <!-- 进入后的个人空间 -->
    <section class="home" id="home">

      <h1>欢迎来到你的玄境</h1>

      <p>
        这里不是一个游戏，而是属于你的空间。
      </p>

      <div class="little-me">
        ✦
      </div>

      <button class="back" id="back">
        返回入口
      </button>

    </section>

  </main>

  <script>
    const portal = document.getElementById("portal");
    const home = document.getElementById("home");
    const back = document.getElementById("back");

    portal.addEventListener("click", () => {
      portal.style.opacity = "0";
      portal.style.transform = "translate(-50%, -50%) scale(2)";

      setTimeout(() => {
        portal.style.display = "none";
        home.classList.add("active");
      }, 800);
    });

    back.addEventListener("click", () => {
      home.classList.remove("active");

      setTimeout(() => {
        portal.style.display = "block";

        setTimeout(() => {
          portal.style.opacity = "1";
          portal.style.transform = "translate(-50%, -50%) scale(1)";
        }, 50);
      }, 800);
    });
  </script>

</body>
</html>
