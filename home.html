<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玄境 AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
      color: #eee;
      background:
        radial-gradient(circle at 50% 30%, #252044 0%, #100e20 42%, #05050b 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1px),
        radial-gradient(circle, rgba(170,150,255,.5) 1px, transparent 1px);
      background-size: 90px 90px, 150px 150px;
      background-position: 10px 20px, 50px 80px;
      opacity: .18;
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(5,5,12,.42);
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 5;
    }

    .logo {
      font-size: 24px;
      letter-spacing: 5px;
      font-weight: 500;
    }

    .top-status {
      font-size: 13px;
      color: #aaa4c7;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 45px 0 70px;
      position: relative;
      z-index: 2;
    }

    .welcome {
      text-align: center;
      margin-bottom: 42px;
    }

    .welcome h1 {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 400;
      letter-spacing: 10px;
      margin-bottom: 14px;
    }

    .welcome p {
      color: #aaa4c7;
      font-size: 15px;
    }

    .main-space {
      min-height: 430px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 28px;
      background:
        radial-gradient(circle at center, rgba(108,86,180,.15), transparent 45%),
        rgba(10,9,20,.65);
      box-shadow:
        0 30px 90px rgba(0,0,0,.45),
        inset 0 0 80px rgba(150,120,255,.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .main-space::before {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      border: 1px solid rgba(180,160,255,.12);
      box-shadow:
        0 0 80px rgba(120,90,220,.08),
        inset 0 0 80px rgba(120,90,220,.05);
    }

    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      background:
        radial-gradient(circle at 35% 30%, #7168a6, #292343 55%, #100e1c);
      border: 1px solid rgba(220,210,255,.22);
      box-shadow:
        0 0 50px rgba(130,110,240,.2),
        inset 0 0 30px rgba(255,255,255,.04);
      position: relative;
      z-index: 2;
      margin-bottom: 24px;
    }

    .avatar.active {
      animation: breathe 2.2s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 50px rgba(130,110,240,.2);
      }

      50% {
        transform: scale(1.045);
        box-shadow: 0 0 75px rgba(150,120,255,.38);
      }
    }

    .little-title {
      position: relative;
      z-index: 2;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .little-subtitle {
      position: relative;
      z-index: 2;
      color: #8f89aa;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .primary-btn {
      position: relative;
      z-index: 2;
      border: 1px solid rgba(220,210,255,.2);
      border-radius: 999px;
      padding: 13px 30px;
      color: #fff;
      background: rgba(100,85,170,.2);
      cursor: pointer;
      font-size: 14px;
      transition: .25s;
      backdrop-filter: blur(10px);
    }

    .primary-btn:hover {
      background: rgba(130,110,210,.32);
      transform: translateY(-2px);
      box-shadow: 0 10px 35px rgba(100,80,180,.2);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 20px;
    }

    .card {
      min-height: 150px;
      padding: 25px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      background: rgba(12,11,24,.65);
      cursor: pointer;
      transition: .25s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(190,170,255,.22);
      background: rgba(22,19,40,.75);
    }

    .card-icon {
      font-size: 27px;
      margin-bottom: 16px;
    }

    .card h3 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .card p {
      color: #858098;
      font-size: 12px;
      line-height: 1.7;
    }

    .section {
      margin-top: 45px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 16px;
    }

    .project-box {
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 24px;
      background: rgba(10,9,20,.55);
      color: #88839b;
      font-size: 14px;
    }

    .status {
      margin-top: 20px;
      padding: 18px 22px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.07);
      background: rgba(7,7,14,.45);
      color: #77728b;
      font-size: 12px;
    }

    /* =========================
       CHAT
    ========================= */

    .chat-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2,2,7,.72);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .chat-overlay.show {
      display: flex;
    }

    .chat-window {
      width: min(760px, 100%);
      height: min(720px, 92vh);
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,.12);
      background:
        linear-gradient(
          180deg,
          rgba(24,21,43,.97),
          rgba(8,8,17,.98)
        );
      box-shadow: 0 35px 100px rgba(0,0,0,.65);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .chat-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #8d82d8;
      box-shadow: 0 0 14px #8d82d8;
    }

    .chat-title span {
      font-size: 16px;
    }

    .close-btn {
      border: 0;
      background: transparent;
      color: #9993ae;
      font-size: 26px;
      cursor: pointer;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      max-width: 82%;
      padding: 14px 17px;
      border-radius: 17px;
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.ai {
      align-self: flex-start;
      background: rgba(55,49,83,.65);
      border: 1px solid rgba(255,255,255,.07);
      color: #eee;
      border-bottom-left-radius: 5px;
    }

    .message.user {
      align-self: flex-end;
      background: rgba(100,82,170,.38);
      border: 1px solid rgba(190,170,255,.12);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .typing {
      display: none;
      align-self: flex-start;
      color: #8f89aa;
      font-size: 13px;
      padding: 4px 5px;
    }

    .typing.show {
      display: block;
    }

    .chat-input-area {
      padding: 15px;
      border-top: 1px solid rgba(255,255,255,.08);
      background: rgba(5,5,11,.55);
    }

    .chat-input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      min-height: 48px;
      max-height: 140px;
      resize: none;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,.1);
      outline: none;
      background: rgba(20,18,34,.85);
      color: #fff;
      padding: 13px 15px;
      font-size: 14px;
      font-family: inherit;
    }

    .chat-input:focus {
      border-color: rgba(170,150,255,.35);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 15px;
      background: rgba(110,92,185,.55);
      color: white;
      cursor: pointer;
      font-size: 19px;
      transition: .2s;
    }

    .send-btn:hover {
      background: rgba(130,110,210,.72);
    }

    .send-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .hint {
      margin-top: 8px;
      color: #656073;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 850px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 560px) {
      .topbar {
        padding: 0 18px;
      }

      .container {
        width: min(100% - 20px, 1180px);
        padding-top: 30px;
      }

      .main-space {
        min-height: 390px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .message {
        max-width: 90%;
      }

      .chat-window {
        height: 94vh;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       TOP
  ========================== -->

  <header class="topbar">
    <div class="logo">玄境</div>
    <div class="top-status">你的私人数字空间</div>
  </header>

  <!-- =========================
       MAIN
  ========================== -->

  <main class="container">

    <section class="welcome">
      <h1>我的玄境</h1>
      <p>这里属于你。</p>
    </section>

    <section class="main-space">

      <div class="avatar" id="avatar">
        ✦
      </div>

      <div class="little-title">
        小小的我
      </div>

      <div class="little-subtitle" id="aiStatus">
        正在等待与你相遇
      </div>

      <button
        class="primary-btn"
        id="openChatBtn"
      >
        和我聊聊
      </button>

    </section>

    <!-- =========================
         CARDS
    ========================== -->

    <section class="cards">

      <div class="card" id="chatCard">
        <div class="card-icon">💬</div>
        <h3>与玄境交流</h3>
        <p>和你的 AI 说说话，想事情，问问题。</p>
      </div>

      <div class="card">
        <div class="card-icon">◈</div>
        <h3>我的事情</h3>
        <p>查看正在进行的事情、目标和任务。</p>
      </div>

      <div class="card">
        <div class="card-icon">✧</div>
        <h3>玄忆</h3>
        <p>属于你的记忆与长期信息。</p>
      </div>

      <div class="card">
        <div class="card-icon">🌌</div>
        <h3>我的世界</h3>
        <p>探索属于你的数字世界。</p>
      </div>

    </section>

    <!-- =========================
         PROJECT
    ========================== -->

    <section class="section">
      <div class="section-title">
        最近的事情
      </div>

      <div class="project-box">
        目前还没有建立项目。
        <br />
        <br />
        以后这里会成为你的「人生操作台」。
      </div>
    </section>

    <div class="status" id="systemStatus">
      玄境 AI：正在连接……
    </div>

  </main>

  <!-- =========================
       CHAT
  ========================== -->

  <div class="chat-overlay" id="chatOverlay">

    <div class="chat-window">

      <div class="chat-header">

        <div class="chat-title">
          <div class="chat-dot"></div>
          <span>玄境 AI</span>
        </div>

        <button
          class="close-btn"
          id="closeChatBtn"
          aria-label="关闭"
        >
          ×
        </button>

      </div>

      <div
        class="messages"
        id="messages"
      >

        <div class="message ai">
          你好，我是玄境里的 AI。
          你可以直接告诉我你现在想做什么。
        </div>

        <div
          class="typing"
          id="typing"
        >
          玄境正在思考……
        </div>

      </div>

      <div class="chat-input-area">

        <div class="chat-input-wrap">

          <textarea
            id="chatInput"
            class="chat-input"
            placeholder="告诉玄境你在想什么……"
            rows="1"
          ></textarea>

          <button
            id="sendBtn"
            class="send-btn"
            title="发送"
          >
            ↑
          </button>

        </div>

        <div class="hint">
          Enter 发送 · Shift + Enter 换行
        </div>

      </div>

    </div>

  </div>


  <script>
    /*
     * =========================================================
     * 玄境 AI
     * Supabase Edge Function
     * ai-chat
     * =========================================================
     */

    // ---------------------------------------------------------
    // ① 你的 Supabase 项目地址
    // ---------------------------------------------------------

    const SUPABASE_URL =
      "https://你的玄境项目.supabase.co";


    // ---------------------------------------------------------
    // ② Supabase 前端公开 Key
    //
    // 注意：
    // 这里放的是 anon / publishable key。
    //
    // 绝对不要放：
    // AIVAULT_API_KEY
    // GEMINI_API_KEY
    // GROQ_API_KEY
    // ---------------------------------------------------------

    const SUPABASE_ANON_KEY =
      "你的-Supabase-anon或publishable-key";


    // ---------------------------------------------------------
    // ③ 玄境 AI Function
    // ---------------------------------------------------------

    const AI_FUNCTION_URL =
      SUPABASE_URL + "/functions/v1/ai-chat";


    // ---------------------------------------------------------
    // DOM
    // ---------------------------------------------------------

    const openChatBtn =
      document.getElementById("openChatBtn");

    const chatCard =
      document.getElementById("chatCard");

    const closeChatBtn =
      document.getElementById("closeChatBtn");

    const chatOverlay =
      document.getElementById("chatOverlay");

    const chatInput =
      document.getElementById("chatInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const messages =
      document.getElementById("messages");

    const typing =
      document.getElementById("typing");

    const avatar =
      document.getElementById("avatar");

    const aiStatus =
      document.getElementById("aiStatus");

    const systemStatus =
      document.getElementById("systemStatus");


    // ---------------------------------------------------------
    // 对话历史
    // ---------------------------------------------------------

    const conversationHistory = [];


    // ---------------------------------------------------------
    // 打开聊天
    // ---------------------------------------------------------

    function openChat() {
      chatOverlay.classList.add("show");

      setTimeout(() => {
        chatInput.focus();
      }, 100);
    }


    // ---------------------------------------------------------
    // 关闭聊天
    // ---------------------------------------------------------

    function closeChat() {
      chatOverlay.classList.remove("show");
    }


    openChatBtn.addEventListener(
      "click",
      openChat
    );

    chatCard.addEventListener(
      "click",
      openChat
    );

    closeChatBtn.addEventListener(
      "click",
      closeChat
    );


    // 点击黑色背景关闭
    chatOverlay.addEventListener(
      "click",
      (event) => {

        if (event.target === chatOverlay) {
          closeChat();
        }

      }
    );


    // ---------------------------------------------------------
    // 添加消息
    // ---------------------------------------------------------

    function addMessage(
      content,
      role
    ) {

      const message =
        document.createElement("div");

      message.className =
        "message " + role;

      message.textContent =
        content;

      messages.insertBefore(
        message,
        typing
      );

      messages.scrollTop =
        messages.scrollHeight;
    }


    // ---------------------------------------------------------
    // AI 正在思考
    // ---------------------------------------------------------

    function setThinking(
      thinking
    ) {

      if (thinking) {

        typing.classList.add("show");

        avatar.classList.add("active");

        aiStatus.textContent =
          "正在思考……";

      } else {

        typing.classList.remove("show");

        avatar.classList.remove("active");

        aiStatus.textContent =
          "我在这里";

      }

      messages.scrollTop =
        messages.scrollHeight;
    }


    // ---------------------------------------------------------
    // 调用玄境 ai-chat
    // ---------------------------------------------------------

    async function callAI(
      userMessage
    ) {

      const response =
        await fetch(
          AI_FUNCTION_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_ANON_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_ANON_KEY
            },

            body: JSON.stringify({

              message:
                userMessage,

              messages:
                conversationHistory

            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data?.error ||
          data?.details ||
          "AI 请求失败"
        );

      }


      if (
        data?.success === false
      ) {

        throw new Error(
          data?.error ||
          "AI 服务返回失败"
        );

      }


      return (
        data?.answer ||
        data?.data?.content ||
        data?.content ||
        "AI 没有返回内容。"
      );

    }


    // ---------------------------------------------------------
    // 发送消息
    // ---------------------------------------------------------

    async function sendMessage() {

      const text =
        chatInput.value.trim();


      if (!text) {
        return;
      }


      // 防止重复发送
      sendBtn.disabled =
        true;

      chatInput.disabled =
        true;


      // 显示用户消息
      addMessage(
        text,
        "user"
      );


      // 清空输入框
      chatInput.value = "";


      // 加入历史
      conversationHistory.push({
        role: "user",
        content: text
      });


      // AI 思考
      setThinking(true);


      try {

        const answer =
          await callAI(text);


        addMessage(
          answer,
          "ai"
        );


        // 加入 AI 历史
        conversationHistory.push({
          role: "assistant",
          content: answer
        });


        systemStatus.textContent =
          "玄境 AI：连接正常";


      } catch (error) {

        console.error(
          "玄境 AI Error:",
          error
        );


        addMessage(
          "暂时无法连接玄境 AI。\n\n" +
          "错误信息：" +
          error.message,
          "ai"
        );


        systemStatus.textContent =
          "玄境 AI：连接失败";


      } finally {

        setThinking(false);

        sendBtn.disabled =
          false;

        chatInput.disabled =
          false;

        chatInput.focus();

      }

    }


    // ---------------------------------------------------------
    // 点击发送
    // ---------------------------------------------------------

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    // ---------------------------------------------------------
    // Enter 发送
    // Shift + Enter 换行
    // ---------------------------------------------------------

    chatInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    // ---------------------------------------------------------
    // 自动调整输入框高度
    // ---------------------------------------------------------

    chatInput.addEventListener(
      "input",
      () => {

        chatInput.style.height =
          "auto";

        chatInput.style.height =
          Math.min(
            chatInput.scrollHeight,
            140
          ) + "px";

      }
    );


    // ---------------------------------------------------------
    // 初始状态
    // ---------------------------------------------------------

    if (
      SUPABASE_URL.includes("你的玄境项目") ||
      SUPABASE_ANON_KEY.includes("你的-Supabase")
    ) {

      systemStatus.textContent =
        "玄境 AI：请先填写 Supabase 配置";

    } else {

      systemStatus.textContent =
        "玄境 AI：已准备";

    }

  </script>

</body>
</html>
