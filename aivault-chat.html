<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Vault Chat</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#fff;background:#05030b}
.app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 0%,rgba(126,76,255,.22),transparent 38%),radial-gradient(circle at 15% 85%,rgba(91,42,180,.14),transparent 32%),#05030b}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.8;background-image:radial-gradient(circle at 8% 14%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 24% 68%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 43% 28%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 66% 18%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 82% 56%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 91% 82%,#fff 0 1px,transparent 1.6px)}
.header{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:10px;padding:0 14px;position:relative;z-index:2;background:rgba(7,3,16,.68);backdrop-filter:blur(18px);border-bottom:1px solid rgba(190,150,255,.12)}
.orb{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 5%,#b47cff 16%,#51208c 48%,transparent 72%);box-shadow:0 0 18px rgba(157,91,255,.65)}
.title{min-width:0}.title strong{display:block;font-size:14px;font-weight:500;letter-spacing:2px}.title span{display:block;margin-top:2px;font-size:9px;color:#a997b9;letter-spacing:1px}
.messages{position:relative;z-index:1;flex:1;overflow:auto;padding:18px 14px 96px;scroll-behavior:smooth}
.empty{text-align:center;color:#a997b9;padding:46px 16px}.empty .big{font-size:26px;color:#eee;margin-bottom:8px}.empty p{margin:0;font-size:12px;line-height:1.8}
.msg{display:flex;margin:10px 0}.msg.user{justify-content:flex-end}.bubble{max-width:84%;padding:11px 13px;border-radius:16px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.msg.ai .bubble{background:rgba(255,255,255,.065);border:1px solid rgba(190,150,255,.14);border-top-left-radius:5px}.msg.user .bubble{background:linear-gradient(135deg,#7137b7,#4d238b);border:1px solid rgba(220,190,255,.18);border-top-right-radius:5px}
.typing{display:none;align-items:center;gap:7px;color:#9f8dad;font-size:11px;padding:4px 4px 9px}.typing.show{display:flex}.dot{width:6px;height:6px;border-radius:50%;background:#b47cff;box-shadow:0 0 9px #a66cff;animation:pulse 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.composer-wrap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(5,2,12,.96) 35%)}
.composer{max-width:820px;margin:auto;display:flex;align-items:flex-end;gap:7px;padding:7px;border-radius:19px;background:rgba(24,9,43,.94);border:1px solid rgba(195,155,255,.2);box-shadow:0 -8px 30px rgba(0,0,0,.28)}
textarea{flex:1;min-width:0;min-height:42px;max-height:120px;resize:none;outline:0;border:0;background:transparent;color:#fff;font:inherit;font-size:14px;line-height:1.5;padding:9px 5px}textarea::placeholder{color:#806f92}
button{width:42px;height:42px;flex:0 0 42px;border-radius:13px;border:1px solid rgba(210,180,255,.16);background:rgba(255,255,255,.06);color:#fff;font-size:17px;cursor:pointer}.send{background:linear-gradient(135deg,#8245cf,#542394);border-color:rgba(220,190,255,.28)}button:disabled{opacity:.45;cursor:default}
.error{color:#ffb8d0;background:rgba(160,20,70,.12)!important;border-color:rgba(255,100,160,.2)!important}
@media(min-width:700px){.messages{padding-left:24px;padding-right:24px}.bubble{max-width:720px}}
</style>
</head>
<body>
<div class="app">
  <div class="stars"></div>
  <header class="header"><div class="orb"></div><div class="title"><strong>玄境 AI</strong><span>AI VAULT · PRIVATE INTELLIGENCE SPACE</span></div></header>
  <main id="messages" class="messages">
    <div id="empty" class="empty"><div class="big">我在。</div><p>你可以直接告訴我你現在想做什麼。<br>我是幻玑。</p></div>
  </main>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="告訴幻玑，你現在想做什麼……"></textarea>
      <button id="send" class="send" aria-label="發送">➤</button>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script>
const API = (window.AI_FUNCTION_URL || (window.SUPABASE_URL ? window.SUPABASE_URL + '/functions/v1/ai-chat' : 'https://zuypaeagxjezlqdppvnm.supabase.co/functions/v1/ai-chat'));
const input=document.getElementById('input');
const send=document.getElementById('send');
const messagesEl=document.getElementById('messages');
const empty=document.getElementById('empty');
let history=[];
let busy=false;

function addMessage(role,text,extraClass=''){
  if(empty) empty.remove();
  const row=document.createElement('div'); row.className='msg '+role;
  const bubble=document.createElement('div'); bubble.className='bubble '+extraClass; bubble.textContent=text;
  row.appendChild(bubble); messagesEl.appendChild(row); messagesEl.scrollTop=messagesEl.scrollHeight;
  return bubble;
}
function setBusy(v){busy=v;send.disabled=v;input.disabled=v;document.body.classList.toggle('busy',v)}
async function ask(){
  const text=input.value.trim();
  if(!text||busy)return;
  input.value=''; input.style.height='auto';
  addMessage('user',text); history.push({role:'user',content:text});
  const thinking=addMessage('ai','幻玑正在思考……');
  thinking.parentElement.classList.add('thinking');
  setBusy(true);
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:'你是玄境 AI 中的幻玑。你的核心原则是以人为本、以人为核心；帮助用户把事情想清楚、做得更稳妥。回答自然、具体、诚实。遇到风险或法律问题，先规避风险并提供合规替代方案。不要声称自己拥有现实世界中不存在的权限。' },...history],temperature:.7,max_tokens:2000})});
    const data=await res.json();
    if(!res.ok||data.success===false) throw new Error(data.error||'AI 服务调用失败');
    const answer=data.answer||data?.data?.choices?.[0]?.message?.content||data?.data?.message||data?.data?.content||'暂时没有得到回答。';
    thinking.textContent=answer;
    history.push({role:'assistant',content:answer});
    messagesEl.scrollTop=messagesEl.scrollHeight;
  }catch(err){
    thinking.textContent='抱歉，暂时无法连接 AI。\n'+(err?.message||'请稍后再试。');
    thinking.classList.add('error');
  }finally{setBusy(false);input.focus()}
}
send.addEventListener('click',ask);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px'});
</script>
</body>
</html>
