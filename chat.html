<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>玄境 AI｜交流</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    background:
        radial-gradient(circle at 50% 0%, rgba(110, 85, 180, 0.14), transparent 42%),
        #08090d;
    color: #f3f0e8;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
}

/* =========================
   頂部
========================= */

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 64px;
    z-index: 50;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(8, 9, 13, 0.86);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.top-title {
    text-align: center;
}

.top-title-main {
    font-size: 17px;
    letter-spacing: 3px;
}

.top-title-sub {
    margin-top: 4px;
    font-size: 10px;
    color: rgba(255,255,255,0.42);
    letter-spacing: 2px;
}

.icon-button {
    position: absolute;

    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    background: transparent;
    color: rgba(255,255,255,0.82);

    cursor: pointer;
}

.icon-button:active {
    opacity: 0.55;
}

.back-button {
    left: 10px;
}

.speaker-button {
    right: 10px;
}

.icon {
    width: 22px;
    height: 22px;

    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* =========================
   狀態
========================= */

.status {
    position: fixed;
    top: 78px;
    left: 0;
    right: 0;

    z-index: 20;

    text-align: center;

    font-size: 11px;
    color: rgba(255,255,255,0.38);
}

.status-dot {
    display: inline-block;

    width: 6px;
    height: 6px;

    margin-right: 5px;

    border-radius: 50%;
    background: #7dd8a6;

    box-shadow: 0 0 10px rgba(125,216,166,0.55);
}

/* =========================
   聊天區
========================= */

.chat-area {
    width: 100%;
    max-width: 820px;

    margin: 0 auto;

    padding:
        112px
        16px
        190px;

    min-height: 100vh;
}

.welcome {
    text-align: center;

    padding: 38px 18px 30px;
}

.welcome-symbol {
    width: 58px;
    height: 58px;

    margin: 0 auto 18px;

    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(circle, rgba(140,110,220,0.16), transparent 65%);

    box-shadow:
        0 0 40px rgba(120,90,220,0.08);
}

.welcome-symbol svg {
    width: 27px;
    height: 27px;

    fill: none;
    stroke: rgba(255,255,255,0.72);
    stroke-width: 1.3;
}

.welcome h1 {
    margin: 0;

    font-size: 22px;
    font-weight: 400;

    letter-spacing: 4px;
}

.welcome p {
    margin: 12px 0 0;

    font-size: 13px;
    line-height: 1.8;

    color: rgba(255,255,255,0.48);
}

/* =========================
   訊息
========================= */

.messages {
    width: 100%;
}

.message-row {
    display: flex;

    width: 100%;

    margin-bottom: 22px;
}

.message-row.user {
    justify-content: flex-end;
}

.message-row.ai {
    justify-content: flex-start;
}

.message {
    max-width: 84%;

    padding: 13px 15px;

    border-radius: 16px;

    font-size: 15px;
    line-height: 1.75;

    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.message.user {
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.08);
}

.message.ai {
    background: rgba(120,95,180,0.08);
    border: 1px solid rgba(150,125,210,0.10);
}

/* =========================
   正在思考
========================= */

.typing {
    display: none;

    align-items: center;
    gap: 5px;

    margin: 4px 0 20px 8px;
}

.typing.show {
    display: flex;
}

.typing span {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: rgba(255,255,255,0.45);

    animation: pulse 1.2s infinite ease-in-out;
}

.typing span:nth-child(2) {
    animation-delay: 0.15s;
}

.typing span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes pulse {
    0%, 60%, 100% {
        opacity: 0.25;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-3px);
    }
}

/* =========================
   輸入區
========================= */

.input-zone {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 40;

    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            to top,
            rgba(8,9,13,0.98) 65%,
            rgba(8,9,13,0.75)
        );

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.input-wrap {
    width: 100%;
    max-width: 820px;

    margin: 0 auto;

    border:
        1px solid rgba(255,255,255,0.10);

    border-radius: 20px;

    background:
        rgba(255,255,255,0.045);

    box-shadow:
        0 10px 40px rgba(0,0,0,0.32);
}

/* =========================
   工具列
========================= */

.toolbar {
    display: flex;
    align-items: center;

    height: 46px;

    padding: 0 6px;
}

.tool-button {
    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    background: transparent;

    color: rgba(255,255,255,0.65);

    cursor: pointer;
}

.tool-button:active {
    opacity: 0.45;
}

.tool-button svg {
    width: 21px;
    height: 21px;

    fill: none;
    stroke: currentColor;

    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.tool-spacer {
    flex: 1;
}

.mode-label {
    margin-right: 8px;

    font-size: 10px;
    letter-spacing: 1px;

    color: rgba(255,255,255,0.30);
}

/* =========================
   輸入框
========================= */

.text-input {
    width: 100%;

    min-height: 48px;
    max-height: 140px;

    padding: 5px 15px 12px;

    border: 0;
    outline: none;

    resize: none;

    background: transparent;

    color: #f5f2ea;

    font-size: 15px;
    line-height: 1.7;

    font-family: inherit;
}

.text-input::placeholder {
    color: rgba(255,255,255,0.28);
}

/* =========================
   發送
========================= */

.send-row {
    display: flex;
    justify-content: flex-end;

    padding: 0 7px 7px;
}

.send-button {
    width: 38px;
    height: 38px;

    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50%;

    background: rgba(255,255,255,0.07);

    color: rgba(255,255,255,0.82);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.send-button:active {
    opacity: 0.5;
}

.send-button svg {
    width: 18px;
    height: 18px;

    fill: none;
    stroke: currentColor;

    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* =========================
   功能選單
========================= */

.plus-menu {
    display: none;

    position: absolute;

    left: 10px;
    bottom: 54px;

    width: 190px;

    padding: 8px;

    border:
        1px solid rgba(255,255,255,0.10);

    border-radius: 15px;

    background:
        rgba(18,19,26,0.96);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 15px 45px rgba(0,0,0,0.45);
}

.plus-menu.show {
    display: block;
}

.menu-item {
    width: 100%;

    display: flex;
    align-items: center;
    gap: 11px;

    padding: 12px 10px;

    border: 0;
    border-radius: 10px;

    background: transparent;

    color: rgba(255,255,255,0.78);

    text-align: left;

    font-family: inherit;
    font-size: 13px;

    cursor: pointer;
}

.menu-item:active {
    background: rgba(255,255,255,0.07);
}

.menu-item svg {
    width: 18px;
    height: 18px;

    fill: none;
    stroke: currentColor;

    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* =========================
   隱藏檔案
========================= */

.hidden-file {
    display: none;
}

/* =========================
   語音狀態
========================= */

.voice-state {
    display: none;

    position: fixed;

    left: 50%;
    bottom: 145px;

    transform: translateX(-50%);

    z-index: 60;

    padding: 12px 18px;

    border:
        1px solid rgba(255,255,255,0.10);

    border-radius: 30px;

    background: rgba(20,21,28,0.94);

    color: rgba(255,255,255,0.76);

    font-size: 12px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.35);
}

.voice-state.show {
    display: block;
}

/* =========================
   響應式
========================= */

@media (min-width: 700px) {

    .chat-area {
        padding-left: 24px;
        padding-right: 24px;
    }

    .message {
        max-width: 72%;
    }
}
</style>
</head>

<body>

<!-- =========================
     頂部
========================= -->

<header class="topbar">

    <!-- 返回 Home -->
    <button
        class="icon-button back-button"
        type="button"
        onclick="goHome()"
        aria-label="返回玄境首頁"
    >
        <svg class="icon" viewBox="0 0 24 24">
            <path d="M15 5l-7 7 7 7"></path>
            <path d="M8 12h11"></path>
        </svg>
    </button>

    <div class="top-title">
        <div class="top-title-main">與玄境交流</div>
        <div class="top-title-sub">你的私人 AI 空間</div>
    </div>

    <!-- AI 語音開關 -->
    <button
        class="icon-button speaker-button"
        id="speakerButton"
        type="button"
        onclick="toggleSpeaker()"
        aria-label="切換 AI 語音"
    >

        <!-- 開啟 -->
        <svg
            id="speakerOn"
            class="icon"
            viewBox="0 0 24 24"
        >
            <path d="M4 10v4h4l5 4V6l-5 4H4"></path>
            <path d="M16 9c1.2 1.2 1.8 2.4 1.8 3s-.6 1.8-1.8 3"></path>
            <path d="M18.5 6.5c2 1.8 3 3.7 3 5.5s-1 3.7-3 5.5"></path>
        </svg>

        <!-- 關閉 -->
        <svg
            id="speakerOff"
            class="icon"
            viewBox="0 0 24 24"
            style="display:none;"
        >
            <path d="M4 10v4h4l5 4V6l-5 4H4"></path>
            <path d="M17 9l4 6"></path>
            <path d="M21 9l-4 6"></path>
        </svg>

    </button>

</header>

<!-- 狀態 -->

<div class="status">
    <span class="status-dot"></span>
    玄境 AI 在線
</div>

<!-- =========================
     聊天
========================= -->

<main class="chat-area">

    <section class="welcome">

        <div class="welcome-symbol">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="7"></circle>
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
            </svg>
        </div>

        <h1>玄境</h1>

        <p>
            你可以直接和玄境說話、輸入文字、傳送照片或影片。<br>
            讓玄境理解你真正想做的事。
        </p>

    </section>

    <section
        class="messages"
        id="messages"
    ></section>

    <div
        class="typing"
        id="typing"
    >
        <span></span>
        <span></span>
        <span></span>
    </div>

</main>

<!-- =========================
     語音狀態
========================= -->

<div
    class="voice-state"
    id="voiceState"
>
    正在聆聽……
</div>

<!-- =========================
     輸入區
========================= -->

<div class="input-zone">

    <div class="input-wrap">

        <!-- 功能選單 -->

        <div
            class="plus-menu"
            id="plusMenu"
        >

            <button
                class="menu-item"
                type="button"
                onclick="chooseCamera()"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M4 7h4l2-2h4l2 2h4v12H4z"></path>
                    <circle cx="12" cy="13" r="3.5"></circle>
                </svg>

                拍照
            </button>

            <button
                class="menu-item"
                type="button"
                onclick="choosePhoto()"
            >
                <svg viewBox="0 0 24 24">
                    <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                    <circle cx="9" cy="9" r="1.5"></circle>
                    <path d="M4 16l4-4 3 3 2-2 7 6"></path>
                </svg>

                照片
            </button>

            <button
                class="menu-item"
                type="button"
                onclick="chooseVideo()"
            >
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="6" width="13" height="12" rx="2"></rect>
                    <path d="M16 10l5-3v10l-5-3"></path>
                </svg>

                影片
            </button>

            <button
                class="menu-item"
                type="button"
                onclick="chooseFile()"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M5 4h9l5 5v11H5z"></path>
                    <path d="M14 4v5h5"></path>
                </svg>

                檔案
            </button>

            <button
                class="menu-item"
                type="button"
                onclick="startDrawing()"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M4 17.5V20h2.5L18 8.5 15.5 6z"></path>
                    <path d="M14.5 7l2.5 2.5"></path>
                </svg>

                AI 繪圖
            </button>

            <button
                class="menu-item"
                type="button"
                onclick="startTranslation()"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M4 5h8"></path>
                    <path d="M8 5c0 5-2 8-5 10"></path>
                    <path d="M6 10c1.5 1.8 3 3 5 4"></path>
                    <path d="M14 16h6"></path>
                    <path d="M17 11l-3 9"></path>
                    <path d="M15.5 16h4"></path>
                </svg>

                即時翻譯
            </button>

        </div>

        <!-- 工具列 -->

        <div class="toolbar">

            <!-- ＋ -->

            <button
                class="tool-button"
                type="button"
                onclick="togglePlusMenu()"
                aria-label="更多功能"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>
                </svg>
            </button>

            <!-- 麥克風 -->

            <button
                class="tool-button"
                id="micButton"
                type="button"
                onclick="toggleVoiceInput()"
                aria-label="語音輸入"
            >
                <svg viewBox="0 0 24 24">
                    <rect x="9" y="3" width="6" height="11" rx="3"></rect>
                    <path d="M5.5 11a6.5 6.5 0 0 0 13 0"></path>
                    <path d="M12 17.5V21"></path>
                    <path d="M8.5 21h7"></path>
                </svg>
            </button>

            <div class="tool-spacer"></div>

            <div
                class="mode-label"
                id="modeLabel"
            >
                文字
            </div>

        </div>

        <!-- 文字 -->

        <textarea
            id="messageInput"
            class="text-input"
            placeholder="和玄境說說話……"
            rows="1"
        ></textarea>

        <!-- 發送 -->

        <div class="send-row">

            <button
                class="send-button"
                type="button"
                onclick="sendMessage()"
                aria-label="發送"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M4 12h15"></path>
                    <path d="M13 6l6 6-6 6"></path>
                </svg>
            </button>

        </div>

    </div>

</div>

<!-- =========================
     隱藏輸入
========================= -->

<input
    id="cameraInput"
    class="hidden-file"
    type="file"
    accept="image/*"
    capture="environment"
/>

<input
    id="photoInput"
    class="hidden-file"
    type="file"
    accept="image/*"
/>

<input
    id="videoInput"
    class="hidden-file"
    type="file"
    accept="video/*"
/>

<input
    id="fileInput"
    class="hidden-file"
    type="file"
    accept=".pdf,.doc,.docx,.txt,.md,.csv,.xlsx,.xls,.zip"
/>

<script>

/* =====================================================
   玄境 AI
===================================================== */

const API_URL =
    "https://zuypaeagxjezlqdppvnm.supabase.co/functions/v1/ai-chat";

/* =====================================================
   狀態
===================================================== */

let conversationHistory = [];

let speakerEnabled = true;

let listening = false;

let recognition = null;

/* =====================================================
   返回 Home
===================================================== */

function goHome() {
    window.location.href = "home.html";
}

/* =====================================================
   喇叭開關
===================================================== */

function toggleSpeaker() {

    speakerEnabled = !speakerEnabled;

    const onIcon =
        document.getElementById("speakerOn");

    const offIcon =
        document.getElementById("speakerOff");

    if (speakerEnabled) {

        onIcon.style.display = "block";
        offIcon.style.display = "none";

        /*
         * 規則：
         * 開啟後，AI 回覆會自動語音播放。
         */

    } else {

        onIcon.style.display = "none";
        offIcon.style.display = "block";

        /*
         * 如果目前有語音正在播放，
         * 關閉喇叭時立即停止。
         */

        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
        }
    }
}

/* =====================================================
   ＋選單
===================================================== */

function togglePlusMenu() {

    const menu =
        document.getElementById("plusMenu");

    menu.classList.toggle("show");
}

function closePlusMenu() {

    document
        .getElementById("plusMenu")
        .classList.remove("show");
}

/* =====================================================
   檔案
===================================================== */

function chooseCamera() {

    closePlusMenu();

    document
        .getElementById("cameraInput")
        .click();
}

function choosePhoto() {

    closePlusMenu();

    document
        .getElementById("photoInput")
        .click();
}

function chooseVideo() {

    closePlusMenu();

    document
        .getElementById("videoInput")
        .click();
}

function chooseFile() {

    closePlusMenu();

    document
        .getElementById("fileInput")
        .click();
}

/* =====================================================
   檔案選擇後
===================================================== */

document
    .getElementById("cameraInput")
    .addEventListener("change", handleFile);

document
    .getElementById("photoInput")
    .addEventListener("change", handleFile);

document
    .getElementById("videoInput")
    .addEventListener("change", handleFile);

document
    .getElementById("fileInput")
    .addEventListener("change", handleFile);

function handleFile(event) {

    const file =
        event.target.files &&
        event.target.files[0];

    if (!file) return;

    addMessage(
        "user",
        "已選擇：" + file.name
    );

    /*
     * 這裡先保留前端入口。
     *
     * 下一步再把照片、影片、文件
     * 真正送到玄境後端，
     * 讓 AI 分析內容。
     */

    event.target.value = "";
}

/* =====================================================
   AI 繪圖
===================================================== */

function startDrawing() {

    closePlusMenu();

    const input =
        document.getElementById("messageInput");

    input.value =
        "幫我生成一張圖片：";

    input.focus();

    document
        .getElementById("modeLabel")
        .textContent = "AI 繪圖";
}

/* =====================================================
   翻譯
===================================================== */

function startTranslation() {

    closePlusMenu();

    const input =
        document.getElementById("messageInput");

    input.value =
        "進入即時翻譯模式。";

    input.focus();

    document
        .getElementById("modeLabel")
        .textContent = "翻譯";
}

/* =====================================================
   語音輸入
===================================================== */

function toggleVoiceInput() {

    if (listening) {

        stopVoiceInput();

    } else {

        startVoiceInput();
    }
}

function startVoiceInput() {

    /*
     * 優先使用瀏覽器 SpeechRecognition。
     */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "目前瀏覽器尚未支援直接語音輸入。"
        );

        return;
    }

    recognition =
        new SpeechRecognition();

    recognition.lang = "zh-TW";

    recognition.continuous = false;

    recognition.interimResults = true;

    recognition.onstart = function() {

        listening = true;

        document
            .getElementById("voiceState")
            .classList.add("show");

        document
            .getElementById("modeLabel")
            .textContent = "聆聽中";
    };

    recognition.onresult = function(event) {

        let finalText = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            finalText +=
                event.results[i][0].transcript;
        }

        document
            .getElementById("messageInput")
            .value = finalText;
    };

    recognition.onerror = function() {

        stopVoiceInput();
    };

    recognition.onend = function() {

        listening = false;

        document
            .getElementById("voiceState")
            .classList.remove("show");

        document
            .getElementById("modeLabel")
            .textContent = "文字";

        /*
         * 語音輸入完成後，
         * 自動送出，不要求使用者再按一次發送。
         */

        const text =
            document
                .getElementById("messageInput")
                .value
                .trim();

        if (text) {
            sendMessage();
        }
    };

    recognition.start();
}

function stopVoiceInput() {

    if (recognition) {

        try {
            recognition.stop();
        } catch (error) {
            console.log(error);
        }
    }

    listening = false;

    document
        .getElementById("voiceState")
        .classList.remove("show");
}

/* =====================================================
   發送訊息
===================================================== */

async function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (!text) return;

    input.value = "";

    autoResize();

    closePlusMenu();

    addMessage("user", text);

    conversationHistory.push({
        role: "user",
        content: text
    });

    showTyping(true);

    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: text,
                    messages: conversationHistory
                })
            });

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        const answer =
            data.reply ||
            data.response ||
            data.message ||
            "玄境目前沒有取得回答。";

        addMessage("ai", answer);

        conversationHistory.push({
            role: "assistant",
            content: answer
        });

        /*
         * 重要：
         *
         * speakerEnabled = true
         * → AI 回覆後自動語音播放
         *
         * speakerEnabled = false
         * → 只顯示文字
         */

        if (speakerEnabled) {

            speakAnswer(answer);
        }

    } catch (error) {

        console.error(error);

        addMessage(
            "ai",
            "目前無法連接玄境 AI，請稍後再試。"
        );

    } finally {

        showTyping(false);
    }
}

/* =====================================================
   顯示訊息
===================================================== */

function addMessage(role, text) {

    const messages =
        document.getElementById("messages");

    const row =
        document.createElement("div");

    row.className =
        "message-row " + role;

    const bubble =
        document.createElement("div");

    bubble.className =
        "message " + role;

    bubble.textContent = text;

    row.appendChild(bubble);

    messages.appendChild(row);

    scrollToBottom();
}

/* =====================================================
   正在思考
===================================================== */

function showTyping(show) {

    document
        .getElementById("typing")
        .classList.toggle("show", show);
}

/* =====================================================
   自動滾動
===================================================== */

function scrollToBottom() {

    window.requestAnimationFrame(() => {

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });

    });
}

/* =====================================================
   AI 語音
===================================================== */

function speakAnswer(text) {

    if (!speakerEnabled) return;

    if (!("speechSynthesis" in window)) {
        return;
    }

    /*
     * 每次新回答前停止上一段。
     */

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "zh-TW";

    utterance.rate = 0.95;

    utterance.pitch = 1;

    /*
     * 直接播放。
     *
     * 不設計播放按鈕。
     */

    window.speechSynthesis.speak(
        utterance
    );
}

/* =====================================================
   Enter 發送
===================================================== */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );

/* =====================================================
   自動調整輸入框
===================================================== */

document
    .getElementById("messageInput")
    .addEventListener(
        "input",
        autoResize
    );

function autoResize() {

    const input =
        document.getElementById("messageInput");

    input.style.height = "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            140
        ) + "px";
}

/* =====================================================
   點外面關閉＋選單
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById("plusMenu");

        const plusButton =
            event.target.closest(
                ".tool-button"
            );

        if (
            !menu.contains(event.target) &&
            !plusButton
        ) {

            closePlusMenu();
        }
    }
);

</script>
