<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>與玄境交流｜玄境 AI</title>
<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#05030b;
    color:#f4efff;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
    overflow:hidden;
}
/* =========================
   紫色星空
========================= */
#stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
}
.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#cba5ff;
    box-shadow:0 0 7px rgba(174,100,255,.9);
    opacity:.4;
    animation:twinkle var(--d) ease-in-out infinite;
}
@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.7);
    }
    50%{
        opacity:.95;
        transform:scale(1.35);
    }
}
.nebula{
    position:fixed;
    z-index:0;
    pointer-events:none;
    border-radius:50%;
    filter:blur(75px);
}
.nebula.one{
    width:420px;
    height:420px;
    top:-170px;
    right:-150px;
    background:rgba(104,42,220,.28);
}
.nebula.two{
    width:500px;
    height:500px;
    left:-230px;
    bottom:-260px;
    background:rgba(90,35,190,.22);
}
#meteor{
    position:fixed;
    width:130px;
    height:1px;
    z-index:1;
    pointer-events:none;
    opacity:0;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(205,157,255,.75),
        #fff
    );
    box-shadow:0 0 10px rgba(170,91,255,.9);
    transform:rotate(-30deg);
}
#meteor.fly{
    animation:meteor 1s linear forwards;
}
@keyframes meteor{
    0%{
        opacity:0;
        transform:translate(0,0) rotate(-30deg);
    }
    10%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:translate(-250px,250px) rotate(-30deg);
    }
}
/* =========================
   主體
========================= */
.app{
    position:relative;
    z-index:2;
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
}
/* =========================
   頂部
========================= */
.topbar{
    height:64px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:rgba(5,3,11,.78);
    border-bottom:1px solid rgba(184,132,255,.12);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}
.top-left{
    display:flex;
    align-items:center;
    gap:10px;
}
.home-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid rgba(190,140,255,.25);
    background:rgba(96,45,155,.12);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}
.home-btn svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:#d4b3ff;
    stroke-width:1.5;
}
.title-area{
    display:flex;
    flex-direction:column;
}
.title{
    font-size:15px;
    letter-spacing:2px;
}
.status{
    margin-top:2px;
    color:#887a97;
    font-size:10px;
}
.status.online{
    color:#aa8bd0;
}
.speaker-btn{
    width:40px;
    height:40px;
    border:1px solid rgba(190,140,255,.2);
    border-radius:50%;
    background:rgba(96,45,155,.1);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}
.speaker-btn svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:#d1b2f5;
    stroke-width:1.5;
}
/* =========================
   訊息區
========================= */
.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:20px 14px 140px;
    -webkit-overflow-scrolling:touch;
}
.message-wrap{
    width:100%;
    display:flex;
    margin-bottom:16px;
}
.message-wrap.user{
    justify-content:flex-end;
}
.message-wrap.ai{
    justify-content:flex-start;
}
.message{
    max-width:min(82%,620px);
    padding:12px 15px;
    border-radius:17px;
    font-size:15px;
    line-height:1.75;
    white-space:pre-wrap;
    word-break:break-word;
}
.message.ai{
    background:rgba(28,17,45,.78);
    border:1px solid rgba(181,126,255,.13);
    color:#eee6f7;
    border-bottom-left-radius:5px;
}
.message.user{
    background:rgba(105,53,171,.28);
    border:1px solid rgba(190,138,255,.18);
    color:#f5edff;
    border-bottom-right-radius:5px;
}
/* =========================
   歡迎
========================= */
.welcome{
    text-align:center;
    padding:32px 20px 28px;
}
.welcome-symbol{
    width:58px;
    height:58px;
    margin:0 auto 14px;
    border-radius:50%;
    border:1px solid rgba(193,142,255,.32);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
        0 0 25px rgba(134,62,220,.16),
        inset 0 0 18px rgba(134,62,220,.08);
}
.welcome-symbol svg{
    width:29px;
    height:29px;
    fill:none;
    stroke:#d3adff;
    stroke-width:1.2;
}
.welcome h1{
    margin:0;
    font-size:25px;
    font-weight:500;
    letter-spacing:4px;
}
.welcome p{
    margin:10px auto 0;
    max-width:430px;
    color:#9588a5;
    font-size:13px;
    line-height:1.8;
}
/* =========================
   輸入區
========================= */
.input-area{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:30;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(
        to top,
        rgba(5,3,11,1) 55%,
        rgba(5,3,11,.88),
        transparent
    );
}
.input-box{
    width:min(760px,100%);
    margin:0 auto;
    min-height:52px;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:7px;
    border:1px solid rgba(188,137,255,.2);
    border-radius:18px;
    background:rgba(18,10,29,.9);
    box-shadow:
        0 8px 35px rgba(0,0,0,.4),
        0 0 25px rgba(111,47,191,.07);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}
.icon-button{
    flex:none;
    width:38px;
    height:38px;
    border:0;
    border-radius:12px;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}
.icon-button:hover{
    background:rgba(140,77,204,.12);
}
.icon-button svg{
    width:21px;
    height:21px;
    fill:none;
    stroke:#bda4d4;
    stroke-width:1.5;
    stroke-linecap:round;
    stroke-linejoin:round;
}
.icon-button.recording{
    background:rgba(150,65,185,.2);
}
.icon-button.recording svg{
    stroke:#e2baff;
}
.textarea{
    flex:1;
    min-width:0;
    max-height:120px;
    min-height:38px;
    padding:8px 4px;
    border:0;
    outline:0;
    resize:none;
    overflow-y:auto;
    background:transparent;
    color:#f5effb;
    font-size:15px;
    line-height:1.5;
    font-family:inherit;
}
.textarea::placeholder{
    color:#756b80;
}
.send-button{
    flex:none;
    width:38px;
    height:38px;
    border-radius:12px;
    border:1px solid rgba(191,139,255,.25);
    background:rgba(117,58,187,.2);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}
.send-button:disabled{
    opacity:.35;
}
.send-button svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:#d9bcff;
    stroke-width:1.5;
    stroke-linecap:round;
    stroke-linejoin:round;
}
/* =========================
   + 選單
========================= */
.plus-menu{
    position:absolute;
    left:12px;
    bottom:72px;
    z-index:40;
    width:225px;
    padding:8px;
    border-radius:17px;
    border:1px solid rgba(190,140,255,.18);
    background:rgba(17,9,28,.96);
    box-shadow:0 12px 40px rgba(0,0,0,.45);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    display:none;
}
.plus-menu.show{
    display:block;
}
.menu-item{
    width:100%;
    height:46px;
    border:0;
    border-radius:11px;
    background:transparent;
    color:#d8cbe4;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 12px;
    cursor:pointer;
    text-align:left;
}
.menu-item:hover{
    background:rgba(132,70,195,.12);
}
.menu-item svg{
    width:20px;
    height:20px;
    flex:none;
    fill:none;
    stroke:#b89bd0;
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-linejoin:round;
}
.menu-item span{
    font-size:13px;
}
/* =========================
   附件訊息
========================= */
.attachment{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:8px;
    padding:9px 11px;
    border-radius:10px;
    background:rgba(91,46,139,.12);
    border:1px solid rgba(180,128,255,.12);
}
.attachment svg{
    width:19px;
    height:19px;
    fill:none;
    stroke:#ba9ad4;
    stroke-width:1.4;
}
.attachment-name{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:12px;
    color:#bcaec9;
}
/* =========================
   輸入中
========================= */
.typing{
    display:flex;
    align-items:center;
    gap:5px;
    padding:3px 2px;
}
.typing span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#b68be7;
    animation:typing 1.2s infinite;
}
.typing span:nth-child(2){
    animation-delay:.15s;
}
.typing span:nth-child(3){
    animation-delay:.3s;
}
@keyframes typing{
    0%,60%,100%{
        opacity:.25;
        transform:translateY(0);
    }
    30%{
        opacity:1;
        transform:translateY(-3px);
    }
}
/* =========================
   隱藏 input
========================= */
.hidden-input{
    display:none;
}
/* =========================
   手機
========================= */
@media(max-width:600px){
    .message{
        max-width:88%;
        font-size:14px;
    }
    .welcome{
        padding-top:22px;
    }
    .welcome h1{
        font-size:23px;
    }
    .plus-menu{
        width:205px;
    }
}
</style>
</head>
<body>
<div id="stars"></div>
<div class="nebula one"></div>
<div class="nebula two"></div>
<div id="meteor"></div>
<div class="app">
<!-- =====================
     頂部
====================== -->
<header class="topbar">
    <div class="top-left">
        <button
            class="home-btn"
            onclick="goHome()"
            aria-label="Home"
        >
            <svg viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5"/>
                <path d="M5.5 9.5V21h13V9.5"/>
                <path d="M9.5 21v-6h5v6"/>
            </svg>
        </button>
        <div class="title-area">
            <div class="title">與玄境交流</div>
            <div id="status" class="status">
                正在連接玄境 AI…
            </div>
        </div>
    </div>
    <button
        id="speakerButton"
        class="speaker-btn"
        onclick="toggleSpeaker()"
        aria-label="AI語音"
    >
        <svg
            id="speakerOnIcon"
            viewBox="0 0 24 24"
        >
            <path d="M4 9v6h4l5 4V5L8 9H4"/>
            <path d="M16 9c1.5 1.5 1.5 4.5 0 6"/>
            <path d="M18.5 6.5c3 3 3 8 0 11"/>
        </svg>
        <svg
            id="speakerOffIcon"
            viewBox="0 0 24 24"
            style="display:none"
        >
            <path d="M4 9v6h4l5 4V5L8 9H4"/>
            <path d="M17 9l4 4"/>
            <path d="M21 9l-4 4"/>
        </svg>
    </button>
</header>
<!-- =====================
     訊息
====================== -->
<main
    id="messages"
    class="messages"
>
    <div id="welcome" class="welcome">
        <div class="welcome-symbol">
            <svg viewBox="0 0 32 32">
                <path d="M16 4
                         C10 8 7 12 7 17
                         C7 23 11 27 16 28
                         C21 27 25 23 25 17
                         C25 12 22 8 16 4Z"/>
                <path d="M11 18
                         C12.5 15.5 14 14 16 11
                         C18 14 19.5 15.5 21 18"/>
            </svg>
        </div>
        <h1>玄境 AI</h1>
        <p>
            你可以直接告訴我你正在想什麼。<br>
            我會先理解，再和你一起想辦法。
        </p>
    </div>
</main>
<!-- =====================
     + 選單
====================== -->
<div
    id="plusMenu"
    class="plus-menu"
>
    <button
        class="menu-item"
        onclick="openCamera()"
    >
        <svg viewBox="0 0 24 24">
            <path d="M4 7h4l1.5-2h5L16 7h4v12H4V7Z"/>
            <circle cx="12" cy="13" r="3.5"/>
        </svg>
        <span>相機</span>
    </button>
    <button
        class="menu-item"
        onclick="openPhoto()"
    >
        <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <circle cx="8.5" cy="9" r="1.5"/>
            <path d="M3 17l5-5 4 4 3-3 6 6"/>
        </svg>
        <span>照片</span>
    </button>
    <button
        class="menu-item"
        onclick="openVideo()"
    >
        <svg viewBox="0 0 24 24">
            <rect x="3" y="6" width="13" height="12" rx="2"/>
            <path d="M16 10l5-3v10l-5-3"/>
        </svg>
        <span>影片</span>
    </button>
    <button
        class="menu-item"
        onclick="openFile()"
    >
        <svg viewBox="0 0 24 24">
            <path d="M5 3h9l5 5v13H5V3Z"/>
            <path d="M14 3v6h5"/>
            <path d="M8 13h8"/>
            <path d="M8 17h6"/>
        </svg>
        <span>檔案</span>
    </button>
    <button
        class="menu-item"
        onclick="startDrawing()"
    >
        <svg viewBox="0 0 24 24">
            <path d="M4 20l4-.8L19 8l-3-3L5 16l-1 4Z"/>
            <path d="M14 6l3 3"/>
            <path d="M4 20l4-.8"/>
        </svg>
        <span>AI 繪圖</span>
    </button>
    <button
        class="menu-item"
        onclick="startTranslation()"
    >
        <svg viewBox="0 0 24 24">
            <path d="M4 5h8"/>
            <path d="M8 5c0 5-2 8-5 10"/>
            <path d="M5 10c1.5 2 3 3.5 5 5"/>
            <path d="M14 19l4-9 4 9"/>
            <path d="M15.5 16h5"/>
        </svg>
        <span>即時翻譯</span>
    </button>
</div>
<!-- =====================
     隱藏檔案 input
====================== -->
<input
    id="cameraInput"
    class="hidden-input"
    type="file"
    accept="image/*"
    capture="environment"
>
<input
    id="photoInput"
    class="hidden-input"
    type="file"
    accept="image/*"
    multiple
>
<input
    id="videoInput"
    class="hidden-input"
    type="file"
    accept="video/*"
    multiple
>
<input
    id="fileInput"
    class="hidden-input"
    type="file"
    multiple
>
<!-- =====================
     輸入
====================== -->
<div class="input-area">
    <div class="input-box">
        <button
            id="plusButton"
            class="icon-button"
            onclick="togglePlusMenu()"
            aria-label="更多"
        >
            <svg viewBox="0 0 24 24">
                <path d="M12 5v14"/>
                <path d="M5 12h14"/>
            </svg>
        </button>
        <button
            id="micButton"
            class="icon-button"
            onclick="toggleRecording()"
            aria-label="語音"
        >
            <svg viewBox="0 0 24 24">
                <rect
                    x="9"
                    y="3"
                    width="6"
                    height="12"
                    rx="3"
                />
                <path d="M5 11a7 7 0 0 0 14 0"/>
                <path d="M12 18v3"/>
                <path d="M9 21h6"/>
            </svg>
        </button>
        <textarea
            id="messageInput"
            class="textarea"
            rows="1"
            placeholder="輸入你想說的話……"
            autocomplete="off"
        ></textarea>
        <button
            id="sendButton"
            class="send-button"
            onclick="sendMessage()"
            aria-label="發送"
        >
            <svg viewBox="0 0 24 24">
                <path d="M4 4l16 8-16 8 3-8-3-8Z"/>
                <path d="M7 12h13"/>
            </svg>
        </button>
    </div>
</div>
</div>
<script src="config.js"></script>
<script>
/* =========================================================
   玄境設定
========================================================= */
const SUPABASE_URL =
    (
        typeof XUANJING_CONFIG !== "undefined" &&
        XUANJING_CONFIG.supabase &&
        XUANJING_CONFIG.supabase.url
    )
    ? XUANJING_CONFIG.supabase.url
    : "https://zuypaeagxjezlqdppvnm.supabase.co";
const AI_FUNCTION_URL =
    (
        typeof XUANJING_CONFIG !== "undefined" &&
        XUANJING_CONFIG.ai &&
        XUANJING_CONFIG.ai.url
    )
    ? XUANJING_CONFIG.ai.url
    : SUPABASE_URL + "/functions/v1/ai-chat";
/* =========================================================
   狀態
========================================================= */
let conversationHistory = [];
let speakerEnabled =
    localStorage.getItem("xuanjing_speaker") !== "off";
let recognition = null;
let isRecording = false;
let isSending = false;
/* =========================================================
   星光
========================================================= */
const starsContainer =
    document.getElementById("stars");
for(let i = 0; i < 170; i++){
    const star =
        document.createElement("div");
    star.className = "star";
    star.style.left =
        Math.random() * 100 + "%";
    star.style.top =
        Math.random() * 100 + "%";
    const size =
        Math.random() < .85 ? 1 : 2;
    star.style.width =
        size + "px";
    star.style.height =
        size + "px";
    star.style.setProperty(
        "--d",
        (2 + Math.random() * 5) + "s"
    );
    star.style.animationDelay =
        (-Math.random() * 5) + "s";
    starsContainer.appendChild(star);
}
/* =========================================================
   流星
========================================================= */
const meteor =
    document.getElementById("meteor");
function createMeteor(){
    meteor.classList.remove("fly");
    meteor.style.left =
        (25 + Math.random() * 80) + "%";
    meteor.style.top =
        (5 + Math.random() * 35) + "%";
    void meteor.offsetWidth;
    meteor.classList.add("fly");
    setTimeout(
        createMeteor,
        9000 + Math.random() * 11000
    );
}
setTimeout(createMeteor,7000);
/* =========================================================
   DOM
========================================================= */
const messages =
    document.getElementById("messages");
const input =
    document.getElementById("messageInput");
const sendButton =
    document.getElementById("sendButton");
const status =
    document.getElementById("status");
const plusMenu =
    document.getElementById("plusMenu");
const micButton =
    document.getElementById("micButton");
/* =========================================================
   Home
========================================================= */
function goHome(){
    window.location.href = "home.html";
}
/* =========================================================
   Speaker
========================================================= */
function updateSpeakerUI(){
    document.getElementById("speakerOnIcon")
        .style.display =
        speakerEnabled ? "block" : "none";
    document.getElementById("speakerOffIcon")
        .style.display =
        speakerEnabled ? "none" : "block";
}
function toggleSpeaker(){
    speakerEnabled =
        !speakerEnabled;
    localStorage.setItem(
        "xuanjing_speaker",
        speakerEnabled ? "on" : "off"
    );
    updateSpeakerUI();
    if(!speakerEnabled){
        if("speechSynthesis" in window){
            window.speechSynthesis.cancel();
        }
    }
}
updateSpeakerUI();
/* =========================================================
   語音朗讀
========================================================= */
function speakText(text){
    if(!speakerEnabled) return;
    if(!("speechSynthesis" in window)){
        console.warn(
            "此瀏覽器不支援語音朗讀"
        );
        return;
    }
    window.speechSynthesis.cancel();
    const utterance =
        new SpeechSynthesisUtterance(text);
    utterance.lang =
        detectLanguage(text);
    utterance.rate = .95;
    utterance.pitch = 1;
    window.speechSynthesis.speak(
        utterance
    );
}
function detectLanguage(text){
    if(/[越南語特有字母đĐăĂâÂêÊôÔơƠưƯ]/.test(text)){
        return "vi-VN";
    }
    if(/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(text)){
        return "ko-KR";
    }
    if(/[ぁ-んァ-ン一-龯]/.test(text) &&
       !/[繁體中文]/.test(text)){
        return "ja-JP";
    }
    if(/[A-Za-z]/.test(text) &&
       !/[\u4e00-\u9fff]/.test(text)){
        return "en-US";
    }
    return "zh-TW";
}
/* =========================================================
   加入訊息
========================================================= */
function addMessage(
    role,
    text,
    attachment = null
){
    const wrap =
        document.createElement("div");

/* =========================================================
   發送 AI
========================================================= */
async function sendMessage(){
    if(isSending) return;
    const text =
        input.value.trim();
    if(!text) return;
    isSending = true;
    sendButton.disabled = true;
    /* 清空輸入 */
    input.value = "";
    resizeInput();
    /* 關閉 + */
    plusMenu.classList.remove("show");
    /* 顯示使用者訊息 */
    addMessage(
        "user",
        text
    );
    /* 加入歷史 */
    conversationHistory.push({
        role:"user",
        content:text
    });
    showTyping();
    status.textContent =
        "玄境 AI 正在思考…";
    try{
        /*
         * 真正呼叫：
         *
         * GitHub
         * ↓
         * 玄境 Supabase Edge Function
         * ↓
         * AIVAULT
         * ↓
         * Gemini / 其他模型
         */
        const response =
            await fetch(
                AI_FUNCTION_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        message:text,
                        messages:
                            conversationHistory
                    })
                }
            );
        if(!response.ok){
            const errorText =
                await response.text();
            throw new Error(
                "AI API " +
                response.status +
                ": " +
                errorText
            );
        }
        const data =
            await response.json();
        /*
         * 相容不同 Edge Function 回傳格式
         */
        const answer =
            data.reply ||
            data.response ||
            data.message ||
            data.content ||
            (
                data.data &&
                (
                    data.data.reply ||
                    data.data.response ||
                    data.data.content
                )
            );
        if(!answer){
            throw new Error(
                "AI 沒有返回文字"
            );
        }
        removeTyping();
        addMessage(
            "ai",
            answer
        );
        conversationHistory.push({
            role:"assistant",
            content:answer
        });
        status.textContent =
            "玄境 AI 在線";
        /* AI 自動說話 */
        speakText(answer);
    }catch(error){
        console.error(
            "玄境 AI 錯誤：",
            error
        );
        removeTyping();
        addMessage(
            "ai",
            "抱歉，玄境 AI 目前沒有成功連線。\n\n請再試一次。"
        );
        status.textContent =
            "AI 連線失敗";
    }finally{
        isSending = false;
        sendButton.disabled = false;
        input.focus();
    }
}

/* =========================================================
   IndexedDB
   真正把選取的檔案保存到瀏覽器
========================================================= */
const DB_NAME =
    "XuanJingChatFiles";
const DB_VERSION = 1;
const STORE_NAME =
    "attachments";
function openFileDB(){
    return new Promise(
        (resolve,reject)=>{
            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );
            request.onupgradeneeded =
                function(event){
                    const db =
                        event.target.result;
                    if(
                        !db.objectStoreNames
                            .contains(STORE_NAME)
                    ){
                        db.createObjectStore(
                            STORE_NAME,
                            {
                                keyPath:"id",
                                autoIncrement:true
                            }
                        );
                    }
                };
            request.onsuccess =
                function(){
                    resolve(
                        request.result
                    );
                };
            request.onerror =
                function(){
                    reject(
                        request.error
                    );
                };
        }
    );
}
async function saveFileToDevice(file){
    try{
        const db =
            await openFileDB();
        return new Promise(
            (resolve,reject)=>{
                const transaction =
                    db.transaction(
                        STORE_NAME,
                        "readwrite"
                    );
                const store =
                    transaction.objectStore(
                        STORE_NAME
                    );
                const request =
                    store.add({
                        name:file.name,
                        type:file.type,
                        size:file.size,
                        file:file,
                        created_at:
                            new Date().toISOString()
                    });
                request.onsuccess =
                    () => resolve(
                        request.result
                    );
                request.onerror =
                    () => reject(
                        request.error
                    );
            }
        );
    }catch(error){
        console.error(
            "檔案保存失敗",
            error
        );
        return null;
    }
}
/* =========================================================
   檔案處理
========================================================= */
async function handleFiles(
    fileList,
    mode
){
    if(!fileList || !fileList.length)
        return;
    plusMenu.classList.remove(
        "show"
    );
    for(
        const file of Array.from(fileList)
    ){
        const savedId =
            await saveFileToDevice(
                file
            );
        const label =
            savedId !== null
                ? "已保存"
                : "保存失敗";
        addMessage(
            "user",
            label + "：" + file.name,
            file
        );
        /*
         * 把檔案事件記錄到對話歷史，
         * 讓之後可以接真正的 AI 視覺/文件分析。
         */
        conversationHistory.push({
            role:"user",
            content:
                `[${mode}] ${file.name}`
        });
    }
}

/* =========================================================
   語音辨識
========================================================= */
function setupRecognition(){
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;
    if(!SpeechRecognition){
        return null;
    }
    const rec =
        new SpeechRecognition();
    rec.continuous = false;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    /*
     * zh-TW 可以辨識中文；
     * 瀏覽器會根據使用者實際語言環境
     * 進行語音辨識。
     *
     * 後續即時翻譯模式再依語言切換。
     */
    rec.lang = "zh-TW";
    rec.onstart =
        function(){
            isRecording = true;
            micButton.classList.add(
                "recording"
            );
            status.textContent =
                "正在聽你說話…";
        };
    rec.onresult =
        function(event){
            let finalText = "";
            let interimText = "";
            for(
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ){
                const transcript =
                    event.results[i][0].transcript;
                if(
                    event.results[i].isFinal
                ){
                    finalText += transcript;
                }else{
                    interimText += transcript;
                }
            }
            /*
             * 即時把辨識結果放入輸入框
             */
            input.value =
                finalText || interimText;
            resizeInput();
        };
    rec.onerror =
        function(event){
            console.error(
                "語音辨識錯誤：",
                event.error
            );
            isRecording = false;
            micButton.classList.remove(
                "recording"
            );
            if(
                event.error ===
                "not-allowed"
            ){
                status.textContent =
                    "麥克風權限被拒絕";
            }else{
                status.textContent =
                    "語音辨識暫時無法使用";
            }
        };
    rec.onend =
        function(){
            isRecording = false;
            micButton.classList.remove(
                "recording"
            );
            if(
                status.textContent ===
                "正在聽你說話…"
            ){
                status.textContent =
                    "玄境 AI 在線";
            }
        };
    return rec;
}
function toggleRecording(){
    if(isSending) return;
    if(!recognition){
        recognition =
            setupRecognition();
    }
    if(!recognition){
        alert(
            "你的瀏覽器目前不支援語音輸入。\n\n請使用支援 Speech Recognition 的瀏覽器。"
        );
        return;
    }
    if(isRecording){
        recognition.stop();
        return;
    }
    try{
        recognition.start();
    }catch(error){
        console.error(error);
    }
}

/* =========================================================
   防止整頁左右滑動
   但允許上下滑動
========================================================= */
let startX = 0;
let startY = 0;
document.addEventListener(
    "touchstart",
    function(event){
        if(
            event.touches.length !== 1
        ) return;
        startX =
            event.touches[0].clientX;
        startY =
            event.touches[0].clientY;
    },
    {
        passive:true
    }
);
document.addEventListener(
    "touchmove",
    function(event){
        if(
            event.touches.length !== 1
        ) return;
        const x =
            event.touches[0].clientX;
        const y =
            event.touches[0].clientY;
        const dx =
            x - startX;
        const dy =
            y - startY;
        if(
            Math.abs(dx) >
            Math.abs(dy) &&
            Math.abs(dx) > 8
        ){
            event.preventDefault();
        }
    },
    {
        passive:false
    }
);
