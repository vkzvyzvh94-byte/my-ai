<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>玄境 AI｜交流</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;

    background: #05020d;
    color: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;

    overflow: hidden;
}

/* =========================
   背景
========================= */

#space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.nebula {
    position: absolute;
    width: 75vw;
    height: 75vw;

    border-radius: 50%;

    filter: blur(65px);

    opacity: .22;

    background:
        radial-gradient(
            circle,
            rgba(145,65,255,.75) 0%,
            rgba(95,30,190,.35) 35%,
            transparent 70%
        );

    animation: nebulaMove 18s ease-in-out infinite alternate;
}

.nebula.one {
    left: -20vw;
    top: -10vw;
}

.nebula.two {
    right: -25vw;
    bottom: -15vw;

    opacity: .17;

    animation-delay: -7s;
}

@keyframes nebulaMove {

    0% {
        transform: translate3d(-3%, -2%, 0) scale(1);
    }

    100% {
        transform: translate3d(4%, 3%, 0) scale(1.15);
    }
}

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: rgba(255,255,255,.9);

    box-shadow:
        0 0 6px rgba(185,125,255,.9);

    animation:
        twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {

    0%,
    100% {
        opacity: .25;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}

.meteor {
    position: fixed;

    width: 130px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(225,185,255,.95),
            transparent
        );

    transform: rotate(-35deg);

    opacity: 0;

    pointer-events: none;

    z-index: 2;

    animation:
        meteor 1.5s linear forwards;
}

@keyframes meteor {

    0% {
        opacity: 0;
        transform:
            translate3d(100px,-100px,0)
            rotate(-35deg);
    }

    10% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translate3d(-420px,420px,0)
            rotate(-35deg);
    }
}

/* =========================
   主體
========================= */

.app {
    position: relative;
    z-index: 5;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

/* =========================
   Top
========================= */

.topbar {

    flex: 0 0 62px;

    display: flex;
    align-items: center;

    justify-content: space-between;

    padding:
        0 15px;

    background:
        rgba(5,2,13,.72);

    border-bottom:
        1px solid
        rgba(190,130,255,.12);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);
}

.top-left {
    display: flex;
    align-items: center;
    gap: 11px;

    min-width: 0;
}

.home-button,
.speaker-button {

    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border:
        1px solid
        rgba(205,155,255,.25);

    background:
        rgba(100,50,170,.12);

    color: white;

    padding: 0;

    cursor: pointer;

    flex: 0 0 42px;
}

.home-button svg,
.speaker-button svg {

    width: 21px;
    height: 21px;

    fill: none;

    stroke:
        rgba(240,220,255,.9);

    stroke-width: 1.5;

    stroke-linecap: round;
    stroke-linejoin: round;
}

.speaker-button.active {

    background:
        rgba(125,65,220,.35);

    border-color:
        rgba(210,160,255,.45);

    box-shadow:
        0 0 18px
        rgba(145,70,255,.18);
}

.page-title {
    min-width: 0;
}

.page-title-main {

    font-size: 16px;

    letter-spacing: 2px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.page-title-sub {

    margin-top: 2px;

    font-size: 9px;

    letter-spacing: 1.5px;

    color:
        rgba(255,255,255,.4);
}

.status {

    display: flex;
    align-items: center;

    gap: 6px;

    font-size: 10px;

    color:
        rgba(255,255,255,.42);

    white-space: nowrap;
}

.status-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #9c65ff;

    box-shadow:
        0 0 8px
        rgba(155,90,255,.9);
}

/* =========================
   Messages
========================= */

.messages {

    flex: 1;

    min-height: 0;

    width: 100%;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        24px 15px 18px;

    scroll-behavior: smooth;

    -webkit-overflow-scrolling:
        touch;
}

.messages::-webkit-scrollbar {
    width: 3px;
}

.messages::-webkit-scrollbar-thumb {

    background:
        rgba(170,110,255,.22);

    border-radius: 10px;
}

/* =========================
   Welcome
========================= */

.welcome {

    width: 100%;

    padding:
        25px 10px 35px;

    text-align: center;
}

.welcome-symbol {

    width: 66px;
    height: 66px;

    margin:
        0 auto 18px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        1px solid
        rgba(205,155,255,.35);

    background:
        radial-gradient(
            circle,
            rgba(140,65,230,.32),
            rgba(45,20,80,.32)
        );

    box-shadow:
        0 0 35px
        rgba(135,65,255,.2);
}

.welcome-symbol svg {

    width: 30px;
    height: 30px;

    fill: none;

    stroke:
        rgba(235,215,255,.9);

    stroke-width: 1.35;
}

.welcome h1 {

    margin: 0;

    font-size: 24px;

    font-weight: 500;

    letter-spacing: 3px;
}

.welcome p {

    margin:
        10px auto 0;

    max-width: 310px;

    font-size: 13px;

    line-height: 1.8;

    color:
        rgba(255,255,255,.5);
}

/* =========================
   Bubble
========================= */

.message {

    display: flex;

    margin:
        0 0 15px;

    width: 100%;
}

.message.user {

    justify-content: flex-end;
}

.message.ai {

    justify-content: flex-start;
}

.bubble {

    max-width: 82%;

    padding:
        12px 14px;

    border-radius: 17px;

    font-size: 14px;

    line-height: 1.7;

    white-space: pre-wrap;

    word-break: break-word;
}

.message.user .bubble {

    background:
        linear-gradient(
            135deg,
            rgba(120,60,210,.65),
            rgba(85,35,160,.48)
        );

    border:
        1px solid
        rgba(205,155,255,.22);

    border-bottom-right-radius: 5px;
}

.message.ai .bubble {

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(205,155,255,.12);

    border-bottom-left-radius: 5px;
}

/* =========================
   Attachment message
========================= */

.attachment-card {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 10px 12px;

    border-radius: 14px;

    background:
        rgba(120,65,190,.13);

    border:
        1px solid
        rgba(200,150,255,.18);
}

.attachment-icon svg {

    width: 22px;
    height: 22px;

    fill: none;

    stroke:
        rgba(225,200,255,.85);

    stroke-width: 1.4;
}

.attachment-info {

    min-width: 0;
}

.attachment-name {

    font-size: 13px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.attachment-status {

    margin-top: 2px;

    font-size: 10px;

    color:
        rgba(255,255,255,.4);
}

/* =========================
   Typing
========================= */

.typing {

    display: none;

    align-items: center;

    gap: 5px;

    margin:
        0 0 15px 5px;

    color:
        rgba(255,255,255,.42);

    font-size: 11px;
}

.typing.show {
    display: flex;
}

.typing-dot {

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:
        rgba(200,160,255,.8);

    animation:
        typing 1.2s infinite;
}

.typing-dot:nth-child(2) {
    animation-delay: .15s;
}

.typing-dot:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {

    0%,60%,100% {
        opacity: .25;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-3px);
    }
}

/* =========================
   Bottom
========================= */

.bottom {

    flex: 0 0 auto;

    width: 100%;

    padding:
        8px 12px
        calc(10px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            180deg,
            rgba(5,2,13,.45),
            rgba(5,2,13,.94)
        );

    border-top:
        1px solid
        rgba(190,130,255,.1);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);
}

/* =========================
   Plus menu
========================= */

.plus-menu {

    display: none;

    width: 100%;

    padding:
        10px 4px 12px;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;
}

.plus-menu.show {
    display: grid;
}

.tool-button {

    min-width: 0;

    min-height: 65px;

    border-radius: 14px;

    border:
        1px solid
        rgba(200,150,255,.13);

    background:
        rgba(255,255,255,.045);

    color: rgba(255,255,255,.75);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 7px;

    font-size: 10px;

    cursor: pointer;
}

.tool-button:active {

    background:
        rgba(140,70,230,.18);

    transform: scale(.97);
}

.tool-button svg {

    width: 22px;
    height: 22px;

    fill: none;

    stroke:
        rgba(225,205,255,.8);

    stroke-width: 1.35;

    stroke-linecap: round;
    stroke-linejoin: round;
}

/* =========================
   Composer
========================= */

.composer {

    display: flex;

    align-items: flex-end;

    gap: 7px;

    width: 100%;
}

.icon-button {

    width: 43px;
    height: 43px;

    flex: 0 0 43px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;

    border-radius: 50%;

    border:
        1px solid
        rgba(205,155,255,.18);

    background:
        rgba(255,255,255,.045);

    cursor: pointer;
}

.icon-button:active {

    transform: scale(.94);

    background:
        rgba(130,65,220,.2);
}

.icon-button svg {

    width: 21px;
    height: 21px;

    fill: none;

    stroke:
        rgba(235,215,255,.82);

    stroke-width: 1.45;

    stroke-linecap: round;
    stroke-linejoin: round;
}

.icon-button.recording {

    background:
        rgba(190,55,100,.28);

    border-color:
        rgba(255,145,180,.4);
}

.input-wrap {

    flex: 1;

    min-width: 0;

    min-height: 43px;

    display: flex;

    align-items: center;

    border:
        1px solid
        rgba(205,155,255,.16);

    border-radius: 22px;

    background:
        rgba(255,255,255,.055);

    padding:
        4px 6px 4px 14px;
}

#messageInput {

    width: 100%;

    min-height: 33px;
    max-height: 110px;

    resize: none;

    border: none;
    outline: none;

    background: transparent;

    color: #fff;

    font-size: 14px;

    line-height: 1.5;

    font-family: inherit;
}

#messageInput::placeholder {

    color:
        rgba(255,255,255,.32);
}

.send-button {

    width: 35px;
    height: 35px;

    flex: 0 0 35px;

    border: none;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(145,75,230,.55);

    cursor: pointer;

    padding: 0;
}

.send-button:active {

    transform: scale(.91);
}

.send-button svg {

    width: 18px;
    height: 18px;

    fill: none;

    stroke: #fff;

    stroke-width: 1.5;

    stroke-linecap: round;
    stroke-linejoin: round;
}

/* =========================
   Error
========================= */

.error-box {

    display: none;

    margin:
        0 0 14px;

    padding:
        10px 12px;

    border-radius: 12px;

    background:
        rgba(150,40,70,.15);

    border:
        1px solid
        rgba(255,120,160,.2);

    color:
        rgba(255,205,220,.82);

    font-size: 11px;

    line-height: 1.6;
}

.error-box.show {
    display: block;
}

/* =========================
   Hidden file inputs
========================= */

.hidden-input {
    display: none;
}

/* =========================
   Mobile
========================= */

@media (max-width: 420px) {

    .status {
        display: none;
    }

    .bubble {
        max-width: 88%;
    }

    .plus-menu {
        grid-template-columns:
            repeat(4, 1fr);
    }

    .tool-button {
        min-height: 61px;
    }
}

</style>
</head>


<body>

<!-- =========================
     背景
========================= -->

<div id="space">

    <div class="nebula one"></div>
    <div class="nebula two"></div>

</div>


<div class="app">


    <!-- =========================
         Top
    ========================== -->

    <header class="topbar">

        <div class="top-left">

            <button
                class="home-button"
                id="homeButton"
                type="button"
                aria-label="Home">

                <svg viewBox="0 0 24 24">

                    <path d="M3 10.5L12 3l9 7.5"></path>

                    <path d="M5.5 9.5V21h13V9.5"></path>

                    <path d="M9.5 21v-6h5v6"></path>

                </svg>

            </button>


            <div class="page-title">

                <div class="page-title-main">
                    與玄境 AI 交流
                </div>

                <div class="page-title-sub">
                    YOUR PRIVATE AI SPACE
                </div>

            </div>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            <span id="statusText">
                AI
            </span>

        </div>


        <button
            class="speaker-button"
            id="speakerButton"
            type="button"
            aria-label="AI 語音">

            <!-- speaker on -->
            <svg
                id="speakerOnIcon"
                viewBox="0 0 24 24">

                <path d="M5 10v4h3l4 4V6l-4 4H5"></path>

                <path d="M16 9.5a4 4 0 0 1 0 5"></path>

                <path d="M18.5 7a7 7 0 0 1 0 10"></path>

            </svg>

            <!-- speaker off -->
            <svg
                id="speakerOffIcon"
                viewBox="0 0 24 24"
                style="display:none;">

                <path d="M5 10v4h3l4 4V6l-4 4H5"></path>

                <path d="M17 9l4 6"></path>
                <path d="M21 9l-4 6"></path>

            </svg>

        </button>

    </header>


    <!-- =========================
         Messages
    ========================== -->

    <main
        class="messages"
        id="messages">

        <div class="welcome">

            <div class="welcome-symbol">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="7">
                    </circle>

                    <path d="M9 12h6"></path>

                    <path d="M12 9v6"></path>

                </svg>

            </div>


            <h1>
                玄境
            </h1>


            <p>
                你可以直接告訴我正在想什麼。
                <br>
                想聊天、分析事情、整理想法，
                或只是找個地方說說話，都可以。
            </p>

        </div>


        <div
            class="typing"
            id="typing">

            <span>玄境正在思考</span>

            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>

        </div>

    </main>


    <!-- =========================
         Bottom
    ========================== -->

    <section class="bottom">


        <!-- Error -->
        <div
            class="error-box"
            id="errorBox">
        </div>


        <!-- Plus Menu -->
        <div
            class="plus-menu"
            id="plusMenu">


            <!-- Camera -->

            <button
                class="tool-button"
                id="cameraButton"
                type="button">

                <svg viewBox="0 0 24 24">

                    <path d="M4 7h4l1.5-2h5L16 7h4v12H4z"></path>

                    <circle
                        cx="12"
                        cy="13"
                        r="3.5">
                    </circle>

                </svg>

                <span>相機</span>

            </button>


            <!-- Photo -->

            <button
                class="tool-button"
                id="photoButton"
                type="button">

                <svg viewBox="0 0 24 24">

                    <rect
                        x="4"
                        y="5"
                        width="16"
                        height="14"
                        rx="2">
                    </rect>

                    <circle
                        cx="9"
                        cy="10"
                        r="1.5">
                    </circle>

                    <path d="M5 17l5-5 3 3 2-2 4 4"></path>

                </svg>

                <span>照片</span>

            </button>


            <!-- Video -->

            <button
                class="tool-button"
                id="videoButton"
                type="button">

                <svg viewBox="0 0 24 24">

                    <rect
                        x="3"
                        y="7"
                        width="13"
                        height="10"
                        rx="2">
                    </rect>

                    <path d="M16 10l5-3v10l-5-3"></path>

                </svg>

                <span>影片</span>

            </button>


            <!-- File -->

            <button
                class="tool-button"
                id="fileButton"
                type="button">

                <svg viewBox="0 0 24 24">

                    <path d="M6 3h8l4 4v14H6z"></path>

                    <path d="M14 3v5h5"></path>

                    <path d="M9 13h6"></path>

                    <path d="M9 17h6"></path>

                </svg>

                <span>檔案</span>

            </button>


            <!-- AI Draw -->

            <button
                class="tool-button"
                id="drawButton"
                type="button">

                <svg viewBox="0 0 24 24">

                    <path d="M4 20l4.5-1 10-10-3.5-3.5-10 10z"></path>

                    <path d="M13.5 6.5l3.5 3.5"></path>

                    <path d="M5 4h.01"></path>

                    <path d="M19 18h.01"></path>

                </svg>

                <span>AI 繪圖</span>

            </button>


            <!-- Translation -->

            <button
                class="tool-button"
                id="translateButton"
                type="button">

                <svg viewBox="0 0 24 24">

                    <path d="M4 5h9"></path>

                    <path d="M8 3v2"></path>

                    <path d="M6 5c1 4 3 6 7 8"></path>

                    <path d="M11 5c-1 4-3 6-7 8"></path>

                    <path d="M14 20l4-10 4 10"></path>

                    <path d="M15.5 17h5"></path>

                </svg>

                <span>翻譯</span>

            </button>


        </div>


        <!-- Hidden inputs -->

        <input
            class="hidden-input"
            id="cameraInput"
            type="file"
            accept="image/*"
            capture="environment"
        >

        <input
            class="hidden-input"
            id="photoInput"
            type="file"
            accept="image/*"
            multiple
        >

        <input
            class="hidden-input"
            id="videoInput"
            type="file"
            accept="video/*"
            capture="environment"
        >

        <input
            class="hidden-input"
            id="fileInput"
            type="file"
            multiple
        >


        <!-- Composer -->

        <div class="composer">


            <!-- Plus -->

            <button
                class="icon-button"
                id="plusButton"
                type="button"
                aria-label="更多功能">

                <svg
                    id="plusIcon"
                    viewBox="0 0 24 24">

                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>

                </svg>

            </button>


            <!-- Input -->

            <div class="input-wrap">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="告訴玄境，你現在想說什麼……"
                    autocomplete="off"
                ></textarea>


                <!-- Mic -->

                <button
                    class="icon-button"
                    id="micButton"
                    type="button"
                    aria-label="語音輸入">

                    <svg viewBox="0 0 24 24">

                        <rect
                            x="9"
                            y="4"
                            width="6"
                            height="11"
                            rx="3">
                        </rect>

                        <path d="M6 11a6 6 0 0 0 12 0"></path>

                        <path d="M12 17v3"></path>

                        <path d="M9 20h6"></path>

                    </svg>

                </button>


                <!-- Send -->

                <button
                    class="send-button"
                    id="sendButton"
                    type="button"
                    aria-label="送出">

                    <svg viewBox="0 0 24 24">

                        <path d="M4 12h15"></path>

                        <path d="M13 6l6 6-6 6"></path>

                    </svg>

                </button>

            </div>

        </div>

    </section>

</div>


<script>

/* =========================================================
   玄境 AI Chat
   完整獨立版本
========================================================= */


/* =========================================================
   1. 基本設定
========================================================= */

const FALLBACK_SUPABASE_URL =
    "https://zuypaeagxjezlqdppvnm.supabase.co";

const FALLBACK_AI_URL =
    FALLBACK_SUPABASE_URL +
    "/functions/v1/ai-chat";


let SUPABASE_URL =
    FALLBACK_SUPABASE_URL;

let AI_FUNCTION_URL =
    FALLBACK_AI_URL;


/* =========================================================
   2. 嘗試讀取 config.js
========================================================= */

if (
    typeof XUANJING_CONFIG !==
    "undefined"
) {

    if (
        XUANJING_CONFIG.supabase &&
        XUANJING_CONFIG.supabase.url

function formatFileSize(
    bytes
) {

    if (bytes < 1024) {

        return bytes + " B";

    }

    if (bytes < 1024 * 1024) {

        return (
            (bytes / 1024)
            .toFixed(1)
            +
            " KB"
        );

    }

    return (
        (bytes / 1024 / 1024)
        .toFixed(1)
        +
        " MB"
    );

}

/* =========================================================
   14. 取得 AI 回應
========================================================= */

function extractAIText(
    data
) {

    if (!data) {
        return "";
    }


    if (
        typeof data ===
        "string"
    ) {

        return data;

    }


    const candidates = [

        data.reply,

        data.response,

        data.message,

        data.content,

        data.text,

        data.output,

        data.data?.reply,

        data.data?.response,

        data.data?.message,

        data.data?.content,

        data.data?.text,

        data.result?.reply,

        data.result?.response,

        data.result?.message,

        data.result?.content

    ];


    for (
        const item
        of candidates
    ) {

        if (
            typeof item ===
            "string" &&
            item.trim()
        ) {

            return item.trim();

        }

    }


    return "";

}


/* =========================================================
   15. 發送 AI
========================================================= */

async function sendToAI(
    text
) {

    clearError();

    setTyping(true);

    statusText.textContent =
        "思考中";


    try {

        const response =
            await fetch(
                AI_FUNCTION_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            messages:
                                conversationHistory

                        })

                }
            );


        const rawText =
            await response.text();


        let data = null;


        try {

            data =
                JSON.parse(
                    rawText
                );

        } catch {

            data =
                rawText;

        }


        if (!response.ok) {

            throw new Error(
                "AI 服務回應錯誤：" +
                response.status +
                (
                    rawText
                        ? "｜" +
                          rawText
                            .slice(0, 300)
                        : ""
                )
            );

        }


        const aiText =
            extractAIText(
                data
            );


        if (!aiText) {

            throw new Error(
                "AI 有回應，但前端無法辨識回應內容。"
            );

        }


        conversationHistory.push({

            role:
                "user",

            content:
                text

        });


        conversationHistory.push({

            role:
                "assistant",

            content:
                aiText

        });


        addMessage(
            "ai",
            aiText
        );


        statusText.textContent =
            "AI";


        if (
            speakerEnabled
        ) {

            speakText(
                aiText
            );

        }


    } catch (error) {

        console.error(
            "玄境 AI Error:",
            error
        );


        statusText.textContent =
            "連線問題";


        addMessage(
            "ai",
            "目前無法連接玄境 AI。\n\n" +
            "錯誤：\n" +
            error.message
        );


        showError(
            error.message
        );


    } finally {

        setTyping(false);

    }

}

/* =========================================================
   23. IndexedDB
========================================================= */

const DB_NAME =
    "XuanJingChatFiles";

const DB_VERSION = 1;

const STORE_NAME =
    "attachments";


function openFileDB() {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            if (
                !("indexedDB" in window)
            ) {

                reject(
                    new Error(
                        "此瀏覽器不支援本機檔案保存"
                    )
                );

                return;

            }


            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                function (event) {

                    const db =
                        event.target.result;


                    if (
                        !db.objectStoreNames
                            .contains(
                                STORE_NAME
                            )
                    ) {

                        db.createObjectStore(
                            STORE_NAME,
                            {
                                keyPath:
                                    "id",
                                autoIncrement:
                                    true
                            }
                        );

                    }

                };


            request.onsuccess =
                function () {

                    resolve(
                        request.result
                    );

                };


            request.onerror =
                function () {

                    reject(
                        request.error
                    );

                };

        }
    );

}


async function saveFileLocally(
    file
) {

    try {

        const db =
            await openFileDB();


        await new Promise(
            function (
                resolve,
                reject
            ) {

                const transaction =
                    db.transaction(
                        STORE_NAME,
                        "readwrite"
                    );


                const store =
                    transaction.objectStore(
                        STORE_NAME
                    );


                store.add({

                    name:
                        file.name,

                    type:
                        file.type,

                    size:
                        file.size,

                    file:
                        file,

                    created_at:
                        new Date()
                            .toISOString()

                });


                transaction.oncomplete =
                    function () {

                        resolve();

                    };


                transaction.onerror =
                    function () {

                        reject(
                            transaction.error
                        );

                    };

            }
        );


        db.close();


    } catch (error) {

        console.error(
            "檔案保存失敗:",
            error
        );

        showError(
            "檔案已選取，但本機保存失敗：" +
            error.message
        );

    }

}

/* =========================================================
   26. 語音輸入
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let recognizing = false;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;

    recognition.interimResults =
        true;

    recognition.maxAlternatives =
        1;

    recognition.lang =
        "zh-TW";


    recognition.onstart =
        function () {

            recognizing = true;

            micButton
                .classList
                .add("recording");

            statusText.textContent =
                "聆聽中";

        };


    recognition.onresult =
        function (event) {

            let transcript =
                "";

            for (
                let i =
                    event.resultIndex;
                i <
                    event.results.length;
                i++
            ) {

                transcript +=
                    event.results[i][0]
                        .transcript;

            }


            if (transcript.trim()) {

                input.value =
                    transcript;

                autoResize();

            }

        };


    recognition.onerror =
        function (event) {

            console.error(
                "SpeechRecognition:",
                event
            );


            recognizing =
                false;

            micButton
                .classList
                .remove(
                    "recording"
                );

            statusText.textContent =
                "AI";


            let message =
                "語音輸入無法使用";


            if (
                event.error ===
                "not-allowed"
            ) {

                message =
                    "麥克風權限被拒絕，請在瀏覽器設定中允許麥克風。";

            } else if (
                event.error ===
                "no-speech"
            ) {

                message =
                    "沒有偵測到聲音，請再試一次。";

            } else if (
                event.error ===
                "network"
            ) {

                message =
                    "語音辨識服務網路連線失敗。";

            }


            showError(
                message
            );

        };


    recognition.onend =
        function () {

            recognizing =
                false;

            micButton
                .classList
                .remove(
                    "recording"
                );

            statusText.textContent =
                "AI";

        };

} else {

    micButton.title =
        "目前瀏覽器不支援網頁語音辨識";

}


micButton.addEventListener(
    "click",
    function () {

        clearError();


        if (!recognition) {

            showError(
                "你目前使用的瀏覽器沒有提供網頁語音辨識功能。文字聊天仍然可以使用。"
            );

            return;

        }


        if (recognizing) {

            recognition.stop();

            return;

        }


        try {

            recognition.lang =
                "zh-TW";

            recognition.start();

        } catch (error) {

            console.error(
                error
            );

            showError(
                "無法啟動語音輸入：" +
                error.message
            );

        }

    }
);


/* =========================================================
   27. AI 語音朗讀
========================================================= */

function detectSpeechLanguage(
    text
) {

    /* 越南文 */
    if (
        /[ăâđêôơưÀ-ỹ]/i
            .test(text)
    ) {

        return "vi-VN";

    }


    /* 韓文 */
    if (
        /[\uAC00-\uD7AF]/
            .test(text)
    ) {

        return "ko-KR";

    }


    /* 日文 */
    if (
        /[\u3040-\u30FF]/
            .test(text)
    ) {

        return "ja-JP";

    }


    /* 英文 */
    if (
        /^[\sA-Za-z0-9.,!?'"()\-:;]+$/
            .test(text)
    ) {

        return "en-US";

    }


    return "zh-TW";

}


function speakText(
    text
) {

    if (
        !speakerEnabled
    ) {

        return;

    }


    if (
        !("speechSynthesis" in window)
    ) {

        showError(
            "目前瀏覽器不支援 AI 語音播放。"
        );

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        detectSpeechLanguage(
            text
        );

    utterance.rate =
        .95;

    utterance.pitch =
        1;


    utterance.onerror =
        function (event) {

            console.error(
                "Speech synthesis:",
                event
            );

        };


    window.speechSynthesis.speak(
        utterance
    );

}

   保留訊息區上下滑動
========================================================= */

let touchStartX = 0;
let touchStartY = 0;


document.addEventListener(
    "touchstart",
    function (event) {

        if (
            !event.touches.length
        ) {

            return;

        }


        touchStartX =
            event.touches[0]
                .clientX;

        touchStartY =
            event.touches[0]
                .clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchmove",
    function (event) {

        if (
            !event.touches.length
        ) {

            return;

        }


        const x =
            event.touches[0]
                .clientX;

        const y =
            event.touches[0]
                .clientY;


        const dx =
            x -
            touchStartX;

        const dy =
            y -
            touchStartY;


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);
