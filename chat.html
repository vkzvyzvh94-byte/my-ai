<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>玄境 AI｜交流</title>

<script src="config.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(121, 64, 255, .16),
            transparent 32%
        ),
        radial-gradient(
            circle at 15% 75%,
            rgba(88, 42, 180, .12),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 45%,
            rgba(160, 75, 255, .08),
            transparent 28%
        ),
        #05030b;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;

    position: relative;

    overflow-y: auto;
}


/* ==================================================
   玄境紫色星光
================================================== */

#stars {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;
}


.star {

    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: rgba(216, 190, 255, .85);

    box-shadow:
        0 0 5px rgba(177, 110, 255, .85),
        0 0 12px rgba(137, 73, 255, .45);

    animation:
        starTwinkle
        var(--duration)
        ease-in-out
        infinite;

    animation-delay: var(--delay);
}


.star.big {

    width: 3px;
    height: 3px;

    background: rgba(231, 214, 255, .95);

    box-shadow:
        0 0 7px rgba(226, 201, 255, 1),
        0 0 18px rgba(151, 86, 255, .8),
        0 0 30px rgba(108, 49, 255, .35);
}


@keyframes starTwinkle {

    0%,
    100% {

        opacity: .15;

        transform: scale(.7);
    }

    50% {

        opacity: 1;

        transform: scale(1.45);
    }
}


/* ==================================================
   紫色星雲
================================================== */

.nebula {

    position: fixed;

    width: 380px;
    height: 380px;

    border-radius: 50%;

    filter: blur(75px);

    pointer-events: none;

    z-index: 0;

    opacity: .13;
}


.nebula.one {

    background: #713cff;

    left: -150px;
    top: 12%;

    animation:
        nebulaOne
        18s
        ease-in-out
        infinite
        alternate;
}


.nebula.two {

    background: #a34dff;

    right: -160px;
    top: 48%;

    animation:
        nebulaTwo
        22s
        ease-in-out
        infinite
        alternate;
}


@keyframes nebulaOne {

    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(90px, 70px);
    }
}


@keyframes nebulaTwo {

    from {
        transform: translate(0, 0);
    }

    to {
        transform: translate(-80px, -50px);
    }
}


/* ==================================================
   流星
================================================== */

.meteor {

    position: fixed;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: rgba(238, 222, 255, 1);

    box-shadow:
        0 0 6px rgba(224, 190, 255, 1),
        0 0 16px rgba(153, 83, 255, .9);

    pointer-events: none;

    z-index: 1;

    opacity: 0;

    transform: rotate(-35deg);
}


.meteor::after {

    content: "";

    position: absolute;

    right: 1px;
    top: 0;

    width: 90px;
    height: 1px;

    transform-origin: right center;

    background:
        linear-gradient(
            to left,
            rgba(226, 198, 255, .85),
            rgba(145, 79, 255, .35),
            transparent
        );

    filter: blur(.4px);
}


.meteor.fly {

    animation:
        meteorFly
        1.25s
        ease-out
        forwards;
}


@keyframes meteorFly {

    0% {

        opacity: 0;

        transform:
            translate(0, 0)
            rotate(-35deg);
    }

    10% {

        opacity: 1;
    }

    75% {

        opacity: .9;
    }

    100% {

        opacity: 0;

        transform:
            translate(-260px, 190px)
            rotate(-35deg);
    }
}


/* ==================================================
   頂部
================================================== */

.topbar {

    position: sticky;

    top: 0;

    z-index: 20;

    height: 68px;

    padding: 12px 16px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        rgba(5, 3, 11, .68);

    backdrop-filter: blur(18px);

    border-bottom:
        1px solid rgba(183, 134, 255, .12);
}


.top-left {

    display: flex;

    align-items: center;

    gap: 12px;
}


.back-btn {

    width: 40px;
    height: 40px;

    border-radius: 50%;

    border:
        1px solid rgba(198, 166, 255, .23);

    background:
        rgba(255,255,255,.025);

    color: #ddd;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;
}


.back-btn svg {

    width: 19px;
    height: 19px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.5;

    stroke-linecap: round;

    stroke-linejoin: round;
}


.title-area strong {

    display: block;

    font-size: 15px;

    font-weight: 400;

    letter-spacing: 2px;
}


.status {

    margin-top: 3px;

    display: flex;

    align-items: center;

    gap: 5px;

    color:
        rgba(220, 208, 235, .42);

    font-size: 9px;
}


.status-dot {

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #b98cff;

    box-shadow:
        0 0 8px #9d5cff;
}


.top-actions {

    display: flex;

    align-items: center;

    gap: 8px;
}


.icon-btn {

    width: 40px;
    height: 40px;

    border-radius: 50%;

    border:
        1px solid rgba(198, 166, 255, .22);

    background:
        rgba(255,255,255,.025);

    color: #ddd;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;
}


.icon-btn svg {

    width: 18px;
    height: 18px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.5;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* ==================================================
   聊天區
================================================== */

.chat {

    position: relative;

    z-index: 2;

    width: min(820px, calc(100% - 24px));

    margin: 0 auto;

    padding:

        28px

        0

        145px;
}


/* ==================================================
   歡迎
================================================== */

.welcome {

    text-align: center;

    padding: 20px 0 32px;
}


.welcome-symbol {

    width: 62px;
    height: 62px;

    margin: 0 auto 17px;

    border-radius: 50%;

    border:
        1px solid rgba(204, 172, 255, .32);

    background:
        radial-gradient(
            circle,
            rgba(156, 91, 255, .18),
            rgba(45, 19, 90, .08)

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 0 28px rgba(122, 61, 255, .20),
        inset 0 0 20px rgba(152, 91, 255, .08);
}


.welcome-symbol svg {

    width: 27px;
    height: 27px;

    fill: none;

    stroke: #d5baff;

    stroke-width: 1.4;

    stroke-linecap: round;

    stroke-linejoin: round;
}


.welcome h1 {

    font-size: 24px;

    font-weight: 300;

    letter-spacing: 5px;

    text-shadow:
        0 0 20px rgba(165, 103, 255, .35);
}


.welcome p {

    margin-top: 10px;

    color:
        rgba(221, 208, 237, .47);

    font-size: 11px;

    line-height: 1.8;
}


/* ==================================================
   訊息
================================================== */

.message {

    display: flex;

    margin-bottom: 18px;
}


.message.ai {

    justify-content: flex-start;
}


.message.user {

    justify-content: flex-end;
}


.bubble {

    max-width: 82%;

    padding: 13px 15px;

    border-radius: 17px;

    font-size: 13px;

    line-height: 1.75;

    white-space: pre-wrap;

    word-break: break-word;
}


.message.ai .bubble {

    border:
        1px solid rgba(184, 143, 241, .14);

    background:
        rgba(91, 46, 151, .09);

    color:
        rgba(239, 231, 248, .88);

    border-bottom-left-radius: 5px;
}


.message.user .bubble {

    border:
        1px solid rgba(158, 108, 224, .18);

    background:
        rgba(116, 66, 190, .15);

    color:
        rgba(246, 240, 252, .92);

    border-bottom-right-radius: 5px;
}


/* ==================================================
   輸入區
================================================== */

.input-area {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 30;

    padding:
        10px
        12px
        calc(10px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            to top,
            rgba(5,3,11,.98),
            rgba(5,3,11,.88),
            transparent

    pointer-events: none;
}


.input-box {

    width: min(820px, 100%);

    margin: 0 auto;

    min-height: 55px;

    border:
        1px solid rgba(193, 151, 255, .23);

    border-radius: 20px;

    background:
        rgba(19, 11, 34, .92);

    backdrop-filter: blur(20px);

    display: flex;

    align-items: flex-end;

    gap: 7px;

    padding: 8px;

    box-shadow:
        0 -10px 35px rgba(67, 29, 135, .12);

    pointer-events: auto;
}


/* ==================================================
   加號
================================================== */

.plus-btn {

    height: 38px;

    flex: 0 0 38px;

    border: none;

    border-radius: 50%;

    background: transparent;

    color: #cdb5ec;

}


.plus-btn svg {

    stroke-linecap: round;
}


/* ==================================================
   輸入
================================================== */

#messageInput {

    flex: 1;

    min-width: 0;

    min-height: 38px;

    max-height: 130px;

    resize: none;

    border: none;

    background: transparent;

    color: white;

    font-size: 14px;

    line-height: 1.55;

    padding: 8px 3px;
}


#messageInput::placeholder {

    color:
        rgba(221, 208, 237, .34);
}


/* ==================================================
   麥克風 / 發送
================================================== */

.send-btn,
.mic-btn {

    width: 38px;
    height: 38px;

    flex: 0 0 38px;

    border-radius: 50%;

    border:

    background:
        rgba(255,255,255,.025);

    color: #d8c4f4;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;
}


.send-btn svg,
.mic-btn svg {

    width: 18px;
    height: 18px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.5;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* ==================================================
   加號選單
================================================== */

.plus-menu {

    position: fixed;

    left: 15px;

    bottom: 78px;

    z-index: 40;

    width: 225px;

    padding: 8px;

    border:
        1px solid rgba(194, 155, 255, .20);

    border-radius: 18px;

    background:
        rgba(16, 9, 29, .96);

    backdrop-filter: blur(20px);

    box-shadow:
        0 15px 45px rgba(0,0,0,.45);

    display: none;
}


.plus-menu.show {

    display: block;
}


.menu-item {

    width: 100%;

    min-height: 43px;

    border: none;

    background: transparent;

    color:
        rgba(234, 224, 244, .78);

    border-radius: 11px;

    display: flex;

    align-items: center;

    gap: 11px;

    padding: 8px 10px;

    cursor: pointer;

    text-align: left;

    font-size: 12px;
}


.menu-item:hover {

    background:
        rgba(132, 74, 215, .10);
}


.menu-item svg {

    width: 18px;
    height: 18px;

    flex: 0 0 18px;

    fill: none;

    stroke: #cdb1ee;

    stroke-width: 1.4;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* ==================================================
   載入動畫
================================================== */

.typing {

    display: inline-flex;

    gap: 4px;

    padding: 4px 2px;
}


.typing span {

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #b38aff;

    animation:
        typing
        1.1s
        infinite
        ease-in-out;
}


.typing span:nth-child(2) {

    animation-delay: .15s;
}


.typing span:nth-child(3) {

    animation-delay: .3s;
}


@keyframes typing {

    0%,
    100% {
        opacity: .25;
        transform: translateY(0);
    }

    50% {
        opacity: 1;
        transform: translateY(-3px);
    }
}


/* ==================================================
   手機
================================================== */

@media (max-width: 600px) {

    .chat {

        width: calc(100% - 18px);

        padding-top: 20px;
    }


    .bubble {

        max-width: 88%;
    }


    .plus-menu {

        left: 10px;

        bottom: 76px;

        width: 210px;
    }

}

</style>
</head>

<script>

/* ==================================================
   產生星光
================================================== */

const starsContainer =
    document.getElementById("stars");

const starCount =
    window.innerWidth < 600 ? 75 : 120;

for (
    let i = 0;
    i < starCount;
    i++
) {

    const star =
        document.createElement("div");

    star.className =
        Math.random() > .92
            ? "star big"
            : "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.setProperty(
        "--duration",
        (2.5 + Math.random() * 5) + "s"
    );

    star.style.setProperty(
        "--delay",
        (-Math.random() * 5) + "s"
    );

    starsContainer.appendChild(star);
}


/* ==================================================
   偶爾流星
================================================== */

function createMeteor() {

    const meteor =
        document.createElement("div");

    meteor.className = "meteor";

    meteor.style.left =
        (55 + Math.random() * 40) + "%";

    meteor.style.top =
        (5 + Math.random() * 45) + "%";

    document.body.appendChild(meteor);

    requestAnimationFrame(() => {

        meteor.classList.add("fly");

    });

    setTimeout(() => {

        meteor.remove();

    }, 1500);
}


/*
 * 不固定頻率。
 * 每次約 8～20 秒隨機出現。
 */

function scheduleMeteor() {

    const delay =
        8000 + Math.random() * 12000;

    setTimeout(() => {

        createMeteor();

        scheduleMeteor();

    }, delay);
}

scheduleMeteor();


/* ==================================================
   API
================================================== */

const AI_FUNCTION_URL =
    (typeof XUANJING_CONFIG !== "undefined" &&
     XUANJING_CONFIG.ai &&
     XUANJING_CONFIG.ai.url)
        ? XUANJING_CONFIG.ai.url
        : "https://zuypaeagxjezlqdppvnm.supabase.co/functions/v1/ai-chat";


/* ==================================================
   DOM
================================================== */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const micBtn =
    document.getElementById("micBtn");

const plusBtn =
    document.getElementById("plusBtn");

const plusMenu =
    document.getElementById("plusMenu");

const speakerBtn =
    document.getElementById("speakerBtn");


/* ==================================================
   狀態
================================================== */

let messages = [];

let speakerEnabled =
    localStorage.getItem(
        "xuanjing_speaker"
    ) !== "off";


/* ==================================================
   AI語音
================================================== */

function updateSpeakerIcon() {

    if (speakerEnabled) {

        speakerBtn.innerHTML = `
            <svg viewBox="0 0 24 24">
                <path d="M5 9v6h4l5 4V5l-5 4H5Z"/>
                <path d="M17 9a4 4 0 0 1 0 6"/>
                <path d="M19 7a7 7 0 0 1 0 10"/>
            </svg>
        `;

    } else {

        speakerBtn.innerHTML = `
            <svg viewBox="0 0 24 24">
                <path d="M5 9v6h4l5 4V5l-5 4H5Z"/>
                <path d="M17 9l4 4"/>
                <path d="M21 9l-4 4"/>
            </svg>
        `;
    }
}

updateSpeakerIcon();


speakerBtn.addEventListener(
    "click",
    function () {

        speakerEnabled =
            !speakerEnabled;

        localStorage.setItem(
            "xuanjing_speaker",
            speakerEnabled
                ? "on"
                : "off"
        );

        if (!speakerEnabled &&
            "speechSynthesis" in window) {

            speechSynthesis.cancel();
        }

        updateSpeakerIcon();
    }
);


/* ==================================================
   AI語音播放
================================================== */

function speakAI(text) {

    if (!speakerEnabled) return;

    if (!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "zh-TW";

    utterance.rate = .95;

    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
}


/* ==================================================
   新增訊息
================================================== */

function addMessage(
    role,
    text
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " +
        (role === "user"
            ? "user"
            : "ai");

    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}


/* ==================================================
   打字動畫
================================================== */

function showTyping() {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message ai";

    wrapper.id =
        "typingMessage";

    wrapper.innerHTML = `
        <div class="bubble">
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    `;

    chat.appendChild(wrapper);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}


function hideTyping() {

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if (typing) {

        typing.remove();
    }
}


/* ==================================================
   發送AI
================================================== */

async function sendMessage() {

    const text =
        input.value.trim();

    if (!text) return;

    input.value = "";

    input.style.height = "auto";

    addMessage(
        "user",
        text
    );

    messages.push({
        role: "user",
        content: text
    });

    showTyping();

    sendBtn.disabled = true;

    try {

        const response =
            await fetch(
                AI_FUNCTION_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text,
                        messages: messages
                    })
                }
            );

        if (!response.ok) {

            throw new Error(
                "AI request failed"
            );
        }

        const data =
            await response.json();

        hideTyping();

        const reply =
            data.reply ||
            data.message ||
            data.content ||
            "玄境暫時沒有收到完整回應。";

        addMessage(
            "ai",
            reply
        );

        messages.push({
            role: "assistant",
            content: reply
        });

        speakAI(reply);

    } catch (error) {

        hideTyping();

        addMessage(
            "ai",
            "目前玄境 AI 暫時無法回應，請稍後再試。"
        );

        console.error(error);

    } finally {

        sendBtn.disabled = false;

        input.focus();
    }
}


sendBtn.addEventListener(
    "click",
    sendMessage
);


/* ==================================================
   Enter 發送
================================================== */

input.addEventListener(

    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey

);

/* ==================================================
   語音輸入
================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "zh-TW";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            micBtn.style.borderColor =
                "rgba(203,168,255,.75)";

            micBtn.style.boxShadow =
                "0 0 22px rgba(126,65,255,.40)";
        };


    recognition.onend =
        function() {

            micBtn.style.borderColor =
                "rgba(194,157,255,.20)";

            micBtn.style.boxShadow =
                "none";
        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript;

            if (!text) return;

            input.value =
                text;

            sendMessage();
        };
}


micBtn.addEventListener(
    "click",
    function() {

        if (!recognition) {

            alert(
                "目前瀏覽器不支援語音輸入。"
            );

            return;
        }

        try {

            recognition.start();

        } catch (error) {}
    }
);

/* ==================================================
   禁止整頁左右移動
   保留上下滑動
================================================== */

let touchStartX = 0;
let touchStartY = 0;


document.addEventListener(
    "touchstart",
    function(event) {

        if (!event.touches.length)
            return;

        touchStartX =
            event.touches[0].clientX;

        touchStartY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchmove",
    function(event) {

        if (!event.touches.length)
            return;

        const currentX =
            event.touches[0].clientX;

        const currentY =
            event.touches[0].clientY;

        const dx =
            currentX - touchStartX;

        const dy =
            currentY - touchStartY;


        /*
         * 只有左右移動時阻止。
         * 上下滑動完全保留。
         */

        if (
            Math.abs(dx) >
            Math.abs(dy)
            &&
            Math.abs(dx) > 8
        ) {

            event.preventDefault();
        }

    },
    {
        passive: false
    }
);

</script>
