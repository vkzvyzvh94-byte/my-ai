<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>玄境 AI｜Chat</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 20%,rgba(126,82,255,.25),transparent 35%),
    radial-gradient(circle at 20% 80%,rgba(82,40,160,.2),transparent 35%),
    linear-gradient(180deg,#080313 0%,#12052a 50%,#05020c 100%);
}

/* 星空 */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.8;
  background-image:
    radial-gradient(circle at 10% 15%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 25% 70%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 43% 35%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 67% 18%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 82% 55%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 91% 82%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 55% 90%,#fff 0 1px,transparent 1.5px);
  z-index:0;
}

.app{
  position:relative;
  z-index:1;
  width:100%;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* 頂部 */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  height:64px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 14px;
  background:rgba(8,3,18,.72);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(190,150,255,.12);
}

.topbar button{
  border:0;
  color:#fff;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(210,180,255,.18);
  border-radius:14px;
  padding:9px 13px;
  font-size:14px;
}

.title{
  flex:1;
  text-align:center;
}

.title strong{
  display:block;
  font-size:18px;
}

.title span{
  display:block;
  margin-top:2px;
  color:#bda9d8;
  font-size:11px;
}

/* 聊天 */
.chat{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:20px 14px 180px;
}

.welcome{
  text-align:center;
  padding:42px 10px 24px;
}

.orb{
  width:72px;
  height:72px;
  margin:0 auto 16px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,.2) 8%,transparent 12%),
    radial-gradient(circle,#b47cff 0%,#6934b6 40%,#24103f 70%,transparent 72%);
  box-shadow:
    0 0 30px rgba(150,90,255,.55),
    0 0 80px rgba(110,50,220,.25);
}

.welcome h1{
  margin:0;
  font-size:27px;
}

.welcome p{
  margin:9px 0 0;
  color:#bbaacb;
  font-size:14px;
}

/* 訊息 */
.message{
  display:flex;
  margin:14px 0;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:min(82%,700px);
  padding:13px 15px;
  border-radius:18px;
  line-height:1.65;
  font-size:15px;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.ai .bubble{
  background:rgba(255,255,255,.075);
  border:1px solid rgba(190,150,255,.15);
  border-top-left-radius:6px;
}

.message.user .bubble{
  background:linear-gradient(135deg,#7137b7,#4d238b);
  border:1px solid rgba(220,190,255,.2);
  border-top-right-radius:6px;
}

/* 輸入區 */
.composer-wrap{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  padding:
    10px
    max(10px,env(safe-area-inset-right))
    calc(10px + env(safe-area-inset-bottom))
    max(10px,env(safe-area-inset-left));
  background:linear-gradient(
    180deg,
    transparent,
    rgba(5,2,12,.94) 30%
  );
}

.composer{
  max-width:900px;
  margin:auto;
  padding:9px;
  border-radius:22px;
  background:rgba(24,9,43,.94);
  border:1px solid rgba(195,155,255,.2);
  box-shadow:0 -8px 35px rgba(0,0,0,.35);
}

.attach-preview{
  display:none;
  padding:7px 10px;
  margin-bottom:7px;
  border-radius:12px;
  background:rgba(255,255,255,.06);
  color:#d8cbea;
  font-size:12px;
}

.attach-preview.show{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.row{
  display:flex;
  align-items:flex-end;
  gap:7px;
}

textarea{
  flex:1;
  min-width:0;
  min-height:44px;
  max-height:150px;
  resize:none;
  border:0;
  outline:none;
  color:#fff;
  background:transparent;
  font:inherit;
  line-height:1.5;
  padding:10px 7px;
}

textarea::placeholder{
  color:#8e7ca2;
}

.icon-btn,
.send-btn{
  width:44px;
  height:44px;
  flex:0 0 44px;
  border-radius:14px;
  border:1px solid rgba(210,180,255,.17);
  color:#fff;
  background:rgba(255,255,255,.07);
  font-size:19px;
}

.send-btn{
  background:linear-gradient(135deg,#8245cf,#542394);
  border-color:rgba(220,190,255,.3);
}

/* 工具 */
.tools{
  display:none;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:8px 0 2px;
}

.tools.show{
  display:grid;
}

.tool{
  padding:11px 5px;
  border-radius:13px;
  border:1px solid rgba(210,180,255,.13);
  background:rgba(255,255,255,.05);
  color:#eee;
  text-align:center;
  font-size:12px;
}

.tool span{
  display:block;
  font-size:19px;
  margin-bottom:4px;
}

/* 狀態 */
.status{
  display:none;
  align-items:center;
  gap:8px;
  color:#a997b9;
  font-size:12px;
  padding:4px 4px 7px;
}

.status.show{
  display:flex;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#b47cff;
  box-shadow:0 0 10px #a66cff;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{opacity:.3;transform:scale(.7)}
}

/* 選單 */
.voice-on{
  color:#d4b7ff!important;
  border-color:rgba(190,140,255,.5)!important;
}

@media(max-width:600px){
  .bubble{
    max-width:88%;
  }

  .tools{
    grid-template-columns:repeat(4,1fr);
  }

  .tool{
    font-size:11px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <button id="homeBtn">⌂ 首頁</button>

    <div class="title">
      <strong>玄境 AI</strong>
      <span>你的私人智慧空間</span>
    </div>

    <button id="voiceToggle">🔊</button>
  </header>

  <main id="chat" class="chat">

    <section id="welcome" class="welcome">
      <div class="orb"></div>
      <h1>玄境 AI</h1>
      <p>你可以直接說，也可以直接問。</p>
    </section>

  </main>

  <div class="composer-wrap">

    <div class="composer">

      <div id="attachPreview" class="attach-preview">
        <span id="attachName"></span>
        <button id="removeAttach" type="button">✕</button>
      </div>

      <div id="status" class="status">
        <div class="dot"></div>
        <span>玄境正在思考……</span>
      </div>

      <div class="row">

        <button
          id="plusBtn"
          class="icon-btn"
          type="button"
          aria-label="更多功能"
        >＋</button>

        <textarea
          id="messageInput"
          rows="1"
          placeholder="告訴玄境，你現在想做什麼……"
        ></textarea>

        <button
          id="micBtn"
          class="icon-btn"
          type="button"
          aria-label="語音輸入"
        >🎙️</button>

        <button
          id="sendBtn"
          class="send-btn"
          type="button"
          aria-label="發送"
        >➤</button>

      </div>

      <div id="tools" class="tools">

        <button class="tool" id="cameraBtn" type="button">
          <span>📷</span>
          相機
        </button>

        <button class="tool" id="photoBtn" type="button">
          <span>🖼️</span>
          圖片
        </button>

        <button class="tool" id="videoBtn" type="button">
          <span>🎬</span>
          影片
        </button>

        <button class="tool" id="fileBtn" type="button">
          <span>📎</span>
          檔案
        </button>

        <button class="tool" id="drawBtn" type="button">
          <span>🎨</span>
          AI 繪圖
        </button>

        <button class="tool" id="translateBtn" type="button">
          <span>🌐</span>
          翻譯
        </button>

        <button class="tool" id="clearBtn" type="button">
          <span>🧹</span>
          清空
        </button>

        <button class="tool" id="speakBtn" type="button">
          <span>🔊</span>
          語音朗讀
        </button>

      </div>

    </div>

  </div>

</div>

<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
<input id="photoInput" type="file" accept="image/*" hidden>
<input id="videoInput" type="file" accept="video/*" hidden>
<input id="fileInput" type="file" hidden>

<script>
/* =========================================================
   玄境 AI Chat
   只使用已確認成功的 ai-chat API
========================================================= */

const AI_FUNCTION_URL =
  "https://zuypaeagxjezlqdppvnm.supabase.co/functions/v1/ai-chat";


/* =========================================================
   DOM
========================================================= */

const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");

const plusBtn = document.getElementById("plusBtn");
const tools = document.getElementById("tools");

const status = document.getElementById("status");

const voiceToggle = document.getElementById("voiceToggle");

const attachPreview =
  document.getElementById("attachPreview");

const attachName =
  document.getElementById("attachName");

const removeAttach =
  document.getElementById("removeAttach");


/* =========================================================
   對話記錄
========================================================= */

let messages = [];

let voiceEnabled =
  localStorage.getItem("xuanjing_voice") === "true";

let currentAttachment = null;

let sending = false;


/* =========================================================
   語音朗讀
========================================================= */

function updateVoiceButton(){
  voiceToggle.classList.toggle(
    "voice-on",
    voiceEnabled
  );

  voiceToggle.textContent =
    voiceEnabled ? "🔊" : "🔇";
}

updateVoiceButton();


voiceToggle.addEventListener("click", () => {

  voiceEnabled = !voiceEnabled;

  localStorage.setItem(
    "xuanjing_voice",
    String(voiceEnabled)
  );

  if (!voiceEnabled) {
    window.speechSynthesis?.cancel();
  }

  updateVoiceButton();
});


function speak(text){

  if (!voiceEnabled) return;

  if (!("speechSynthesis" in window)) {
    return;
  }

  const clean =
    String(text || "").trim();

  if (!clean) return;

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(clean);

  utterance.lang = "zh-TW";
  utterance.rate = 1;
  utterance.pitch = 1;

  window.speechSynthesis.speak(
    utterance
  );
}


/* =========================================================
   顯示訊息
========================================================= */

function addMessage(role, text){

  welcome.style.display = "none";

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + role;

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent =
    text;

  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

  return bubble;
}


/* =========================================================
   AI 回應解析
========================================================= */

function extractAnswer(data){

  if (!data) return "";

  const candidates = [

    data.answer,

    data.reply,

    data.response,

    data.message,

    data.content,

    data.text,

    data.output,

    data?.data?.answer,

    data?.data?.reply,

    data?.data?.response,

    data?.data?.message,

    data?.data?.content,

    data?.data?.text,

    data?.data?.output,

    data?.choices?.[0]?.message?.content,

    data?.choices?.[0]?.text

  ];

  for (const value of candidates){

    if (
      typeof value === "string" &&
      value.trim()
    ){
      return value.trim();
    }

  }

  return "";
}


/* =========================================================
   發送 AI
========================================================= */

async function sendMessage(){

  if (sending) return;

  const text =
    input.value.trim();

  if (!text && !currentAttachment){
    return;
  }

  sending = true;

  let userText = text;

  if (currentAttachment){
    userText +=
      userText
        ? "\n\n[附件：" + currentAttachment.name + "]"
        : "[附件：" + currentAttachment.name + "]";
  }

  addMessage(
    "user",
    userText
  );

  messages.push({
    role:"user",
    content:text || userText
  });

  input.value = "";
  autoResize();

  status.classList.add("show");

  try {

    /*
      ★ 關鍵 ★

      你的 ai-chat 已經確認：
      POST {"message":"你好"} 可以成功。

      所以這裡直接使用 message。
      不再自行改 owner_message。
    */

    const response =
      await fetch(
        AI_FUNCTION_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:
              text || userText,

            messages:
              messages

          })

        }
      );


    const responseText =
      await response.text();


    let data;

    try {
      data =
        JSON.parse(responseText);
    } catch {
      data = {
        raw:responseText
      };
    }


    if (!response.ok){

      const details =
        data?.details ||
        data?.message ||
        data?.error ||
        responseText ||
        "未知錯誤";

      throw new Error(
        `服務回應錯誤：${response.status}｜${details}`
      );
    }


    const answer =
      extractAnswer(data);


    if (!answer){

      throw new Error(
        "AI 已回應，但沒有取得回答內容。"
      );
    }


    messages.push({
      role:"assistant",
      content:answer
    });


    addMessage(
      "ai",
      answer
    );


    speak(answer);


  } catch(error){

    console.error(
      "玄境 AI Chat Error:",
      error
    );

    addMessage(
      "ai",
      "抱歉，這次沒有成功取得 AI 回應。\n\n" +
      String(error?.message || error)
    );

  } finally {

    sending = false;

    status.classList.remove("show");

    clearAttachment();

  }

}


/* =========================================================
   發送按鈕
========================================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================================================
   Enter 發送
========================================================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   自動高度
========================================================= */

function autoResize(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      150
    ) + "px";
}

input.addEventListener(
  "input",
  autoResize
);


/* =========================================================
   ＋工具
========================================================= */

plusBtn.addEventListener(
  "click",
  () => {

    tools.classList.toggle(
      "show"
    );

  }
);


/* =========================================================
   附件
========================================================= */

function setAttachment(file){

  if (!file) return;

  currentAttachment = file;

  attachName.textContent =
    file.name;

  attachPreview.classList.add(
    "show"
  );

}


function clearAttachment(){

  currentAttachment = null;

  attachName.textContent = "";

  attachPreview.classList.remove(
    "show"
  );

}


removeAttach.addEventListener(
  "click",
  clearAttachment
);


/* =========================================================
   各種檔案
========================================================= */

const cameraInput =
  document.getElementById("cameraInput");

const photoInput =
  document.getElementById("photoInput");

const videoInput =
  document.getElementById("videoInput");

const fileInput =
  document.getElementById("fileInput");


document.getElementById("cameraBtn")
  .addEventListener(
    "click",
    () => cameraInput.click()
  );


document.getElementById("photoBtn")
  .addEventListener(
    "click",
    () => photoInput.click()
  );


document.getElementById("videoBtn")
  .addEventListener(
    "click",
    () => videoInput.click()
  );


document.getElementById("fileBtn")
  .addEventListener(
    "click",
    () => fileInput.click()
  );


cameraInput.addEventListener(
  "change",
  () => setAttachment(cameraInput.files?.[0])
);


photoInput.addEventListener(
  "change",
  () => setAttachment(photoInput.files?.[0])
);


videoInput.addEventListener(
  "change",
  () => setAttachment(videoInput.files?.[0])
);


fileInput.addEventListener(
  "change",
  () => setAttachment(fileInput.files?.[0])
);


/* =========================================================
   AI 繪圖
========================================================= */

document.getElementById("drawBtn")
  .addEventListener(
    "click",
    () => {

      input.value =
        "我想生成一張圖片，請先幫我一起構思畫面。";

      autoResize();

      input.focus();

    }
  );


/* =========================================================
   翻譯
========================================================= */

document.getElementById("translateBtn")
  .addEventListener(
    "click",
    () => {

      input.value =
        "請幫我翻譯以下內容：";

      autoResize();

      input.focus();

    }
  );


/* =========================================================
   清空
========================================================= */

document.getElementById("clearBtn")
  .addEventListener(
    "click",
    () => {

      if (
        !confirm("確定要清空這次對話嗎？")
      ){
        return;
      }

      messages = [];

      document
        .querySelectorAll(".message")
        .forEach(
          el => el.remove()
        );

      welcome.style.display =
        "block";

      window.speechSynthesis?.cancel();

    }
  );


/* =========================================================
   語音朗讀
========================================================= */

document.getElementById("speakBtn")
  .addEventListener(
    "click",
    () => {

      voiceEnabled = true;

      localStorage.setItem(
        "xuanjing_voice",
        "true"
      );

      updateVoiceButton();

      const lastAI =
        [...document.querySelectorAll(
          ".message.ai .bubble"
        )].pop();

      if (lastAI){
        speak(
          lastAI.textContent
        );
      }

    }
  );


/* =========================================================
   語音輸入
========================================================= */

let recognition = null;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "zh-TW";

  recognition.continuous =
    false;

  recognition.interimResults =
    true;


  recognition.onstart =
    () => {

      micBtn.classList.add(
        "voice-on"
      );

      micBtn.textContent =
        "⏺️";

    };


  recognition.onend =
    () => {

      micBtn.classList.remove(
        "voice-on"
      );

      micBtn.textContent =
        "🎙️";

    };


  recognition.onerror =
    event => {

      console.error(
        "SpeechRecognition:",
        event.error
      );

      micBtn.classList.remove(
        "voice-on"
      );

      micBtn.textContent =
        "🎙️";

    };


  recognition.onresult =
    event => {

      let transcript = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        transcript +=
          event.results[i][0].transcript;

      }

      input.value =
        transcript;

      autoResize();

    };

}


micBtn.addEventListener(
  "click",
  () => {

    if (!recognition){

      alert(
        "目前這個瀏覽器不支援網頁語音輸入。"
      );

      return;

    }

    try {

      recognition.start();

    } catch {

      try {
        recognition.stop();
      } catch {}

    }

  }
);


/* =========================================================
   首頁
========================================================= */

document.getElementById("homeBtn")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "home.html";

    }
  );


/* =========================================================
   初始
========================================================= */

autoResize();

</script>

</body>
</html>
