<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>玄境 AI｜我的事情</title>

<script src="config.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(circle at 50% 25%, rgba(121,64,255,.16), transparent 32%),
        radial-gradient(circle at 15% 75%, rgba(88,42,180,.12), transparent 30%),
        radial-gradient(circle at 85% 45%, rgba(160,75,255,.08), transparent 28%),
        #05030b;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;

    position: relative;
    overflow-y: auto;
}


/* ==================================================
   紫色星光
================================================== */

#stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: rgba(216,190,255,.85);

    box-shadow:
        0 0 5px rgba(177,110,255,.85),
        0 0 12px rgba(137,73,255,.45);

    animation:
        starTwinkle
        var(--duration)
        ease-in-out
        infinite;

    animation-delay: var(--delay);
}

.star.big {
    width: 3px;
    height: 3px;

    background: rgba(231,214,255,.95);

    box-shadow:
        0 0 7px rgba(226,201,255,1),
        0 0 18px rgba(151,86,255,.8),
        0 0 30px rgba(108,49,255,.35);
}

@keyframes starTwinkle {

    0%,
    100% {
        opacity: .15;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.45);
    }
}


/* ==================================================
   紫色星雲
================================================== */

.nebula {
    position: fixed;

    width: 390px;
    height: 390px;

    border-radius: 50%;

    filter: blur(75px);

    pointer-events: none;

    z-index: 0;

    opacity: .13;
}

.nebula.one {
    background: #713cff;

    left: -150px;
    top: 10%;

    animation:
        nebulaOne
        18s
        ease-in-out
        infinite
        alternate;
}

.nebula.two {
    background: #a34dff;

    right: -160px;
    top: 50%;

    animation:
        nebulaTwo
        22s
        ease-in-out
        infinite
        alternate;
}

@keyframes nebulaOne {

    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(90px,70px);
    }
}

@keyframes nebulaTwo {

    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(-80px,-50px);
    }
}


/* ==================================================
   流星
================================================== */

.meteor {

    position: fixed;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: rgba(238,222,255,1);

    box-shadow:
        0 0 6px rgba(224,190,255,1),
        0 0 16px rgba(153,83,255,.9);

    pointer-events: none;

    z-index: 1;

    opacity: 0;

    transform: rotate(-35deg);
}

.meteor::after {

    content: "";

    position: absolute;

    right: 1px;
    top: 0;

    width: 90px;
    height: 1px;

    transform-origin: right center;

    background:
        linear-gradient(
            to left,
            rgba(226,198,255,.85),
            rgba(145,79,255,.35),
            transparent
        );

    filter: blur(.4px);
}

.meteor.fly {

    animation:
        meteorFly
        1.25s
        ease-out
        forwards;
}

@keyframes meteorFly {

    0% {
        opacity: 0;

        transform:
            translate(0,0)
            rotate(-35deg);
    }

    10% {
        opacity: 1;
    }

    75% {
        opacity: .9;
    }

    100% {
        opacity: 0;

        transform:
            translate(-260px,190px)
            rotate(-35deg);
    }
}


/* ==================================================
   頂部
================================================== */

.topbar {

    position: sticky;
    top: 0;
    z-index: 20;

    min-height: 68px;

    padding: 12px 16px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    background:
        rgba(5,3,11,.68);

    backdrop-filter: blur(18px);

    border-bottom:
        1px solid rgba(183,134,255,.12);
}

.top-left {

    display: flex;

    align-items: center;

    gap: 12px;
}

.home-btn {

    width: 40px;
    height: 40px;

    border-radius: 50%;

    border:
        1px solid rgba(198,166,255,.23);

    background:
        rgba(255,255,255,.025);

    color: #ddd;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.home-btn svg {

    width: 19px;
    height: 19px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.5;

    stroke-linecap: round;

    stroke-linejoin: round;
}

.title strong {

    display: block;

    font-size: 15px;

    font-weight: 400;

    letter-spacing: 2px;
}

.title span {

    display: block;

    margin-top: 3px;

    color:
        rgba(220,208,235,.42);

    font-size: 9px;

    letter-spacing: 1px;
}

.voice-btn {

    width: 40px;
    height: 40px;

    border-radius: 50%;

    border:
        1px solid rgba(198,166,255,.22);

    background:
        rgba(255,255,255,.025);

    color: #ddd;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.voice-btn svg {

    width: 18px;
    height: 18px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.5;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* ==================================================
   主內容
================================================== */

.container {

    position: relative;

    z-index: 2;

    width: min(850px, calc(100% - 24px));

    margin: 0 auto;

    padding:
        30px 0 70px;
}


/* ==================================================
   標題
================================================== */

.hero {

    text-align: center;

    padding: 15px 0 28px;
}

.hero h1 {

    font-size: 30px;

    font-weight: 300;

    letter-spacing: 6px;

    text-shadow:
        0 0 20px rgba(165,103,255,.35);
}

.hero p {

    margin-top: 11px;

    color:
        rgba(221,208,237,.48);

    font-size: 11px;

    line-height: 1.8;
}


/* ==================================================
   AI區
================================================== */

.ai-card {

    border:
        1px solid rgba(187,142,245,.18);

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            rgba(104,55,180,.13),
            rgba(255,255,255,.025)
        );

    padding: 20px;

    box-shadow:
        0 12px 45px rgba(67,29,135,.10);

    backdrop-filter: blur(14px);
}

.ai-title {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 14px;
}

.ai-icon {

    width: 42px;
    height: 42px;

    border-radius: 50%;

    border:
        1px solid rgba(205,170,255,.30);

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 0 22px rgba(126,65,255,.20);
}

.ai-icon svg {

    width: 20px;
    height: 20px;

    fill: none;

    stroke: #d5baff;

    stroke-width: 1.4;

    stroke-linecap: round;

    stroke-linejoin: round;
}

.ai-title strong {

    font-size: 15px;

    font-weight: 400;

    letter-spacing: 2px;
}

.ai-title span {

    display: block;

    margin-top: 4px;

    color:
        rgba(220,207,235,.43);

    font-size: 10px;
}

#aiInput {

    width: 100%;

    min-height: 115px;

    resize: vertical;

    border:
        1px solid rgba(193,151,255,.15);

    border-radius: 15px;

    background:
        rgba(8,5,15,.52);

    color: #fff;

    outline: none;

    padding: 13px;

    font-size: 13px;

    line-height: 1.7;
}

#aiInput::placeholder {

    color:
        rgba(221,208,237,.30);
}

.ai-actions {

    display: flex;

    justify-content: flex-end;

    margin-top: 10px;
}

.ai-send {

    border:
        1px solid rgba(194,157,255,.23);

    border-radius: 14px;

    background:
        rgba(127,70,210,.13);

    color:
        rgba(231,219,248,.82);

    padding: 10px 18px;

    cursor: pointer;

    font-size: 12px;

    letter-spacing: 1px;
}

.ai-result {

    margin-top: 15px;

    display: none;

    padding: 14px;

    border-radius: 15px;

    background:
        rgba(78,39,133,.10);

    border:
        1px solid rgba(184,143,241,.12);

    color:
        rgba(238,229,247,.82);

    font-size: 12px;

    line-height: 1.8;

    white-space: pre-wrap;
}


/* ==================================================
   選項
================================================== */

.options {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-top: 13px;
}

.option-btn {

    min-height: 60px;

    border:
        1px solid rgba(184,143,241,.13);

    border-radius: 15px;

    background:
        rgba(255,255,255,.025);

    color:
        rgba(226,215,239,.68);

    padding: 10px;

    cursor: pointer;

    font-size: 11px;

    line-height: 1.5;

    transition: .25s;
}

.option-btn:hover {

    border-color:
        rgba(198,160,255,.35);

    background:
        rgba(113,57,190,.09);
}


/* ==================================================
   今日事情
================================================== */

.section {

    margin-top: 30px;
}

.section-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 13px;
}

.section-title strong {

    font-size: 14px;

    font-weight: 400;

    letter-spacing: 2px;
}

.add-task {

    border:
        1px solid rgba(194,157,255,.18);

    background:
        transparent;

    color:
        rgba(220,202,243,.62);

    border-radius: 10px;

    padding: 7px 11px;

    font-size: 10px;

    cursor: pointer;
}

.task-list {

    display: flex;

    flex-direction: column;

    gap: 9px;
}

.task {

    min-height: 58px;

    border:
        1px solid rgba(184,143,241,.12);

    border-radius: 15px;

    background:
        rgba(255,255,255,.025);

    padding: 12px 13px;

    display: flex;

    align-items: center;

    gap: 11px;
}

.task-check {

    width: 21px;
    height: 21px;

    flex: 0 0 21px;

    border-radius: 50%;

    border:
        1px solid rgba(197,161,255,.30);

    background: transparent;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;
}

.task-check.done {

    background:
        rgba(140,86,230,.25);

    border-color:
        rgba(197,161,255,.60);
}

.task-check svg {

    width: 13px;
    height: 13px;

    fill: none;

    stroke: #d7c0f5;

    stroke-width: 1.6;

    stroke-linecap: round;

    stroke-linejoin: round;

    display: none;
}

.task-check.done svg {

    display: block;
}

.task-text {

    flex: 1;

    min-width: 0;

    font-size: 12px;

    color:
        rgba(235,227,243,.75);

    line-height: 1.5;
}

.task.done .task-text {

    text-decoration: line-through;

    color:
        rgba(205,193,217,.32);
}


/* ==================================================
   語音提醒
================================================== */

.reminder {

    margin-top: 30px;

    border:
        1px solid rgba(184,143,241,.13);

    border-radius: 18px;

    background:
        rgba(255,255,255,.025);

    padding: 17px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}

.reminder-left strong {

    display: block;

    font-size: 13px;

    font-weight: 400;

    letter-spacing: 1px;
}

.reminder-left span {

    display: block;

    margin-top: 5px;

    font-size: 10px;

    color:
        rgba(220,207,235,.40);
}

.switch {

    position: relative;

    width: 44px;
    height: 25px;

    flex: 0 0 44px;
}

.switch input {

    opacity: 0;

    width: 0;
    height: 0;
}

.slider {

    position: absolute;

    inset: 0;

    border-radius: 30px;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid rgba(255,255,255,.10);

    cursor: pointer;

    transition: .25s;
}

.slider::before {

    content: "";

    position: absolute;

    width: 17px;
    height: 17px;

    left: 3px;
    top: 3px;

    border-radius: 50%;

    background:
        rgba(220,210,230,.70);

    transition: .25s;
}

.switch input:checked + .slider {

    background:
        rgba(125,68,210,.30);

    border-color:
        rgba(194,157,255,.40);
}

.switch input:checked + .slider::before {

    transform:
        translateX(18px);

    background:
        #c8a6f5;

    box-shadow:
        0 0 10px rgba(160,95,255,.6);
}


/* ==================================================
   手機
================================================== */

@media (max-width: 650px) {

    .options {

        grid-template-columns: 1fr;
    }

    .container {

        width: calc(100% - 18px);
    }

    .hero h1 {

        font-size: 27px;

        letter-spacing: 5px;
    }
}

</style>
</head>


<body>

<!-- 紫色星光 -->
<div id="stars"></div>

<!-- 紫色星雲 -->
<div class="nebula one"></div>
<div class="nebula two"></div>


<header class="topbar">

    <div class="top-left">

        <button
            class="home-btn"
            onclick="location.href='home.html'"
            aria-label="Home"
        >

            <svg viewBox="0 0 24 24">

                <path d="M3 11.5L12 4l9 7.5"/>

                <path d="M5.5 10.5V20h13v-9.5"/>

                <path d="M9.5 20v-5h5v5"/>

            </svg>

        </button>


        <div class="title">

            <strong>我的事情</strong>

            <span>人生操作台</span>

        </div>

    </div>


    <button
        class="voice-btn"
        id="voiceBtn"
        aria-label="語音"
    >

        <svg viewBox="0 0 24 24">

            <path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/>

            <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>

            <path d="M12 18v3"/>

            <path d="M8 21h8"/>

        </svg>

    </button>

</header>


<main class="container">


    <section class="hero">

        <h1>我的事情</h1>

        <p>
            不只是把事情列出來。<br>
            玄境會陪你一起想清楚，下一步可以怎麼走。
        </p>

    </section>


    <!-- ==================================================
         AI
    ================================================== -->

    <section class="ai-card">

        <div class="ai-title">

            <div class="ai-icon">

                <svg viewBox="0 0 24 24">

                    <path d="M12 3a8 8 0 0 0-8 8v3a3 3 0 0 0 3 3h1"/>

                    <path d="M12 3a8 8 0 0 1 8 8v3a3 3 0 0 1-3 3h-1"/>

                    <path d="M8 14v2a4 4 0 0 0 8 0v-2"/>

                    <path d="M10 21h4"/>

                </svg>

            </div>

            <div>

                <strong>玄境 AI</strong>

                <span>
                    告訴我你正在面對什麼，我們一起拆開來看。
                </span>

            </div>

        </div>


        <textarea
            id="aiInput"
            placeholder="例如：最近有很多事情堆在一起，我不知道先做哪一件……"
        ></textarea>


        <div class="ai-actions">

            <button
                class="ai-send"
                id="aiSend"
            >
                讓玄境幫我分析
            </button>

        </div>


        <div
            class="ai-result"
            id="aiResult"
        ></div>


        <div class="options">

            <button
                class="option-btn"
                data-text="我現在有一件很急的事情，不知道該怎麼處理，請幫我分析。"
            >
                🔹 有急事<br>
                幫我理清
            </button>

            <button
                class="option-btn"
                data-text="我最近一直卡住，請幫我找出問題可能在哪裡。"
            >
                🔹 我卡住了<br>
                幫我找原因
            </button>

            <button
                class="option-btn"
                data-text="我想規劃接下來一段時間的生活，請幫我整理方向。"
            >
                🔹 想規劃未來<br>
                幫我找方向
            </button>

        </div>

    </section>


    <!-- ==================================================
         今天的事情
    ================================================== -->

    <section class="section">

        <div class="section-title">

            <strong>今天的事情</strong>

            <button
                class="add-task"
                id="addTask"
            >
                ＋ 新增
            </button>

        </div>


        <div
            class="task-list"
            id="taskList"
        >

            <div class="task">

                <button
                    class="task-check"
                    onclick="toggleTask(this)"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M5 12l4 4L19 7"/>

                    </svg>

                </button>

                <div class="task-text">
                    今天最重要的一件事
                </div>

            </div>


            <div class="task">

                <button
                    class="task-check"
                    onclick="toggleTask(this)"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M5 12l4 4L19 7"/>

                    </svg>

                </button>

                <div class="task-text">
                    整理今天需要處理的事情
                </div>

            </div>


            <div class="task">

                <button
                    class="task-check"
                    onclick="toggleTask(this)"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M5 12l4 4L19 7"/>

                    </svg>

                </button>

                <div class="task-text">
                    留一點時間給自己
                </div>

            </div>

        </div>

    </section>


    <!-- ==================================================
         語音提醒
    ================================================== -->

    <section class="reminder">

        <div class="reminder-left">

            <strong>玄境語音提醒</strong>

            <span>
                允許玄境提醒你重要的事情
            </span>

        </div>


        <label class="switch">

            <input
                type="checkbox"
                id="reminderToggle"
            >

            <span class="slider"></span>

        </label>

    </section>

</main>


<script>

/* ==================================================
   紫色星光
================================================== */

const starsContainer =
    document.getElementById("stars");

const starCount =
    window.innerWidth < 600 ? 75 : 120;

for (
    let i = 0;
    i < starCount;
    i++
) {

    const star =
        document.createElement("div");

    star.className =
        Math.random() > .92
            ? "star big"
            : "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.setProperty(
        "--duration",
        (2.5 + Math.random() * 5) + "s"
    );

    star.style.setProperty(
        "--delay",
        (-Math.random() * 5) + "s"
    );

    starsContainer.appendChild(star);
}


/* ==================================================
   偶爾流星
================================================== */

function createMeteor() {

    const meteor =
        document.createElement("div");

    meteor.className =
        "meteor";

    meteor.style.left =
        (55 + Math.random() * 40) + "%";

    meteor.style.top =
        (5 + Math.random() * 45) + "%";

    document.body.appendChild(
        meteor
    );

    requestAnimationFrame(() => {

        meteor.classList.add("fly");

    });

    setTimeout(() => {

        meteor.remove();

    }, 1500);
}


function scheduleMeteor() {

    const delay =
        8000 + Math.random() * 12000;

    setTimeout(() => {

        createMeteor();

        scheduleMeteor();

    }, delay);
}

scheduleMeteor();


/* ==================================================
   AI
================================================== */

const AI_FUNCTION_URL =
    (typeof XUANJING_CONFIG !== "undefined" &&
     XUANJING_CONFIG.ai &&
     XUANJING_CONFIG.ai.url)
        ? XUANJING_CONFIG.ai.url
        : "https://zuypaeagxjezlqdppvnm.supabase.co/functions/v1/ai-chat";


const aiInput =
    document.getElementById("aiInput");

const aiSend =
    document.getElementById("aiSend");

const aiResult =
    document.getElementById("aiResult");


let lifeMessages = [];


async function askAI(text) {

    if (!text.trim())
        return;


    aiResult.style.display =
        "block";

    aiResult.textContent =
        "玄境正在陪你整理……";


    lifeMessages.push({

        role: "user",

        content: text

    });


    try {

        const response =
            await fetch(
                AI_FUNCTION_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message: text,

                        messages:
                            lifeMessages

                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "AI request failed"
            );
        }


        const data =
            await response.json();


        const reply =
            data.reply ||
            data.message ||
            data.content ||
            "玄境暫時沒有收到完整回應。";


        aiResult.textContent =
            reply;


        lifeMessages.push({

            role: "assistant",

            content: reply

        });


    } catch (error) {

        console.error(error);

        aiResult.textContent =
            "目前玄境 AI 暫時無法回應，請稍後再試。";
    }
}


aiSend.addEventListener(
    "click",
    function() {

        askAI(
            aiInput.value
        );
    }
);


/* ==================================================
   三個AI選項
================================================== */

document
    .querySelectorAll(".option-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                aiInput.value =
                    this.dataset.text;

                aiInput.focus();
            }
        );

    });


/* ==================================================
   任務完成
================================================== */

function toggleTask(button) {

    const task =
        button.closest(".task");

    button.classList.toggle(
        "done"
    );

    task.classList.toggle(
        "done"
    );
}


/* ==================================================
   新增任務
================================================== */

document
    .getElementById("addTask")
    .addEventListener(
        "click",
        function() {

            const text =
                prompt(
                    "你想新增什麼事情？"
                );

            if (!text ||
                !text.trim()) {

                return;
            }


            const task =
                document.createElement("div");

            task.className =
                "task";


            task.innerHTML = `

                <button
                    class="task-check"
                    onclick="toggleTask(this)"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M5 12l4 4L19 7"/>

                    </svg>

                </button>


                <div class="task-text">
                    ${escapeHtml(text)}
                </div>

            `;


            document
                .getElementById("taskList")
                .appendChild(task);

        }
    );


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


/* ==================================================
   語音提醒
================================================== */

const reminderToggle =
    document.getElementById(
        "reminderToggle"
    );


reminderToggle.checked =
    localStorage.getItem(
        "xuanjing_voice_reminder"
    ) === "on";


reminderToggle.addEventListener(
    "change",
    async function() {

        if (this.checked) {

            if (
                "Notification" in window &&
                Notification.permission !== "granted"
            ) {

                try {

                    await Notification.requestPermission();

                } catch (error) {

                    console.error(error);

                }

            }


            localStorage.setItem(
                "xuanjing_voice_reminder",
                "on"
            );

        } else {

            localStorage.setItem(
                "xuanjing_voice_reminder",
                "off"
            );
        }
    }
);


/* ==================================================
   Life語音輸入
================================================== */

const voiceBtn =
    document.getElementById(
        "voiceBtn"
    );


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "zh-TW";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            voiceBtn.style.borderColor =
                "rgba(203,168,255,.75)";

            voiceBtn.style.boxShadow =
                "0 0 22px rgba(126,65,255,.40)";
        };


    recognition.onend =
        function() {

            voiceBtn.style.borderColor =
                "rgba(198,166,255,.22)";

            voiceBtn.style.boxShadow =
                "none";
        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript;

            if (!text)
                return;

            aiInput.value =
                text;

            askAI(text);
        };
}


voiceBtn.addEventListener(
    "click",
    function() {

        if (!recognition) {

            alert(
                "目前瀏覽器不支援語音輸入。"
            );

            return;
        }


        try {

            recognition.start();

        } catch (error) {}

    }
);


/* ==================================================
   只禁止左右移動
   上下滑動保持正常
================================================== */

let touchStartX = 0;
let touchStartY = 0;


document.addEventListener(
    "touchstart",
    function(event) {

        if (!event.touches.length)
            return;

        touchStartX =
            event.touches[0].clientX;

        touchStartY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchmove",
    function(event) {

        if (!event.touches.length)
            return;

        const currentX =
            event.touches[0].clientX;

        const currentY =
            event.touches[0].clientY;

        const dx =
            currentX - touchStartX;

        const dy =
            currentY - touchStartY;


        if (
            Math.abs(dx) >
            Math.abs(dy)
            &&
            Math.abs(dx) > 8
        ) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);

</script>
