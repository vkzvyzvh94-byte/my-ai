<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>玄境 AI｜我的事情</title>

<style>

/* =====================================================
   基礎
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #05020d;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;

    overflow-x: hidden;
}

body {
    overflow-y: auto;
}


/* =====================================================
   紫色宇宙背景
===================================================== */

#space {

    position: fixed;

    inset: 0;

    z-index: 0;

    overflow: hidden;

    pointer-events: none;
}

.nebula {

    position: absolute;

    width: 80vw;
    height: 80vw;

    border-radius: 50%;

    filter: blur(65px);

    opacity: .22;

    background:
        radial-gradient(
            circle,
            rgba(145,65,255,.75),
            rgba(80,25,170,.25) 42%,
            transparent 72%
        );

    animation:
        nebulaMove 18s ease-in-out infinite alternate;
}

.nebula.one {

    left: -25vw;
    top: -20vw;
}

.nebula.two {

    right: -30vw;
    bottom: -20vw;

    opacity: .16;

    animation-delay: -7s;
}

@keyframes nebulaMove {

    from {
        transform:
            translate3d(-3%, -2%, 0)
            scale(1);
    }

    to {
        transform:
            translate3d(4%, 3%, 0)
            scale(1.15);
    }
}


/* =====================================================
   星空
===================================================== */

.star {

    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: rgba(255,255,255,.9);

    box-shadow:
        0 0 6px
        rgba(190,125,255,.9);

    animation:
        twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {

    0%,
    100% {

        opacity: .2;

        transform: scale(.7);
    }

    50% {

        opacity: 1;

        transform: scale(1.5);
    }
}


/* =====================================================
   流星
===================================================== */

.meteor {

    position: fixed;

    width: 130px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(225,185,255,.95),
            transparent
        );

    transform: rotate(-35deg);

    opacity: 0;

    pointer-events: none;

    z-index: 2;

    animation:
        meteorMove 1.5s linear forwards;
}

@keyframes meteorMove {

    0% {

        opacity: 0;

        transform:
            translate3d(100px,-100px,0)
            rotate(-35deg);
    }

    10% {

        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translate3d(-420px,420px,0)
            rotate(-35deg);
    }
}


/* =====================================================
   App
===================================================== */

.app {

    position: relative;

    z-index: 5;

    width: 100%;

    min-height: 100vh;

    padding-bottom: 50px;
}


/* =====================================================
   Topbar
===================================================== */

.topbar {

    position: sticky;

    top: 0;

    z-index: 20;

    width: 100%;

    height: 64px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 15px;

    background:
        rgba(5,2,13,.78);

    border-bottom:
        1px solid
        rgba(190,130,255,.12);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);
}

.top-left {

    display: flex;

    align-items: center;

    gap: 11px;

    min-width: 0;
}

.home-button,
.voice-button {

    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    border-radius: 50%;

    border:
        1px solid
        rgba(205,155,255,.25);

    background:
        rgba(100,50,170,.12);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 0;

    cursor: pointer;
}

.home-button svg,
.voice-button svg {

    width: 21px;
    height: 21px;

    fill: none;

    stroke:
        rgba(240,220,255,.9);

    stroke-width: 1.5;

    stroke-linecap: round;

    stroke-linejoin: round;
}

.voice-button.active {

    background:
        rgba(140,60,220,.35);

    border-color:
        rgba(215,165,255,.45);

    box-shadow:
        0 0 18px
        rgba(145,70,255,.2);
}

.page-title {

    min-width: 0;
}

.page-title-main {

    font-size: 17px;

    letter-spacing: 2px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.page-title-sub {

    margin-top: 2px;

    font-size: 9px;

    letter-spacing: 1.5px;

    color:
        rgba(255,255,255,.38);
}


/* =====================================================
   Header
===================================================== */

.header {

    padding:
        30px 18px 18px;
}

.header h1 {

    margin: 0;

    font-size: 30px;

    font-weight: 500;

    letter-spacing: 4px;
}

.header p {

    margin:
        9px 0 0;

    font-size: 13px;

    line-height: 1.8;

    color:
        rgba(255,255,255,.5);
}


/* =====================================================
   Section
===================================================== */

.section {

    margin:
        0 15px 18px;
}

.section-title {

    margin:
        0 0 9px 5px;

    font-size: 12px;

    letter-spacing: 2px;

    color:
        rgba(215,180,255,.72);
}


/* =====================================================
   Card
===================================================== */

.card {

    width: 100%;

    border-radius: 20px;

    border:
        1px solid
        rgba(200,150,255,.13);

    background:
        linear-gradient(
            145deg,
            rgba(42,22,70,.42),
            rgba(15,9,28,.76)
        );

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.25);

    overflow: hidden;
}


/* =====================================================
   AI 區
===================================================== */

.ai-card {

    padding: 18px;
}

.ai-intro {

    display: flex;

    align-items: flex-start;

    gap: 12px;

    margin-bottom: 15px;
}

.ai-symbol {

    width: 43px;
    height: 43px;

    flex: 0 0 43px;

    border-radius: 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(130,65,220,.16);

    border:
        1px solid
        rgba(205,155,255,.18);
}

.ai-symbol svg {

    width: 22px;
    height: 22px;

    fill: none;

    stroke:
        rgba(230,210,255,.9);

    stroke-width: 1.4;
}

.ai-intro-title {

    font-size: 15px;

    margin-bottom: 4px;
}

.ai-intro-text {

    font-size: 11px;

    line-height: 1.65;

    color:
        rgba(255,255,255,.45);
}


/* =====================================================
   Input
===================================================== */

.input-box {

    width: 100%;

    border:
        1px solid
        rgba(205,155,255,.15);

    border-radius: 17px;

    background:
        rgba(255,255,255,.045);

    padding: 12px;
}

#lifeInput {

    width: 100%;

    min-height: 105px;

    max-height: 220px;

    resize: vertical;

    border: none;

    outline: none;

    background: transparent;

    color: #fff;

    font-family: inherit;

    font-size: 14px;

    line-height: 1.7;
}

#lifeInput::placeholder {

    color:
        rgba(255,255,255,.3);
}


/* =====================================================
   AI 工具列
===================================================== */

.ai-actions {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 8px;

    margin-top: 10px;
}

.ai-action-left {

    display: flex;

    gap: 7px;
}

.small-button {

    min-width: 42px;

    height: 40px;

    border-radius: 12px;

    border:
        1px solid
        rgba(205,155,255,.14);

    background:
        rgba(255,255,255,.04);

    color:
        rgba(255,255,255,.75);

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 6px;

    padding:
        0 11px;

    cursor: pointer;

    font-size: 11px;
}

.small-button svg {

    width: 18px;
    height: 18px;

    fill: none;

    stroke:
        rgba(230,210,255,.82);

    stroke-width: 1.4;

    stroke-linecap: round;

    stroke-linejoin: round;
}

.small-button:active {

    transform: scale(.96);
}


/* =====================================================
   AI 送出
===================================================== */

.analyze-button {

    height: 42px;

    border-radius: 14px;

    border:
        1px solid
        rgba(210,160,255,.28);

    background:
        linear-gradient(
            135deg,
            rgba(135,65,225,.7),
            rgba(85,35,160,.62)
        );

    color: #fff;

    padding:
        0 18px;

    font-size: 13px;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 8px 25px
        rgba(110,50,190,.16);
}

.analyze-button:active {

    transform: scale(.97);
}

.analyze-button:disabled {

    opacity: .45;

    cursor: default;
}


/* =====================================================
   AI 回應
===================================================== */

.ai-result {

    display: none;

    margin-top: 14px;

    padding: 15px;

    border-radius: 16px;

    background:
        rgba(110,55,180,.1);

    border:
        1px solid
        rgba(200,150,255,.13);
}

.ai-result.show {

    display: block;
}

.result-label {

    margin-bottom: 8px;

    font-size: 10px;

    letter-spacing: 2px;

    color:
        rgba(210,170,255,.65);
}

.result-text {

    white-space: pre-wrap;

    word-break: break-word;

    font-size: 13px;

    line-height: 1.8;

    color:
        rgba(255,255,255,.82);
}


/* =====================================================
   選項
===================================================== */

.options {

    display: none;

    margin-top: 13px;

    gap: 8px;

    flex-direction: column;
}

.options.show {

    display: flex;
}

.option-button {

    width: 100%;

    min-height: 48px;

    text-align: left;

    border-radius: 13px;

    border:
        1px solid
        rgba(205,155,255,.14);

    background:
        rgba(255,255,255,.045);

    color:
        rgba(255,255,255,.76);

    padding:
        10px 13px;

    font-size: 12px;

    line-height: 1.55;

    cursor: pointer;
}

.option-button:active {

    transform: scale(.99);

    background:
        rgba(135,65,225,.15);
}


/* =====================================================
   Loading
===================================================== */

.loading {

    display: none;

    align-items: center;

    gap: 6px;

    margin-top: 12px;

    color:
        rgba(255,255,255,.4);

    font-size: 11px;
}

.loading.show {

    display: flex;
}

.loading-dot {

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:
        rgba(205,155,255,.8);

    animation:
        loadDot 1.2s infinite;
}

.loading-dot:nth-child(2) {
    animation-delay: .15s;
}

.loading-dot:nth-child(3) {
    animation-delay: .3s;
}

@keyframes loadDot {

    0%,60%,100% {
        opacity: .2;
    }

    30% {
        opacity: 1;
    }
}


/* =====================================================
   任務
===================================================== */

.task-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        15px 16px;

    border-bottom:
        1px solid
        rgba(255,255,255,.055);
}

.task-count {

    font-size: 11px;

    color:
        rgba(255,255,255,.4);
}

.add-task-button {

    width: 34px;
    height: 34px;

    border-radius: 10px;

    border:
        1px solid
        rgba(205,155,255,.18);

    background:
        rgba(120,60,190,.12);

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;
}

.add-task-button svg {

    width: 18px;
    height: 18px;

    fill: none;

    stroke:
        rgba(230,210,255,.85);

    stroke-width: 1.5;
}


/* =====================================================
   Task
===================================================== */

.task-list {

    width: 100%;
}

.task {

    min-height: 61px;

    display: flex;

    align-items: center;

    gap: 12px;

    padding:
        10px 16px;

    border-bottom:
        1px solid
        rgba(255,255,255,.045);
}

.task:last-child {

    border-bottom: none;
}

.task-check {

    width: 23px;
    height: 23px;

    flex: 0 0 23px;

    border-radius: 7px;

    border:
        1px solid
        rgba(205,155,255,.3);

    background:
        transparent;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;
}

.task-check svg {

    width: 15px;
    height: 15px;

    display: none;

    fill: none;

    stroke:
        #fff;

    stroke-width: 2;
}

.task.completed
.task-check {

    background:
        rgba(135,65,225,.5);

    border-color:
        rgba(205,155,255,.45);
}

.task.completed
.task-check svg {

    display: block;
}

.task-text {

    flex: 1;

    min-width: 0;

    font-size: 13px;

    line-height: 1.5;

    word-break: break-word;
}

.task.completed
.task-text {

    text-decoration:
        line-through;

    color:
        rgba(255,255,255,.3);
}

.delete-task {

    width: 32px;
    height: 32px;

    flex: 0 0 32px;

    border: none;

    background: transparent;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;
}

.delete-task svg {

    width: 17px;
    height: 17px;

    fill: none;

    stroke:
        rgba(255,255,255,.28);

    stroke-width: 1.4;
}


/* =====================================================
   Reminder
===================================================== */

.reminder-row {

    min-height: 70px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    padding:
        13px 16px;
}

.reminder-left {

    display: flex;

    align-items: center;

    gap: 12px;
}

.reminder-icon {

    width: 39px;
    height: 39px;

    border-radius: 12px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(125,65,190,.12);

    border:
        1px solid
        rgba(205,155,255,.13);
}

.reminder-icon svg {

    width: 19px;
    height: 19px;

    fill: none;

    stroke:
        rgba(225,200,255,.82);

    stroke-width: 1.4;
}

.reminder-title {

    font-size: 13px;

    margin-bottom: 4px;
}

.reminder-desc {

    font-size: 10px;

    color:
        rgba(255,255,255,.38);
}


/* =====================================================
   Switch
===================================================== */

.switch {

    width: 48px;
    height: 27px;

    flex: 0 0 48px;

    border-radius: 20px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.11);

    position: relative;

    cursor: pointer;
}

.switch::after {

    content: "";

    position: absolute;

    width: 19px;
    height: 19px;

    top: 3px;
    left: 3px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.72);

    transition: .22s ease;
}

.switch.active {

    background:
        rgba(130,65,220,.5);

    border-color:
        rgba(205,155,255,.35);
}

.switch.active::after {

    transform:
        translateX(21px);

    background: #fff;
}


/* =====================================================
   Footer
===================================================== */

.footer {

    text-align: center;

    padding:
        10px 20px 40px;

    font-size: 10px;

    letter-spacing: 1.5px;

    color:
        rgba(255,255,255,.22);
}


/* =====================================================
   Toast
===================================================== */

.toast {

    position: fixed;

    left: 50%;

    bottom: 28px;

    z-index: 100;

    max-width:
        calc(100% - 40px);

    transform:
        translate(-50%, 20px);

    padding:
        11px 16px;

    border-radius: 13px;

    background:
        rgba(35,20,55,.95);

    border:
        1px solid
        rgba(205,155,255,.2);

    color:
        rgba(255,255,255,.86);

    font-size: 11px;

    opacity: 0;

    pointer-events: none;

    transition: .25s ease;
}

.toast.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =====================================================
   手機
===================================================== */

@media (max-width: 420px) {

    .header h1 {
        font-size: 27px;
    }

    .ai-actions {
        align-items: stretch;
    }

    .ai-action-left {
        flex: 1;
    }

    .analyze-button {
        padding: 0 13px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     星空
===================================================== -->

<div id="space">

    <div class="nebula one"></div>

    <div class="nebula two"></div>

</div>


<div class="app">


<!-- =====================================================
     Topbar
===================================================== -->

<header class="topbar">

    <div class="top-left">

        <button
            class="home-button"
            id="homeButton"
            type="button"
            aria-label="Home">

            <svg viewBox="0 0 24 24">

                <path d="M3 10.5L12 3l9 7.5"></path>

                <path d="M5.5 9.5V21h13V9.5"></path>

                <path d="M9.5 21v-6h5v6"></path>

            </svg>

        </button>


        <div class="page-title">

            <div class="page-title-main">
                我的事情
            </div>

            <div class="page-title-sub">
                LIFE CONTROL SPACE
            </div>

        </div>

    </div>


    <!-- Voice -->

    <button
        class="voice-button"
        id="voiceButton"
        type="button"
        aria-label="語音輸入">

        <svg viewBox="0 0 24 24">

            <rect
                x="9"
                y="4"
                width="6"
                height="11"
                rx="3">
            </rect>

            <path d="M6 11a6 6 0 0 0 12 0"></path>

            <path d="M12 17v3"></path>

            <path d="M9 20h6"></path>

        </svg>

    </button>

</header>


<!-- =====================================================
     Header
===================================================== -->

<section class="header">

    <h1>
        人生操作台
    </h1>

    <p>
        不只是記錄事情。
        <br>
        你可以把正在面對的問題交給玄境，
        一起分析、整理，再決定下一步。
    </p>

</section>


<!-- =====================================================
     AI
===================================================== -->

<section class="section">

    <div class="section-title">
        玄境 AI
    </div>


    <div class="card ai-card">


        <div class="ai-intro">

            <div class="ai-symbol">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="7">
                    </circle>

                    <path d="M9 12h6"></path>

                    <path d="M12 9v6"></path>

                </svg>

            </div>


            <div>

                <div class="ai-intro-title">
                    把事情告訴我
                </div>

                <div class="ai-intro-text">
                    可以是工作、學習、創業、家庭、
                    人際關係、情緒，或任何你正在面對的事。
                </div>

            </div>

        </div>


        <!-- Input -->

        <div class="input-box">

            <textarea
                id="lifeInput"
                placeholder="例如：我最近有一件事情很煩，不知道應該怎麼處理……"
            ></textarea>

        </div>


        <!-- Actions -->

        <div class="ai-actions">


            <div class="ai-action-left">

                <!-- Voice -->

                <button
                    class="small-button"
                    id="inputVoiceButton"
                    type="button">

                    <svg viewBox="0 0 24 24">

                        <rect
                            x="9"
                            y="4"
                            width="6"
                            height="11"
                            rx="3">
                        </rect>

                        <path d="M6 11a6 6 0 0 0 12 0"></path>

                    </svg>

                    語音

                </button>


                <!-- Clear -->

                <button
                    class="small-button"
                    id="clearButton"
                    type="button">

                    <svg viewBox="0 0 24 24">

                        <path d="M5 7h14"></path>

                        <path d="M9 7V4h6v3"></path>

                        <path d="M7 7l1 13h8l1-13"></path>

                    </svg>

                    清除

                </button>

            </div>


            <button
                class="analyze-button"
                id="analyzeButton"
                type="button">

                交給玄境分析

            </button>

        </div>


        <!-- Loading -->

        <div
            class="loading"
            id="loading">

            <span>玄境正在思考</span>

            <span class="loading-dot"></span>

            <span class="loading-dot"></span>

            <span class="loading-dot"></span>

        </div>


        <!-- AI Result -->

        <div
            class="ai-result"
            id="aiResult">

            <div class="result-label">
                玄境分析
            </div>

            <div
                class="result-text"
                id="resultText">
            </div>

            <div
                class="options"
                id="options">
            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     今天的事情
===================================================== -->

<section class="section">

    <div class="section-title">
        今天
    </div>


    <div class="card">


        <div class="task-header">

            <div class="task-count">
                我的事情
            </div>


            <button
                class="add-task-button"
                id="addTaskButton"
                type="button"
                aria-label="新增事情">

                <svg viewBox="0 0 24 24">

                    <path d="M12 5v14"></path>

                    <path d="M5 12h14"></path>

                </svg>

            </button>

        </div>


        <div
            class="task-list"
            id="taskList">
        </div>

    </div>

</section>


<!-- =====================================================
     Reminder
===================================================== -->

<section class="section">

<script>

/* =====================================================
   玄境 Life
===================================================== */


/* =====================================================
   1. AI URL
===================================================== */

const FALLBACK_SUPABASE_URL =
    "https://zuypaeagxjezlqdppvnm.supabase.co";

const FALLBACK_AI_URL =
    FALLBACK_SUPABASE_URL +
    "/functions/v1/ai-chat";


let AI_FUNCTION_URL =
    FALLBACK_AI_URL;


if (
    typeof XUANJING_CONFIG !==
    "undefined"
) {

    if (
        XUANJING_CONFIG.ai &&
        XUANJING_CONFIG.ai.url
    ) {

        AI_FUNCTION_URL =
            XUANJING_CONFIG.ai.url;

    }

}


/* =====================================================
   2. DOM
===================================================== */

const lifeInput =
    document.getElementById(
        "lifeInput"
    );

const analyzeButton =
    document.getElementById(
        "analyzeButton"
    );

const aiResult =
    document.getElementById(
        "aiResult"
    );

const resultText =
    document.getElementById(
        "resultText"
    );

const options =
    document.getElementById(
        "options"
    );

const loading =
    document.getElementById(
        "loading"
    );

const taskList =
    document.getElementById(
        "taskList"
    );

const toast =
    document.getElementById(
        "toast"
    );

const reminderSwitch =
    document.getElementById(
        "reminderSwitch"
    );


/* =====================================================
   3. Toast
===================================================== */

let toastTimer;

function showToast(
    text
) {

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            function () {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =====================================================
   4. Home
===================================================== */

document
    .getElementById(
        "homeButton"
    )
    .addEventListener(
        "click",
        function () {

            window.location.href =
                "home.html";

        }
    );


/* =====================================================
   5. Tasks
===================================================== */

const TASK_KEY =
    "xuanjing_life_tasks";


let tasks =
    JSON.parse(
        localStorage.getItem(
            TASK_KEY
        ) || "[]"
    );


function saveTasks() {

    localStorage.setItem(
        TASK_KEY,
        JSON.stringify(tasks)
    );

}


function renderTasks() {

    taskList.innerHTML =
        "";


    if (!tasks.length) {

        const empty =
            document.createElement(
                "div"
            );

        empty.style.padding =
            "25px 16px";

        empty.style.textAlign =
            "center";

        empty.style.fontSize =
            "12px";

        empty.style.color =
            "rgba(255,255,255,.32)";

        empty.textContent =
            "今天還沒有事情";

        taskList.appendChild(
            empty
        );

        return;

    }


    tasks.forEach(
        function (task) {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "task";

            if (task.completed) {

                row.classList.add(
                    "completed"
                );

            }


            /* checkbox */

            const check =
                document.createElement(
                    "button"
                );

            check.type =
                "button";

            check.className =
                "task-check";

            check.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <path d="M5 12l4 4L19 7"></path>
                </svg>
            `;


            check.addEventListener(
                "click",
                function () {

                    task.completed =
                        !task.completed;

                    saveTasks();

                    renderTasks();

                }
            );


            /* text */

            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "task-text";

            text.textContent =
                task.text;


            /* delete */

            const del =
                document.createElement(
                    "button"
                );

            del.type =
                "button";

            del.className =
                "delete-task";

            del.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <path d="M5 7h14"></path>
                    <path d="M9 7V4h6v3"></path>
                    <path d="M7 7l1 13h8l1-13"></path>
                </svg>
            `;


            del.addEventListener(
                "click",
                function () {

                    tasks =
                        tasks.filter(
                            function (item) {

                                return item.id !==
                                    task.id;

                            }
                        );

                    saveTasks();

                    renderTasks();

                }
            );


            row.appendChild(
                check
            );

            row.appendChild(
                text
            );

            row.appendChild(
                del
            );

            taskList.appendChild(
                row
            );

        }
    );

}


renderTasks();


/* =====================================================
   6. 新增事情
===================================================== */

document
    .getElementById(
        "addTaskButton"
    )
    .addEventListener(
        "click",
        function () {

            const text =
                prompt(
                    "今天想記下什麼事情？"
                );


            if (
                !text ||
                !text.trim()
            ) {

                return;

            }


            tasks.push({

                id:
                    Date.now(),

                text:
                    text.trim(),

                completed:
                    false

            });


            saveTasks();

            renderTasks();

            showToast(
                "事情已新增"
            );

        }
    );


/* =====================================================
   7. 清除輸入
===================================================== */

document
    .getElementById(
        "clearButton"
    )
    .addEventListener(
        "click",
        function () {

            lifeInput.value =
                "";

            aiResult.classList.remove(
                "show"
            );

            options.classList.remove(
                "show"
            );

            options.innerHTML =
                "";

        }
    );


/* =====================================================
   8. AI 回應解析
===================================================== */

function extractAIText(
    data
) {

    if (!data) {
        return "";
    }


    if (
        typeof data ===
        "string"
    ) {

        return data;

    }


    const candidates = [

        data.reply,

        data.response,

        data.message,

        data.content,

        data.text,

        data.output,

        data.data?.reply,

        data.data?.response,

        data.data?.message,

        data.data?.content,

        data.data?.text,

        data.result?.reply,

        data.result?.response,

        data.result?.message,

        data.result?.content

    ];


    for (
        const value
        of candidates
    ) {

        if (
            typeof value ===
                "string" &&
            value.trim()
        ) {

            return value.trim();

        }

    }


    return "";

}


/* =====================================================
   9. 顯示 AI
===================================================== */

function showAIResult(
    text
) {

    resultText.textContent =
        text;

    aiResult.classList.add(
        "show"
    );

    scrollAIIntoView();

}


/* =====================================================
   10. Scroll
===================================================== */

function scrollAIIntoView() {

    setTimeout(
        function () {

            aiResult.scrollIntoView({
                behavior:
                    "smooth",

                block:
                    "center"
            });

        },
        100
    );

}


/* =====================================================
   11. 從 AI 回應找選項
===================================================== */

function buildOptions(
    text
) {

    options.innerHTML =
        "";


    /*
      這裡不是固定假選項。

      嘗試從 AI 回覆中的
      「選項 1 / 方案 1 / ①」
      等內容抓取。
    */

    const lines =
        text.split("\n");


    const found = [];


    lines.forEach(
        function (line) {

            const clean =
                line.trim();


            if (
                /^(選項|方案|方法)\s*[1-9一二三四五六七八九十][：:.)、]/i
                    .test(clean)
            ) {

                found.push(
                    clean
                );

                return;

            }


            if (
                /^[①②③④⑤⑥⑦⑧⑨⑩]/.
                    test(clean)
            ) {

                found.push(
                    clean
                );

            }

        }
    );


    if (!found.length) {

        return;

    }


    found
        .slice(0, 8)
        .forEach(
            function (item) {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "option-button";

                button.textContent =
                    item;


                button.addEventListener(
                    "click",
                    function () {

                        lifeInput.value =
                            "我選擇你剛才提到的這個方案：\n" +
                            item +
                            "\n\n請繼續幫我分析下一步應該怎麼做。";

                        analyzeLife();

                    }
                );


                options.appendChild(
                    button
                );

            }
        );


    if (
        options.children.length
    ) {

        options.classList.add(
            "show"
        );

    }

}


/* =====================================================
   12. AI 分析
===================================================== */

let analyzing = false;


async function analyzeLife() {

    if (analyzing) {
        return;
    }


    const text =
        lifeInput.value.trim();


    if (!text) {

        showToast(
            "請先告訴玄境你正在面對什麼事情"
        );

        lifeInput.focus();

        return;

    }


    analyzing =
        true;

    analyzeButton.disabled =
        true;

    loading.classList.add(
        "show"
    );

    aiResult.classList.remove(
        "show"
    );

    options.classList.remove(
        "show"
    );

    options.innerHTML =
        "";


    try {

        const systemInstruction =
            `
你現在是「玄境 AI」的人生協助者。

你的核心原則：
1. 以人為本，以人的利益、尊嚴與選擇權為核心。
2. 不替使用者做人生決定。
3. 先理解問題，再分析。
4. 如果資訊不足，要明確指出缺少什麼。
5. 不要假裝知道不知道的事情。
6. 面對問題時，盡量提供多個合理方案。
7. 方案要說明優點、缺點、成本、時間、難度與風險（適用時）。
8. 可以主動詢問關鍵問題。
9. 不只給答案，要協助使用者找到下一步。
10. 語氣自然、人性化，不要像制式客服。
        `.trim();


        const userMessage =
            systemInstruction +
            "\n\n使用者現在告訴你的事情：\n" +
            text;


        const response =
            await fetch(
                AI_FUNCTION_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                userMessage,

                            messages: [

                                {
                                    role:
                                        "user",

                                    content:
                                        userMessage

                                }

                            ]

                        })

                }
            );


        const raw =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(
                    raw
                );

        } catch {

            data =
                raw;

        }


        if (!response.ok) {

            throw new Error(
                "AI 服務錯誤 " +
                response.status +
                (
                    raw
                        ? "｜" +
                          raw.slice(
                              0,
                              300
                          )
                        : ""
                )
            );

        }


        const aiText =
            extractAIText(
                data
            );


        if (!aiText) {

            throw new Error(
                "AI 已回應，但沒有取得文字內容。"
            );

        }


        showAIResult(
            aiText
        );


        buildOptions(
            aiText
        );


    } catch (error) {

        console.error(
            "Life AI Error:",
            error
        );


        showAIResult(
            "玄境目前無法完成 AI 分析。\n\n" +
            "錯誤：\n" +
            error.message
        );


        showToast(
            "AI 連線發生問題"
        );


    } finally {

        analyzing =
            false;

        analyzeButton.disabled =
            false;

        loading.classList.remove(
            "show"
        );

    }

}


/* =====================================================
   13. AI Button
===================================================== */

analyzeButton.addEventListener(
    "click",
    function () {

        analyzeLife();

    }
);


/* =====================================================
   14. 語音輸入
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;

let recognizing =
    false;


function startVoice() {

    if (!SpeechRecognition) {

        showToast(
            "目前瀏覽器不支援網頁語音辨識"
        );

        return;

    }


    if (recognizing) {

        recognition.stop();

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;

    recognition.interimResults =
        true;

    recognition.maxAlternatives =
        1;

    recognition.lang =
        "zh-TW";


    recognition.onstart =
        function () {

            recognizing =
                true;

            document
                .getElementById(
                    "voiceButton"
                )
                .classList.add(
                    "active"
                );

            document
                .getElementById(
                    "inputVoiceButton"
                )
                .classList.add(
                    "voice-active"
                );

            showToast(
                "正在聆聽，請說話"
            );

        };


    recognition.onresult =
        function (event) {

            let transcript =
                "";


            for (
                let i =
                    event.resultIndex;
                i <
                    event.results.length;
                i++
            ) {

                transcript +=
                    event.results[i][0]
                        .transcript;

            }


            if (
                transcript.trim()
            ) {

                lifeInput.value =
                    transcript;

            }

        };


    recognition.onerror =
        function (event) {

            console.error(
                "Voice Error:",
                event
            );


            if (
                event.error ===
                "not-allowed"
            ) {

                showToast(
                    "麥克風權限被拒絕"
                );

            } else {

                showToast(
                    "語音辨識失敗：" +
                    event.error
                );

            }

        };


    recognition.onend =
        function () {

            recognizing =
                false;

            document
                .getElementById(
                    "voiceButton"
                )
                .classList.remove(
                    "active"
                );

            document
                .getElementById(
                    "inputVoiceButton"
                )
                .classList.remove(
                    "voice-active"
                );

        };


    try {

        recognition.start();

    } catch (error) {

        console.error(
            error
        );

        showToast(
            "無法啟動語音：" +
            error.message
        );

    }

}


/* =====================================================
   15. Voice Buttons
===================================================== */

document
    .getElementById(
        "voiceButton"
    )
    .addEventListener(
        "click",
        startVoice
    );


document
    .getElementById(
        "inputVoiceButton"
    )
    .addEventListener(
        "click",
        startVoice
    );


/* =====================================================
   16. Reminder
===================================================== */

let reminderEnabled =
    localStorage.getItem(
        "xuanjing_life_reminder"
    ) === "true";


function refreshReminder() {

    if (reminderEnabled) {

        reminderSwitch.classList.add(
            "active"
        );

    } else {

        reminderSwitch.classList.remove(
            "active"
        );

    }

}


refreshReminder();


reminderSwitch.addEventListener(
    "click",
    async function () {

        if (!reminderEnabled) {

            if (
                "Notification"
                in window
            ) {

                try {

                    const permission =
                        await Notification.requestPermission();


                    if (
                        permission !==
                        "granted"
                    ) {

                        showToast(
                            "你沒有允許通知"
                        );

                        return;

                    }

                } catch (error) {

                    console.error(
                        error
                    );

                }

            }

        }


        reminderEnabled =
            !reminderEnabled;


        localStorage.setItem(
            "xuanjing_life_reminder",
            String(
                reminderEnabled
            )
        );


        refreshReminder();


        showToast(
            reminderEnabled
                ? "玄境提醒已開啟"
                : "玄境提醒已關閉"
        );

    }
);


/* =====================================================
   17. 星空
===================================================== */

function createStars() {

    const space =
        document.getElementById(
            "space"
        );


    for (
        let i = 0;
        i < 150;
        i++
    ) {

        const star =
            document.createElement(
                "div"
            );

        star.className =
            "star";


        star.style.left =
            Math.random() * 100 +
            "%";


        star.style.top =

            Math.random() < .88

                : 2;

            size + "px";

        star.style.height =
            size + "px";


        star.style.animationDelay =
            Math.random() * 5 +

        star.style.animationDuration =
            2 +
            Math.random() * 4 +
            "s";


        space.appendChild(
            star
        );

    }

}


createStars();

function createMeteor() {

        document.createElement(
            "div"
        );

    meteor.className =
        "meteor";


    meteor.style.left =
        70 +
        Math.random() * 40 +

    );

    );

setInterval(
    function () {

        if (
            Math.random() > .3
        ) {

            createMeteor();

        }

    },
    6500
);


/* =====================================================
   19. 僅限制整頁左右移動
   保留上下滑動
===================================================== */

let touchStartX = 0;
let touchStartY = 0;


document.addEventListener(
    "touchstart",
    function (event) {

        if (
            !event.touches.length
        ) {

            return;

        }


        touchStartX =
            event.touches[0]
                .clientX;

        touchStartY =
            event.touches[0]
                .clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchmove",
    function (event) {

        if (
            !event.touches.length
        ) {

            return;

        }


        const x =
            event.touches[0]
                .clientX;

        const y =
            event.touches[0]
                .clientY;


        const dx =
            x -
            touchStartX;

        const dy =
            y -
            touchStartY;


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);

   20. 初始化
===================================================== */

console.log(
    "玄境 Life 啟動"
);

console.log(
    "AI URL:",
    AI_FUNCTION_URL
);

</script>
